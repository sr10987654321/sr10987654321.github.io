<!doctype html><html lang="en-AU"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"><title>SMARTIES // FRACTION LAB</title><style>
:root{--ink:#18223d;--muted:#637087;--bg:#f7f8fc;--pink:#ed4a93;--violet:#6855e7;--mint:#1ac7a7;--gold:#ffb637;--blue:#38a6e9;--card:#fff;--red:#ed6060}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#11152b;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #f6b02d;outline-offset:3px}
#presentation{height:100dvh;width:100vw;position:relative;background:#f7f8fc;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.slide{width:100%;height:100%;overflow:auto;position:relative;padding:clamp(22px,3.2vw,66px) clamp(24px,5vw,100px) clamp(45px,4vw,76px);background:#f8f9fc;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vw,28px)}
.slide.dark{background:radial-gradient(circle at 95% 15%,#393169,#151a33 53%,#0c1025);color:white}.slide.pink{background:linear-gradient(132deg,#ffdfed,#ffeff3 45%,#f8f8ff)}.slide.mint{background:linear-gradient(132deg,#d6fbef,#eefff9 44%,#f8f9ff)}.slide.gold{background:linear-gradient(132deg,#fff3c7,#fff9df 60%,#fff)}.slide.purple{background:linear-gradient(135deg,#e7e1ff,#f9f7ff 50%,#f9fcff)}
.kicker{text-transform:uppercase;font-size:clamp(12px,1.15vw,19px);letter-spacing:.22em;font-weight:900;color:#9b56e7}.dark .kicker{color:#91f1d3}h1{font-size:clamp(48px,6.8vw,118px);line-height:.96;letter-spacing:-.065em;margin:0;max-width:1100px;font-weight:950}h2{font-size:clamp(39px,5vw,83px);line-height:1.02;letter-spacing:-.05em;margin:0;max-width:1400px;font-weight:900}h3{font-size:clamp(23px,2.5vw,42px);line-height:1.15;margin:0;font-weight:850}.lede{font-size:clamp(21px,2.25vw,38px);line-height:1.33;font-weight:550;max-width:1200px;margin:0}.sm{font-size:clamp(17px,1.55vw,27px);line-height:1.35}.muted{color:var(--muted)}.dark .muted{color:#c5c9d9}.accent{color:var(--pink)}.purpleText{color:var(--violet)}.greenText{color:#009e83}.num{font-variant-numeric:tabular-nums;font-weight:900}.fraction{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;font-size:1.25em;font-weight:900;line-height:.98;min-width:1.1em}.fraction .den{border-top:solid .075em currentColor;min-width:1.2em;padding-top:.1em}.fraction .top{padding-bottom:.1em}.equation{font-size:clamp(38px,5.7vw,88px);font-weight:900;letter-spacing:-.035em;display:flex;align-items:center;flex-wrap:wrap;gap:18px}.pill{display:inline-flex;border-radius:1000px;padding:10px 20px;align-items:center;background:rgba(104,85,231,.12);color:#543fd9;font-size:clamp(15px,1.5vw,25px);font-weight:850}.dark .pill{background:#302b67;color:#eee8ff}.overline{font-weight:900;letter-spacing:.1em;font-size:clamp(14px,1.2vw,18px);text-transform:uppercase}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(13px,2vw,29px)}.card{border-radius:26px;background:white;padding:clamp(18px,2vw,35px);box-shadow:0 6px 30px #101b3b10;border:2px solid #e9edf4}.dark .card{background:#222a49;color:white;border-color:#3b4265}.card b{font-size:clamp(23px,2vw,36px)}.card p{font-size:clamp(18px,1.7vw,29px);line-height:1.28;margin:8px 0 0}.narrow{max-width:950px}.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,66px);align-items:center}.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:14px}.miniList{font-size:clamp(20px,1.85vw,31px);line-height:1.42}.miniList li{margin-bottom:12px}.bigNumber{font-size:clamp(75px,11vw,180px);line-height:1;font-weight:950;letter-spacing:-.07em}.ribbon{border-radius:20px;background:#edeaff;padding:16px 23px;color:#4b3cb0;font-size:clamp(17px,1.55vw,26px);font-weight:750}.dark .ribbon{background:#352f5f;color:#f4eafd}
.candy{width:clamp(44px,4.2vw,74px);height:clamp(44px,4.2vw,74px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,1.7vw,30px);font-weight:950;color:rgba(255,255,255,.87);box-shadow:inset -7px -8px 1px #00000012,inset 5px 6px 0 #ffffff36,0 5px 8px #11111b25;user-select:none;position:relative}.candy:before{content:'';position:absolute;border-radius:50%;width:55%;height:25%;top:9%;left:19%;background:#ffffff1b;transform:rotate(-25deg)}.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,.7vw,12px);padding:12px;border:4px solid #d7dceb;background:#f8faff;border-radius:22px;width:fit-content}.tray .cell{width:clamp(55px,6.1vw,98px);height:clamp(56px,5.9vw,91px);display:flex;align-items:center;justify-content:center;border:2px dashed #c4cde0;border-radius:12px}.tray .candy{width:75%;height:75%;font-size:clamp(18px,2vw,30px)}.tray.smalltray .cell{width:clamp(30px,3vw,45px);height:clamp(30px,3vw,45px)}.tray.smalltray .candy{font-size:clamp(14px,1.5vw,22px)}.tray.darktray{background:#222845;border-color:#4a5173}.tray.darktray .cell{border-color:#4a5173}.trayLabel{font-size:clamp(15px,1.6vw,23px);font-weight:850;padding:4px 0}.flat{display:flex;gap:10px;align-items:center}.stat{border-radius:20px;background:#f0f2fa;padding:13px 18px;font-size:clamp(18px,1.85vw,29px);font-weight:800}.stat strong{font-size:1.4em}
.btn{padding:13px 25px;border-radius:18px;border:2px solid #d9deea;background:#fff;color:#283050;font-size:clamp(18px,1.6vw,28px);font-weight:850;box-shadow:0 4px 10px #121a3711}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 15px #121a3722}.btn.primary{color:#fff;background:#6555e7;border-color:#6555e7}.btn.teal{background:#06a98f;border-color:#06a98f;color:white}.btn.small{padding:9px 16px;border-radius:13px;font-size:clamp(14px,1.2vw,20px)}.btn:disabled{opacity:.4;cursor:not-allowed}.palette{display:flex;flex-wrap:wrap;gap:12px}.swatch{width:44px;height:44px;border:4px solid transparent;border-radius:50%;box-shadow:0 2px 4px #19183030}.swatch.active{outline:4px solid #6f57db;outline-offset:2px}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;gap:15px;align-items:flex-start;font-size:clamp(19px,1.9vw,31px);font-weight:730}.tick{width:36px;height:36px;border:3px solid #13ad90;border-radius:11px;flex:none}.answers{display:none}.answers.shown{display:block}.answerBlock{background:#e9fff6;border:2px solid #9bdfcc;border-radius:20px;padding:14px 25px;color:#145b50;font-size:clamp(22px,2.4vw,41px);font-weight:850}
#bar{flex:none;position:relative;z-index:9;display:flex;align-items:center;gap:9px;padding:10px clamp(10px,2vw,28px);background:#12152c;color:#d6d9ef;min-height:62px}.brand{letter-spacing:.14em;font-size:12px;font-weight:950;white-space:nowrap;margin-right:auto;color:#fff}.nav{border:1px solid #474a67;background:#282e4b;color:white;border-radius:11px;padding:8px 14px;font-size:14px;font-weight:750}.nav:hover{background:#363e66}.nav:disabled{opacity:.35}.count{font-size:14px;min-width:54px;text-align:center}.progress{height:5px;background:#343950;position:relative;z-index:10}.progress div{height:100%;background:linear-gradient(90deg,#ed4a93,#f5bd58,#52e4ba);transition:width .2s}.topicNav{display:flex;gap:6px;overflow:auto;scrollbar-width:none;max-width:58vw}.topicNav button{border:0;border-radius:8px;background:transparent;color:#9aa3c3;font-size:12px;padding:7px 9px;white-space:nowrap;font-weight:750}.topicNav button.active{background:#4c3fa9;color:white}
#notes{position:absolute;bottom:60px;right:15px;width:min(530px,52vw);max-height:60vh;overflow:auto;background:#fff9e2;color:#40351d;border:2px solid #ffd468;box-shadow:0 18px 50px #10101a5c;border-radius:20px;padding:18px 24px;font-size:16px;z-index:7;display:none}#notes.open{display:block}#notes strong{display:block;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.candyFloat{position:absolute;right:3vw;top:6vh;opacity:.9;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;transform:rotate(-11deg)}.candyFloat .candy{width:clamp(65px,7vw,140px);height:clamp(65px,7vw,140px);font-size:clamp(23px,3vw,56px)}.prompt{display:inline-block;background:#fce6f1;padding:12px 20px;border-radius:14px;font-size:clamp(24px,2.6vw,42px);font-weight:900;color:#a51c65}.dark .prompt{background:#57305c;color:#ffdef2}.timer{font-size:clamp(100px,16vw,270px);font-weight:950;line-height:1;letter-spacing:-.09em;font-variant-numeric:tabular-nums}.smallCaption{font-size:clamp(15px,1.5vw,22px);font-weight:730;color:#67718c}.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:12px}.keypad button{height:68px;border-radius:15px;border:0;background:#e7e9f5;font-size:32px;font-weight:950;color:#27314d}.keypad button:hover{background:#dadbf7}.keypad button:nth-child(10),.keypad button:nth-child(12){font-size:16px;letter-spacing:-.05em}.lockInput{font-size:55px;letter-spacing:.2em;font-weight:950;padding:12px 25px;border-radius:18px;background:#202644;color:white;min-width:250px;text-align:center}.revealBtn{align-self:flex-start}
@media(max-width:780px){.slide{padding:22px 20px 35px}.split{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.candyFloat{opacity:.2;pointer-events:none}.topicNav{display:none}.tray .cell{width:54px;height:54px}.tray.smalltray .cell{width:35px;height:35px}#notes{width:90vw;right:3vw}.brand{font-size:10px}#bar{gap:4px}.nav{padding:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="presentation"><div class="progress"><div id="progress"></div></div><main id="stage"></main><aside id="notes"></aside><footer id="bar"><div class="brand">SMARTIES // FRACTION LAB</div><div class="topicNav" id="topics"></div><button class="nav" id="prev">← BACK</button><span class="count" id="counter"></span><button class="nav" id="next">NEXT →</button><button class="nav" id="noteBtn" title="Teacher notes (N)">NOTES</button><button class="nav" id="fullBtn" title="Fullscreen (F)">⛶</button></footer></div><script>
'use strict';
const COLORS=[['red','#e95164'],['blue','#3685e3'],['yellow','#f4b62c'],['green','#34b76f'],['orange','#fa8240'],['purple','#9562d6'],['pink','#ed70a8'],['brown','#9c6949']];
const defaultTray=['red','red','red','red','red','red','blue','blue','blue','blue','green','green'];
let modelTray=[...defaultTray],paint='blue',hasRevealed={},extra=15,timerInterval=null,seconds=12*60,timerRunning=false,code='';
function frac(a,b){return `<span class="fraction"><span class="top">${a}</span><span class="den">${b}</span></span>`}
function gcd(a,b){while(b){let t=b;b=a%b;a=t}return a||1}
function candy(c,txt='s'){const match=COLORS.find(x=>x[0]===c);return `<span class="candy" style="background:${match?match[1]:c}">${txt}</span>`}
function makeTray(n=12,high=n,cls=''){let arr=[];for(let i=0;i<12;i++)arr.push(`<div class="cell">${i<high?candy(i%3===0?'pink':'purple'):''}</div>`);return `<div class="tray ${cls}">${arr.join('')}</div>`}
function fillTray(colors,clicked=false){return `<div class="tray ${clicked?'taptray':''}">${colors.map((c,i)=>`<div class="cell">${clicked?`<button style="padding:0;border:0;background:none;display:flex;width:100%;height:100%;align-items:center;justify-content:center" aria-label="Change square ${i+1} colour" onclick="repaint(${i})">${candy(c)}</button>`:candy(c)}</div>`).join('')}</div>`}
function countColours(arr){const cnt={};arr.forEach(c=>cnt[c]=(cnt[c]||0)+1);return cnt}
function s(theme,kicker,title,content,notes='',extra=''){return {theme,kicker,title,content,notes,extra}}
const slides=[
s('dark','Year 4 Maths | 100 minutes','SMARTIES.<br><span style="color:#6ae5b7">FRACTIONS.</span><br>BIG IDEAS.','<p class="lede">12 squares. A handful of colours. More than one whole.</p><div class="candyFloat">'+['red','yellow','blue','green','purple','orange'].map(c=>candy(c)).join('')+'</div>','Welcome. Use the Smarties, not just the written rule, to make the ideas visible. Do NOT hand out sweets yet.'),
s('purple','Today’s learning intention','I CAN SHOW A FRACTION IN MORE THAN ONE WAY.','<div class="cards"><div class="card"><b>1. Build</b><p>I can show fractions of a set of 12.</p></div><div class="card"><b>2. Rename</b><p>I can find simpler equivalent fractions.</p></div><div class="card"><b>3. Go beyond one</b><p>I can show more than one whole and explain a mixed number.</p></div></div>','Explain: The first two goals are the Year 4 core. The third is a hands-on preview of Year 5 content. Students needing support can stay on representing with two trays.'),
s('pink','Daily review | 5 minutes','WHAT DO YOU REMEMBER?','<div class="cards"><div class="card"><b>1</b><p>What does the denominator tell us?</p></div><div class="card"><b>2</b><p>How many quarters make one whole?</p></div><div class="card"><b>3</b><p>Is '+frac(2,4)+' the same as '+frac(1,2)+'?</p></div><div class="card"><b>4</b><p>Show '+frac(3,6)+' with your paper strip.</p></div></div>','Students answer using mini-whiteboards or finger signals. 4–5 mins; no sweets yet.'),
s('pink','Daily review | answers','PROVE IT WITH YOUR STRIPS.','<div class="cards"><div class="card"><b>Denominator</b><p>How many equal parts in the whole.</p></div><div class="card"><b>4 quarters</b><p>Four quarters make one whole.</p></div><div class="card"><b>'+frac(2,4)+' = '+frac(1,2)+'</b><p>Same amount, new name.</p></div><div class="card"><b>'+frac(3,6)+' = '+frac(1,2)+'</b><p>Three sixths covers half a strip.</p></div></div>','Ask one student to use paper strips to prove an answer.'),
s('purple','Launch | 3 minutes','TODAY, THE WHOLE = 12.','<div class="split"><div>'+makeTray()+'<div class="trayLabel">One complete tray = 12 Smarties</div></div><div class="stack"><h3>One box of 12 squares is our ONE WHOLE.</h3><p class="lede">The number of Smarties in a colour is the numerator. <b>12</b> is the denominator.</p></div></div>','Show a tray: equal-size whole is 12 Smarties in 12 positions. Important: a commercial packet is not guaranteed to contain exactly 12; teacher tops up or removes extras before collecting data.'),
s('mint','Investigation | set-up','BUILD YOUR 12.','<div class="cards"><div class="card"><b>01 — Count</b><p>Choose exactly 12 Smarties.</p></div><div class="card"><b>02 — Place</b><p>One Smartie in each square.</p></div><div class="card"><b>03 — Record</b><p>Colour in your paper diagram to match.</p></div></div><div class="ribbon">Keep extra Smarties to one side. We will use them later.</div>','Hand out: each student a mat, investigation sheet, box and top-up if needed. Do not begin until every child has exactly 12 in the tray.'),
s('gold','Lab rules | 2 minutes','SCIENTISTS DON’T EAT THE DATA.','<div class="cards"><div class="card"><b>Hands clean</b><p>Keep Smarties on your own clean paper.</p></div><div class="card"><b>Count first</b><p>Exactly 12 in the first tray.</p></div><div class="card"><b>No swaps yet</b><p>Record the colours you really have.</p></div><div class="card"><b>Wait to eat</b><p>Only when the teacher says.</p></div></div>','Check school food/allergy policy. Offer identical paper counters for students unable to handle or eat sweets. Check choking risks and local hygiene rules.'),
s('mint','Teacher model | interactive','HOW MANY OF EACH COLOUR?','<div class="split"><div id="editableTray"></div><div class="stack"><div class="overline">Click a colour, then tap a Smartie to change the model.</div><div class="palette" id="palette"></div><div id="fractionsLive"></div><button class="btn small primary revealBtn" onclick="resetColours()">RESET EXAMPLE</button></div></div>','Use the interactive tray. The default has 6 red, 4 blue, 2 green. Ask: blue is 4 out of 12. Repeat for each colour. With a live model students can compare their actual random box.'),
s('pink','Read the fraction','FOUR ARE BLUE.','<div class="split"><div>'+fillTray(defaultTray)+'</div><div class="stack"><div class="equation">'+frac(4,12)+' <span style="font-size:.6em">are blue</span></div><div class="lede">4 blue Smarties<br>out of 12 altogether.</div><div class="ribbon">Top number = colour count. Bottom number = original whole (12).</div></div></div>','Ask What is numerator? denominator? Invite students to describe a different colour. Unrepresented colours have 0/12.'),
s('purple','Part A | 12 minutes','RECORD YOUR REAL PACKET.','<div class="cards"><div class="card"><b>Count each colour.</b><p>Tally how many of each.</p></div><div class="card"><b>Write a fraction.</b><p>4 blue out of 12 → 4/12.</p></div><div class="card"><b>Check the total.</b><p>All your colour counts add up to 12.</p></div></div><div class="ribbon">Student sheet • Page 1 | Use your actual colours, not the teacher’s example.</div>','Run 10–12 minutes. Support students by pre-drawing tallies. Extend: find a colour with 0/12; compare greatest colour with least; combine 2 colours in one fraction.'),
s('dark','Big discovery','A FRACTION CAN HAVE TWO NAMES.','<div class="equation">'+frac(4,12)+' <span style="color:#7be5bd">=</span> '+frac(1,3)+'</div><p class="lede">Same four blue Smarties. Same 12-Smartie whole.<br>Just counted in larger equal groups.</p>','Group 12 into 3 equal groups of 4. Four blue pieces occupy one group of three if placed together: 4/12 = 1/3. This works for equivalent fractions of a collection.'),
s('purple','Explicit teaching | 7 minutes','SIMPLIFY = KEEP THE SAME AMOUNT.','<div class="cards"><div class="card"><b>STEP 1</b><p>Find a number that divides the top and the bottom.</p></div><div class="card"><b>STEP 2</b><p>Divide <b>both</b> numbers by it.</p></div><div class="card"><b>STEP 3</b><p>Check that your fraction represents the same amount.</p></div></div><div class="equation">'+frac(4,12)+' <span style="font-size:.4em;color:#a6a1c0">÷ 4 top & bottom</span> = '+frac(1,3)+'</div>','Model 4/12 as one third. Do NOT say 4/12 of any size whole is four Smarties; this uses the specific 12-Smartie set.'),
s('mint','One whole — three fractions','HOW FAR CAN YOU SIMPLIFY?','<div class="cards"><div class="card"><b>'+frac(6,12)+'</b><p>Think halves</p><button class="btn small primary" onclick="reveal(12)">REVEAL</button><div class="answers" id="ans12"><p class="answerBlock">'+frac(1,2)+'</p></div></div><div class="card"><b>'+frac(3,12)+'</b><p>Think quarters</p><button class="btn small primary" onclick="reveal(12)">REVEAL</button><div class="answers" id="ans12b"><p class="answerBlock">'+frac(1,4)+'</p></div></div><div class="card"><b>'+frac(2,12)+'</b><p>Think sixths</p><button class="btn small primary" onclick="reveal(12)">REVEAL</button><div class="answers" id="ans12c"><p class="answerBlock">'+frac(1,6)+'</p></div></div></div>','Allow whiteboards before reveal. All these connect to common fractions of a set.'),
s('gold','An important exception','CAN YOU SIMPLIFY '+frac(5,12)+'?','<div class="stack"><p class="lede">Is there a whole number bigger than 1 that divides <b>both</b> 5 and 12?</p><div class="row"><button class="btn primary" onclick="reveal(13)">CHECK ANSWER</button></div><div class="answers" id="ans13"><div class="answerBlock">No. '+frac(5,12)+' is already in simplest form.</div></div></div>','Key point: students’ boxes are random. Many colour counts may be 1/12, 5/12, 7/12 or 11/12 and cannot simplify. They have not done anything wrong.'),
s('pink','We do | 5 minutes','SIX FRACTIONS. ONE RULE.','<div class="cards"><div class="card"><b>'+frac(2,12)+'</b><p>→ ?</p></div><div class="card"><b>'+frac(8,12)+'</b><p>→ ?</p></div><div class="card"><b>'+frac(9,12)+'</b><p>→ ?</p></div><div class="card"><b>'+frac(6,12)+'</b><p>→ ?</p></div><div class="card"><b>'+frac(5,12)+'</b><p>→ ?</p></div><div class="card"><b>'+frac(10,12)+'</b><p>→ ?</p></div></div>','Use whiteboards. Ask which ones simplify and why. For weaker children first model 6/12, 4/12, 3/12, 2/12.'),
s('pink','Check the answers','THE FRACTIONS DID NOT CHANGE SIZE.','<div class="cards"><div class="card"><b>2/12 = 1/6</b></div><div class="card"><b>8/12 = 2/3</b></div><div class="card"><b>9/12 = 3/4</b></div><div class="card"><b>6/12 = 1/2</b></div><div class="card"><b>5/12 stays 5/12</b></div><div class="card"><b>10/12 = 5/6</b></div></div>','Invite one student to justify 8/12=2/3: divide numerator and denominator by four.'),
s('mint','Part B | 12 minutes','YOUR TURN: FIND EQUIVALENCE.','<div class="cards"><div class="card"><b>BUILD</b><p>Complete the three pictured examples using your strips or Smarties.</p></div><div class="card"><b>APPLY</b><p>Simplify each colour fraction in your own set.</p></div><div class="card"><b>EXTEND</b><p>Which colour totals from 0–12 can never simplify? Explain.</p></div></div><div class="ribbon">Student sheet • Page 2 | Additional differentiated practice pack</div>','Give 10–12 minutes. Students can move through pathways rather than being permanently labelled. Ask students to explain how they know, not just use division.'),
s('dark','A twist','NOW THE FACTORY SENDS MORE SMARTIES.','<div class="bigNumber" style="color:#73e8c1">+3</div><p class="lede">If 12 is one whole, what happens when we have 15?</p>','Physically give exactly 3 extra Smarties to each child (or three paper counters). Insist that the 12-cell tray remains the whole reference.'),
s('gold','STOP AND THINK','DOES THE WHOLE CHANGE?','<div class="cards"><div class="card"><b>Colour question</b><p>What fraction of the <b>new 15-Smartie collection</b> is blue? Denominator 15.</p></div><div class="card"><b>More-than-one-whole question</b><p>How many <b>12-Smartie wholes</b> do we have? Denominator 12.</p></div></div><div class="ribbon">Our new question is the SECOND one: how much compared with a 12-Smartie whole?</div>','Critical conceptual distinction. 15/12 is not the fraction of the new total belonging to a colour; it is a ratio of 15 items to one original whole of 12 items.'),
s('mint','Part C | move the Smarties','FILL ONE WHOLE. THEN KEEP GOING.','<div class="row" style="align-items:flex-start;gap:45px"><div><div class="trayLabel">Whole 1 — FULL (12)</div>'+fillTray(defaultTray)+'</div><div><div class="trayLabel">Whole 2 — 3 more</div>'+makeTray(12,3,'')+'</div></div><p class="lede">12 + 3 = 15 Smarties. That is one whole and three twelfths more.</p>','Students place the extra 3 on a SECOND blank tray, not squeezed into the first one. Colour quantity irrelevant now; counting all Smarties against a fixed-size group.'),
s('purple','New vocabulary | 6 minutes','WHEN THE TOP IS BIGGER…','<div class="split"><div><div class="equation">'+frac(15,12)+'</div><h3>Improper fraction</h3><p class="sm muted">15 twelfths: more than one complete group of 12.</p></div><div><div class="equation">1 '+frac(3,12)+'</div><h3>Mixed number</h3><p class="sm muted">1 whole, with 3 twelfths left over.</p></div></div>','Strict vocabulary: improper fraction numerator is greater than or equal to denominator; if equal, it is exactly a whole. Mixed numbers combine whole numbers and fractions. This is an introduction beyond Y4 core in 2026.'),
s('dark','We do | 7 minutes','15 TWELFTHS = ONE WHOLE + THREE TWELFTHS.','<div class="equation">'+frac(15,12)+' <span style="color:#73e8c1">=</span> 1 '+frac(3,12)+' <span style="color:#73e8c1">=</span> 1 '+frac(1,4)+'</div><p class="lede">12 Smarties fill one tray. Three remain. Then simplify just the leftover fraction.</p>','Ask children to physically count 12 into one full tray and 3 into second. Highlight: 3/12 -> 1/4. Do not simplify 15/12 into 5/4 until students understand the regrouping; for extension 15/12 = 5/4 = 1 1/4.'),
s('gold','Try the same idea','WHAT ABOUT 14? 16? 18?','<div class="cards"><div class="card"><b>14/12</b><p>1 whole + 2 left</p></div><div class="card"><b>16/12</b><p>1 whole + 4 left</p></div><div class="card"><b>18/12</b><p>1 whole + 6 left</p></div></div><button class="btn primary revealBtn" onclick="reveal(22)">REVEAL MIXED NUMBERS</button><div id="ans22" class="answers"><div class="answerBlock">1 1/6 &nbsp;&nbsp; • &nbsp;&nbsp; 1 1/3 &nbsp;&nbsp; • &nbsp;&nbsp; 1 1/2</div></div>','Students may use paper counters for totals above 15. Encourage writing 1 2/12, 1 4/12, 1 6/12 BEFORE simplifying leftovers.'),
s('purple','Interactive model','CHANGE THE TOTAL. KEEP THE WHOLE = 12.','<div class="split"><div><div class="row"><button class="btn primary" onclick="changeTotal(-1)">−</button><div class="bigNumber" id="counterValue">15</div><button class="btn primary" onclick="changeTotal(1)">+</button><button class="btn small" onclick="setTotal(15)">RESET</button></div><div id="counterFormula" class="equation" style="font-size:clamp(27px,3.2vw,48px)"></div></div><div id="counterTrays" class="row" style="gap:15px"></div></div>','Set totals 12 to 36. Ask: how many complete trays? how many leftover? simplify remainder. Perfect for 24/12 and 27/12 with strong mathematicians.'),
s('mint','Your mission | 12 minutes','BRING THE NEW SMARTIES TO THE SECOND MAT.','<div class="cards"><div class="card"><b>1</b><p>Show 15 Smarties in two 12-squared trays.</p></div><div class="card"><b>2</b><p>Write 15/12, then 1 3/12.</p></div><div class="card"><b>3</b><p>Simplify to 1 1/4, if ready.</p></div></div><div class="ribbon">Student recording sheet • Page 3 | Use cut-out paper Smarties for any imagined totals.</div>','Build goal: 1 whole + 3 left, with adult writing support. Apply: convert 13–20 over 12. Extend: 24, 27, 29 over 12 and prove their meaning.'),
s('pink','Pitfall detective','WHICH STUDENT IS RIGHT?','<div class="cards"><div class="card"><b>Student A</b><p>“I have 15 Smarties. My original whole is 12, so I have 15/12 of a whole.”</p></div><div class="card"><b>Student B</b><p>“I have 15 Smarties now, so 15/15 must be an improper fraction.”</p></div></div><button class="btn primary revealBtn" onclick="reveal(25)">EXPLAIN</button><div id="ans25" class="answers"><div class="answerBlock">A is correct for the 12-Smartie whole. 15/15 is exactly one NEW set of 15, not more than one.</div></div>','Discuss how a fraction depends on the reference whole. Student B is not wrong that 15/15 equals one, but calling it improper as more than one is wrong; it describes a different whole.'),
s('purple','Differentiation | work time','CHOOSE THE NEXT RIGHT CHALLENGE.','<div class="cards"><div class="card"><b>BUILD</b><p>Use two trays to show 13/12, 14/12, 15/12.</p></div><div class="card"><b>APPLY</b><p>Show 16/12, 18/12, 20/12 in simplest mixed form.</p></div><div class="card"><b>EXTEND</b><p>Prove that 27/12 = 2 1/4. Find three other improper fractions equal to 1 1/2.</p></div></div><div class="ribbon">Differentiated practice sheets: BUILD / APPLY / EXTEND.</div>','Give time to explore. If students cannot simplify yet, allow mixed form with twelfths first. No one should skip concrete representations if needed.'),
s('dark','Independent work','LAB TIME.','<div class="timer" id="timer">12:00</div><div class="row"><button class="btn teal" onclick="timerToggle()" id="timerBtn">START</button><button class="btn" onclick="timerReset()">RESET</button></div><p class="lede">Show it. Write it. Explain it.</p>','Run approximately 12 minutes. This clock starts at 12 minutes when START is pressed. Stop for mini-checks and use as flexible time if the class is slower.'),
s('gold','Prove your thinking','THE FINAL FRACTION CHECK.','<div class="cards"><div class="card"><b>1</b><p>Why is 4/12 the same as 1/3?</p></div><div class="card"><b>2</b><p>Show 15/12 using two trays.</p></div><div class="card"><b>3</b><p>Why does the denominator stay 12 in the second task?</p></div></div>','Think/pair/share. Target explanation: a whole is still 12 Smarties, so 15 counts as a whole plus 3 extra compared with that fixed whole.'),
s('pink','Exit ticket | 5 minutes','BEFORE YOU EAT…','<div class="cards"><div class="card"><b>Q1</b><p>Simplify 6/12.</p></div><div class="card"><b>Q2</b><p>Write 15/12 as a mixed number.</p></div><div class="card"><b>Q3</b><p>Explain why there are 12 on the bottom.</p></div></div><div class="ribbon">Write it on your exit ticket. Teacher checks before sweets are packed away or eaten.</div>','Suggested answers: 1/2; 1 3/12 or 1 1/4; because our defined unit whole is 12. The exit ticket is assessment of new thinking, not a Year 4 grade for advanced mixed numbers.'),
s('dark','Bonus challenge | fast finishers','CAN YOU CRACK THE CODE?','<div class="split"><div><div class="miniList"><p><b>Digit 1:</b> denominator in simplified 15/12 mixed number.</p><p><b>Digit 2:</b> numerator of leftover part of 18/12, simplest form.</p><p><b>Digit 3:</b> number of wholes in 24/12.</p><p><b>Digit 4:</b> numerator of leftover part of 27/12, simplest form.</p></div></div><div class="stack" style="align-items:center"><div class="lockInput" id="codeText">_ _ _ _</div><div class="keypad" id="pad"></div><p id="lockMessage" class="sm" style="font-weight:900"></p></div></div>','Challenge code is 4121. Four tasks: 15/12=1 1/4; 18/12=1 1/2; 24/12=2; 27/12=2 1/4. If stuck, students use the slider model on previous slides.'),
s('mint','Today’s learning','ONE THING. MANY FRACTION NAMES.','<div class="cards"><div class="card"><b>We counted</b><p>Fractions of a set.</p></div><div class="card"><b>We renamed</b><p>Equivalent fractions.</p></div><div class="card"><b>We stretched</b><p>Beyond one whole.</p></div></div><div class="lede">The important question: <strong>“What is one whole?”</strong></div>','Collect Smarties respectfully, check allergies, then decide whether students may eat them. Invite students to explain the difference between 4/12 of 12 (colour fraction) and 15/12 (quantity relative to original whole).')
];
const topics=[['START',0],['REVIEW',2],['SET UP',4],['RECORD',7],['SIMPLIFY',10],['EXTRAS',17],['MIXED',19],['PRACTISE',24],['EXIT',28]];
let idx=0;
function reveal(n){for(const id of ['ans'+n,'ans'+n+'b','ans'+n+'c']){const el=document.getElementById(id);if(el)el.classList.toggle('shown')}}
function render(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;timerRunning=false}const x=slides[idx];document.getElementById('stage').innerHTML=`<section class="slide ${x.theme}"><span class="kicker">${x.kicker}</span><h2>${x.title}</h2>${x.content}</section>`;document.getElementById('counter').textContent=`${idx+1} / ${slides.length}`;document.getElementById('progress').style.width=((idx+1)/slides.length*100)+'%';document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;document.getElementById('notes').innerHTML=`<strong>Teacher notes — Slide ${idx+1}</strong>${x.notes}`;document.getElementById('topics').innerHTML=topics.map(([name,i])=>`<button class="${idx>=i&&idx<(topics.find(([n,nidx])=>nidx>i)?.[1]??slides.length)?'active':''}" onclick="go(${i})">${name}</button>`).join('');if(idx===7)updateTray();if(idx===23)updateCounter();if(idx===27)updateTimer();if(idx===30)updatePad()}
function go(i){idx=Math.max(0,Math.min(slides.length-1,i));render()}
document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('noteBtn').onclick=()=>document.getElementById('notes').classList.toggle('open');document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.getElementById('presentation').requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener('keydown',e=>{const k=e.key;if(['ArrowRight','PageDown',' '].includes(k)&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();go(idx+1)}else if(['ArrowLeft','PageUp'].includes(k)&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();go(idx-1)}else if(k.toLowerCase()==='n')document.getElementById('notes').classList.toggle('open');else if(k.toLowerCase()==='f'){if(!document.fullscreenElement)document.getElementById('presentation').requestFullscreen?.();else document.exitFullscreen?.()}});
function repaint(i){modelTray[i]=paint;updateTray()}function resetColours(){modelTray=[...defaultTray];paint='blue';updateTray()}
function updateTray(){const el=document.getElementById('editableTray');if(!el)return;el.innerHTML=fillTray(modelTray,true);document.getElementById('palette').innerHTML=COLORS.map(([name,color])=>`<button class="swatch ${paint===name?'active':''}" style="background:${color}" title="${name}" aria-label="Paint ${name}" onclick="paint='${name}';updateTray()"></button>`).join('');let c=countColours(modelTray);document.getElementById('fractionsLive').innerHTML=`<div class="sm" style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px 12px">${Object.entries(c).map(([name,n])=>`<span><b style="text-transform:capitalize">${name}</b> ${n}/12 <small style="color:#616b81">→ ${n/gcd(n,12)}/${12/gcd(n,12)}</small></span>`).join('')}</div><p class="smallCaption">All colour counts total 12.</p>`}
function setTotal(t){extra=Math.min(36,Math.max(12,t));updateCounter()}function changeTotal(n){setTotal(extra+n)}function updateCounter(){if(!document.getElementById('counterValue'))return;document.getElementById('counterValue').textContent=extra;let wholes=Math.floor(extra/12),left=extra%12,div=gcd(left,12),simplified=left?`${wholes} ${left/div}/${12/div}`:wholes;document.getElementById('counterFormula').textContent=`${extra}/12 = ${wholes} ${left?left+'/12':''} = ${simplified}`;document.getElementById('counterTrays').innerHTML=Array.from({length:Math.ceil(extra/12)},(_,i)=>`<div><div class="trayLabel">Whole ${i+1}</div>${makeTray(12,Math.min(12,extra-i*12),'smalltray')}</div>`).join('')}
function updateTimer(){let mm=String(Math.floor(seconds/60)).padStart(2,'0'),ss=String(seconds%60).padStart(2,'0');let x=document.getElementById('timer');if(x)x.textContent=`${mm}:${ss}`;let b=document.getElementById('timerBtn');if(b)b.textContent=timerRunning?'PAUSE':'START'}function timerToggle(){timerRunning=!timerRunning;if(timerRunning){timerInterval=setInterval(()=>{if(seconds<=0){clearInterval(timerInterval);timerRunning=false;updateTimer();return}seconds--;updateTimer()},1000)}else{clearInterval(timerInterval)}updateTimer()}function timerReset(){clearInterval(timerInterval);timerRunning=false;seconds=12*60;updateTimer()}
function updatePad(){let t=document.getElementById('pad');if(!t)return;t.innerHTML=[1,2,3,4,5,6,7,8,9,'CLEAR',0,'ENTER'].map(n=>`<button onclick="pressCode('${n}')">${n}</button>`).join('');updateCode()}
function pressCode(k){if(k==='CLEAR'){code='';document.getElementById('lockMessage').textContent=''}else if(k==='ENTER'){let good=code==='4121';document.getElementById('lockMessage').textContent=good?'UNLOCKED — FRACTION MASTER!':'NOT YET. CHECK THE REMAINDERS.';document.getElementById('lockMessage').style.color=good?'#74edbf':'#ff9dac'}else if(code.length<4){code+=k;document.getElementById('lockMessage').textContent=''}updateCode()}
function updateCode(){const x=document.getElementById('codeText');if(x)x.textContent=(code+'____').slice(0,4).split('').join(' ')}
render();
</script></body></html>
