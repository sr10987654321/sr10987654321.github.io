  /* ---------- picker screen ---------- */
  #picker{min-height:100%;display:flex;flex-direction:column}
  header{background:var(--blue);color:#fff;padding:22px 20px 18px;position:relative;overflow:hidden}
  header h1{font-family:var(--slidefont);font-size:clamp(30px,6vw,46px);letter-spacing:2px;
    text-shadow:3px 3px 0 rgba(0,0,0,.35)}
  header p{opacity:.9;margin-top:4px;font-size:15px}
  .bee{position:absolute;right:22px;top:auto;bottom:8px;width:62px;height:auto}
  main{flex:1;padding:18px 20px 120px;max-width:1000px;width:100%;margin:0 auto}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar .btn{background:#fff;border:3px solid #1A1A1A;border-radius:999px;
    padding:8px 16px;font-size:15px;font-weight:bold;box-shadow:0 3px 0 #1A1A1A}
  .toolbar .btn:active{transform:translateY(3px);box-shadow:none}
  .toggle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:bold;
    background:#fff;border:3px solid #1A1A1A;border-radius:999px;padding:8px 14px;box-shadow:0 3px 0 #1A1A1A}
  .toggle input{width:20px;height:20px;accent-color:var(--blue)}

  .group{margin-top:20px}
  .group h2{font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;
    display:flex;align-items:center;gap:10px}
  .group h2 .n{opacity:.55;letter-spacing:0;text-transform:none}
  .group h2::after{content:"";flex:1;height:4px;border-radius:2px}
  .group.u1 h2::after{background:var(--blue)}
  .group.u2 h2::after{background:var(--orange)}
  .group.u3 h2::after{background:var(--green)}
  .group.u4 h2::after{background:var(--red)}
  .group.custom h2::after{background:var(--purple)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:3px solid #1A1A1A;border-radius:14px;background:#fff;padding:10px 14px;
    font-size:17px;font-weight:bold;box-shadow:0 3px 0 #1A1A1A;transition:background .1s;position:relative;cursor:pointer}
  .chip small{display:block;font-weight:normal;font-size:12px;opacity:.65;margin-top:2px;font-family:Verdana,sans-serif;max-width:220px}
  .chip.on{color:#fff}
  .chip.on small{opacity:.9}
  .group.u1 .chip.on{background:var(--blue)}
  .group.u2 .chip.on{background:var(--orange)}
  .group.u3 .chip.on{background:var(--green)}
  .group.u4 .chip.on{background:var(--red)}
  .group.custom .chip.on{background:var(--purple)}
  .chip:active{transform:translateY(3px);box-shadow:none}
  .chip .x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;
    background:#1A1A1A;color:#fff;font-size:13px;line-height:24px;text-align:center;display:none}
  .editing .chip .x{display:block}

  .seg{display:inline-flex;border:2px solid #1A1A1A;border-radius:999px;overflow:hidden;background:#fff}
  .seg button{padding:4px 10px;font-size:13px;font-weight:bold;background:#fff;line-height:1.2;color:#1A1A1A}
  .seg button + button{border-left:2px solid #1A1A1A}
  .seg button.on{background:#1A1A1A;color:#fff}
  .chip .seg{display:flex;margin-top:7px;width:max-content}
  .tabs{display:flex;gap:10px;margin-bottom:16px}
  .tabs button{border:3px solid #1A1A1A;border-radius:999px;padding:9px 22px;font-size:16px;
    font-weight:bold;background:#fff;box-shadow:0 3px 0 #1A1A1A}
  .tabs button.on{background:var(--blue);color:#fff}
  .wordbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .wordbar select{border:3px solid #1A1A1A;border-radius:999px;padding:8px 12px;font-size:15px;
    font-weight:bold;background:#fff;font-family:inherit}
  #fsBtn{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:4;
    background:#fff;border:3px solid #1A1A1A;border-radius:999px;padding:7px 16px;
    font-size:14px;font-weight:bold;box-shadow:0 3px 0 #1A1A1A;display:flex;align-items:center;gap:8px}
  #fsBtn:active{transform:translateY(3px);box-shadow:none}
  #fsBtn svg{width:16px;height:16px}
  header{padding-right:150px}
    .switch{display:inline-flex;align-items:center;gap:11px;border:3px solid #1A1A1A;
    border-radius:999px;padding:7px 16px 7px 12px;background:#fff;box-shadow:0 3px 0 #1A1A1A;
    font-size:15px;font-weight:bold;cursor:pointer;user-select:none}
  .switch .track{width:52px;height:28px;border-radius:999px;background:#c9cfd6;
    border:3px solid #1A1A1A;position:relative;transition:background .15s;flex:none}
  .switch .knob{position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;
    background:#fff;border:3px solid #1A1A1A;transition:left .15s}
  .switch.on .track{background:var(--green)}
  .switch.on .knob{left:23px}
  .switch .cnt{font-size:12px;font-weight:normal;font-family:Verdana,sans-serif;opacity:.65}
  .switch:active{transform:translateY(3px);box-shadow:none}
  .dlrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 16px}
  .dlrow .lbl{font-size:12px;font-family:Verdana,sans-serif;text-transform:uppercase;
    letter-spacing:2px;opacity:.6;margin-right:2px}
  .dlbtn{display:inline-flex;align-items:center;gap:10px;border:3px solid #1A1A1A;
    border-radius:14px;padding:11px 20px;font-size:16px;font-weight:bold;color:#fff;
    box-shadow:0 4px 0 #1A1A1A;line-height:1.1}
  .dlbtn svg{width:20px;height:20px;flex:none}
  .dlbtn .sub{display:block;font-size:11px;font-weight:normal;opacity:.85;
    font-family:Verdana,sans-serif;margin-top:2px}
  .dlbtn.html{background:var(--blue)}
  .dlbtn.pptx{background:var(--orange)}
  .dlbtn.app{background:var(--purple)}
  .dlbtn:active{transform:translateY(4px);box-shadow:none}
  .dlbtn:disabled{background:#c4c4c4;box-shadow:0 4px 0 #999;cursor:not-allowed}
  .card{border:3px solid #1A1A1A;border-radius:16px;background:#fff;padding:16px;box-shadow:0 3px 0 #1A1A1A;margin-bottom:14px}
  .card h3{font-size:15px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-family:Verdana,sans-serif;opacity:.7;margin-bottom:4px}
  .fld input,.fld textarea{width:100%;border:2px solid #1A1A1A;border-radius:10px;padding:9px 11px;
    font-size:15px;font-family:Verdana,sans-serif;background:#fff}
  .fld textarea{min-height:74px;resize:vertical;line-height:1.4}
  .drop{border:3px dashed #1A1A1A;border-radius:16px;padding:22px;text-align:center;background:#fff}
  .legend{font-size:13px;font-family:Verdana,sans-serif;opacity:.75;margin:-2px 0 6px}

  .chip .pencil{position:absolute;top:-10px;left:-10px;width:24px;height:24px;border-radius:50%;
    background:#1A1A1A;color:#fff;font-size:12px;line-height:24px;text-align:center;display:none;cursor:pointer}
  .editing .chip .pencil{display:block}
  .chip .mark{position:absolute;top:-9px;right:8px;background:#fff;border:2px solid #1A1A1A;
    border-radius:999px;font-size:11px;line-height:15px;padding:0 6px;font-family:Verdana,sans-serif;font-weight:normal}
  .editing .chip .mark{right:22px}
  .chip.editor{background:#fff!important;color:#1A1A1A!important;cursor:default}
  .chip.editor input{display:block;width:250px;max-width:60vw;border:2px solid #1A1A1A;border-radius:9px;
    padding:7px 9px;font-size:15px;font-family:Verdana,sans-serif;background:#fff;margin-bottom:6px}
  .chip.editor .ebtns{display:flex;gap:6px;flex-wrap:wrap}
  .chip.editor .ebtns button{border:2px solid #1A1A1A;border-radius:999px;padding:4px 12px;
    font-size:13px;font-weight:bold;background:#fff}
  .chip.editor .ebtns button.save{background:var(--green);color:#fff}

  .addrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .addrow input{flex:1;min-width:130px;border:3px solid #1A1A1A;border-radius:12px;
    padding:10px 12px;font-size:16px;font-family:Verdana,sans-serif;background:#fff}
  .addrow .btn{background:var(--yellow);border:3px solid #1A1A1A;border-radius:12px;
    padding:10px 18px;font-weight:bold;font-size:16px;box-shadow:0 3px 0 #1A1A1A}
  .addrow .btn:active{transform:translateY(3px);box-shadow:none}

  .footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid #1A1A1A;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center;justify-content:space-between}
  #count{font-size:16px;font-weight:bold}
  #present{background:var(--green);color:#fff;font-family:var(--slidefont);font-size:20px;letter-spacing:2px;
    border:4px solid #1A1A1A;border-radius:999px;padding:12px 34px;box-shadow:0 4px 0 #1A1A1A}
  #present:disabled{background:#ccc;color:#888;box-shadow:0 4px 0 #999;cursor:not-allowed}
  #present:not(:disabled):active{transform:translateY(4px);box-shadow:none}

  /* ---------- slide screen: exact 1920x1080 replica of the Canva deck ---------- */
  #show{position:fixed;inset:0;display:none;background:#000;user-select:none;-webkit-user-select:none;overflow:hidden}
  #show.open{display:block}
  #stage{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform-origin:center center}
  #panel{position:absolute;left:53.33px;top:54.01px;width:1813.34px;height:971.98px;
    background:var(--blue);border-radius:40px}
  .pill{position:absolute;top:849.29px;width:363.99px;height:176.70px}
  #pill0{left:53.33px;background:var(--green)}
  #pill1{left:417.32px;background:var(--yellow)}
  #pill2{left:779.11px;background:var(--red)}
  #pill3{left:1140.89px;background:var(--orange)}
  #pill4{left:1502.68px;background:var(--purple)}
  #slideBee{position:absolute;left:78.43px;top:74.58px;width:193px;height:auto}
  #slideText{position:absolute;left:146.25px;top:150.87px;width:1618.26px;text-align:center;
    font-family:var(--slidefont);font-size:149.34px;line-height:1.1;letter-spacing:0;color:#fff;
    isolation:isolate;z-index:6}
  #slideText .ol{position:relative}
  #slideText .ol::before{content:attr(data-text);position:absolute;left:0;right:0;top:0;
    -webkit-text-stroke:19px #000;z-index:-1}
  #slideText .s-xl{font-size:149.34px;line-height:1.1;text-transform:uppercase}
  #slideText .s-lg{font-size:112px;line-height:1.14}
  #slideText .s-md{font-size:80px;line-height:1.2}
  #slideText .s-sm{font-size:60px;line-height:1.25}
  #slideText .s-xs{font-size:46px;line-height:1.3}
  #slideText .head{text-transform:uppercase;font-size:52px;line-height:1.2;opacity:.9;margin-bottom:26px;letter-spacing:2px}
  #slideText .gap{height:26px}
  #slideText .chip-class{display:inline-block;background:#fff;color:#000;border:6px solid #000;
    border-radius:999px;padding:2px 34px;font-size:54px;margin-bottom:22px}
  #slideText table{width:100%;border-collapse:separate;border-spacing:14px 0;margin:0 auto;table-layout:fixed}
  #slideText th{text-transform:uppercase}
  #slideText th,#slideText td{background:#fff;color:#000;border:6px solid #000;border-radius:18px;
    padding:14px 18px;font-size:44px;text-align:center;vertical-align:middle;word-wrap:break-word}
  #slideText th{font-size:34px;opacity:.75;border-radius:14px}
  #slideText td.blankcell{height:150px}
  /* syntactic form: the modelled sentence, then blank boxes under it */
  #slideText.syntaxslide{top:116px}
  #slideText.syntaxslide table{border-spacing:14px 10px}
  #slideText.syntaxslide .head{margin-bottom:4px}
  #slideText.syntaxslide .chip-class{margin-bottom:2px;font-size:44px;padding:0 28px}
  #slideText.syntaxslide .inktools{margin-bottom:6px}
  #slideText.syntaxslide th{font-size:30px;padding:8px 14px}
  #slideText.syntaxslide .egcell{font-size:34px;line-height:1.2;text-transform:none;
    padding:10px 16px}
  #slideText.syntaxslide .bigcell{height:196px;font-size:40px}
  #slideText.blankslide{top:150px}
  #slideText .bigcell{height:430px;vertical-align:top;text-align:left;padding:20px 24px;
    font-size:46px;line-height:1.25;text-transform:none;cursor:text;overflow:hidden}
  #slideText .bigcell:focus{outline:6px solid #FFC93C;outline-offset:-6px}
  #slideText .inkwrap{position:relative}
  #slideText .inkpad{position:absolute;left:0;top:0;width:100%;height:100%;
    touch-action:none;cursor:crosshair}
  #slideText .inkpad.off{pointer-events:none}
  #slideText .inktools{display:flex;gap:12px;align-items:center;justify-content:flex-end;
    margin-bottom:12px}
  #slideText .inktools button{border:4px solid #000;border-radius:999px;background:#fff;
    font-family:var(--slidefont);font-size:26px;padding:6px 20px;cursor:pointer;color:#000;line-height:1.2}
  #slideText .inktools button.on{background:#000;color:#fff}
  #slideText .inktools .pen{width:56px;height:56px;padding:0;border-radius:50%}
  #slideText .inktools .pen.on{outline:5px solid #FFC93C;outline-offset:3px}
  #slideText .sum{display:flex;gap:16px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  #slideText .sum .op{display:flex;align-items:center;font-size:64px}
  #slideText .sum .box{background:#fff;color:#000;border:6px solid #000;border-radius:18px;
    padding:10px 20px;min-width:170px;display:flex;flex-direction:column;justify-content:center}
  #slideText .sum .box b{text-transform:uppercase;font-size:56px;line-height:1.1}
  #slideText .sum .box i{font-style:normal;font-size:28px;opacity:.7;font-family:Verdana,sans-serif;line-height:1.2;margin-top:4px}
  #slideText .para{font-size:52px;line-height:1.3;margin-bottom:22px;text-align:left}
  #slideText .s-sent{font-size:92px;line-height:1.28}
  #slideText .pair{display:flex;gap:50px;justify-content:center;align-items:stretch;margin-top:30px}
  #slideText .pair .pw{background:#fff;color:#000;border:6px solid #000;border-radius:20px;
    padding:18px 44px;font-size:78px;line-height:1.1;text-transform:none}
  #slideText .pair .amp{display:flex;align-items:center;font-size:56px}
  #slideText .fam{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:34px}
  #slideText .fam span{background:#fff;color:#000;border:5px solid #000;border-radius:16px;
    padding:8px 22px;font-size:46px;text-transform:none}
  #slideText .donewrap{padding:120px 60px 0 200px}
  #slideText .icons{display:flex;gap:120px;justify-content:center;align-items:center;margin-top:40px;
    font-size:170px;line-height:1}
  #slideText .blankline{font-size:90px;letter-spacing:6px;margin-top:40px;text-align:center}
  /* morpheme matrix: table on top, writing area beneath */
  #slideText.mxslide{top:110px;left:150px;width:1620px;text-align:left;padding-left:150px}
  #slideText .mx{display:flex;background:#fff;color:#000;border:4px solid #000;
    text-transform:none;font-family:Arial,Helvetica,sans-serif}
  #slideText .mx .col{flex:1;border-right:4px solid #000;min-width:0}
  #slideText .mx .col:last-child{border-right:none}
  #slideText .mx .hd{background:#e8eef5;border-bottom:4px solid #000;padding:8px 14px;
    font-size:30px;font-weight:bold;text-align:center}
  #slideText .mx .cells{padding:12px 16px;min-height:210px;display:flex;flex-direction:column;gap:8px}
  #slideText .mx .m{font-size:44px;font-weight:bold;line-height:1.15}
  #slideText .mx .m span{font-size:26px;font-style:italic;color:#3f8fd6;font-weight:normal;margin-left:10px}
  #slideText .mx .m span.other{color:#9aa5b1}
  #slideText.mxslide.tight .mx .m{font-size:34px}
  #slideText.mxslide.tight .mx .m span{font-size:21px}
  #slideText.mxslide.tight .mx .cells{gap:7px;min-height:210px}
  #slideText .mxpad{position:relative;margin-top:16px}
  #slideText .mxbox{background:#fff;border:4px solid #000;min-height:250px;padding:14px 20px;
    font-family:Arial,Helvetica,sans-serif;font-size:34px;line-height:1.35;color:#000;
    outline:none;cursor:text;white-space:pre-wrap}
  #slideText .mxbox:empty::before{content:attr(data-ph);color:#aab3bd}
  #slideText .mxbox.off{pointer-events:none}
  #slideText .mxink{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #slideText .mxink.off{pointer-events:none}
  #slideText .mxtitle{font-size:30px;margin:14px 0 4px;color:#fff;font-family:Arial,Helvetica,sans-serif;
    text-transform:none;font-weight:bold}
  #slideText .dictword{font-size:54px;opacity:.9;margin-bottom:26px;text-align:center}
  /* apply activities */
  #slideText.thumbslide{top:290px}
  #slideText.copyslide{top:130px;font-family:Arial,Helvetica,'Liberation Sans',sans-serif}
  #slideText.copyslide .head{font-family:Arial,Helvetica,'Liberation Sans',sans-serif;
    font-weight:bold;letter-spacing:0}
  #slideText .defbox{display:inline-block;border:4px solid #9b5de5;padding:6px 18px;
    margin:34px 0 0 240px;font-size:44px;font-weight:bold;color:#fff;text-transform:none}
  #slideText .deftext{margin:16px 0 0 240px;font-size:56px;font-weight:bold;color:#fff;
    line-height:1.2;text-transform:none;text-align:left;max-width:1330px}
  #slideText .thumbs{display:flex;gap:190px;justify-content:center;margin-top:56px}
  #slideText .thumbs svg{width:215px;height:215px}
  #slideText .verdict{display:flex;align-items:center;justify-content:center;gap:50px;
    margin-top:60px;pointer-events:none}
  #slideText .verdict svg{width:400px;height:400px;filter:drop-shadow(0 14px 0 rgba(0,0,0,.35))}
  #slideText .verdict .vlabel{font-size:150px;color:#fff;-webkit-text-stroke:16px #000;
    paint-order:stroke fill;font-family:var(--slidefont)}
  @keyframes swoosh{
    0%{transform:translateX(-150%) rotate(-40deg) scale(.4);opacity:0}
    55%{transform:translateX(12%) rotate(9deg) scale(1.18);opacity:1}
    75%{transform:translateX(-4%) rotate(-3deg) scale(.96)}
    100%{transform:translateX(0) rotate(0) scale(1);opacity:1}
  }
  #slideText .verdict.in{animation:swoosh .6s cubic-bezier(.2,.9,.3,1.1) both}
  @media (prefers-reduced-motion:reduce){#slideText .verdict.in{animation:none}}
  #slideText .matrix{display:flex;gap:22px;justify-content:center;align-items:flex-start;margin-top:10px}
  #slideText .mcol{flex:1;max-width:520px}
  #slideText .mcol h4{font-size:34px;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;opacity:.85}
  #slideText .tilewrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  #slideText .tile{background:#fff;color:#000;border:6px solid #000;border-radius:16px;
    padding:8px 22px;font-size:52px;cursor:pointer;user-select:none;line-height:1.15}
  #slideText .tile:active{transform:translateY(4px)}
  #slideText .tile.pfx{background:#FFC93C}
  #slideText .tile.sfx{background:#8ac926}
  #slideText .build{margin-top:30px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
  #slideText .buildbox{background:#fff;color:#000;border:6px solid #000;border-radius:18px;
    min-width:620px;min-height:120px;padding:10px 26px;font-size:76px;display:flex;
    align-items:center;justify-content:center;text-transform:none}
  #slideText .buildbox .ph{opacity:.35;font-size:46px}
  #slideText .wm{display:flex;background:#fff;color:#000;border:3px solid #5b7fb4;
    text-transform:none;margin:10px 0 0 240px}
  #slideText .wm .wcol{border-right:3px solid #5b7fb4;padding:16px 20px;display:flex;
    flex-direction:column;gap:22px;justify-content:flex-start;flex:1;min-width:0}
  #slideText .wm .wcol:last-child{border-right:none}
  #slideText .wm .wcol.pre{text-align:right;flex:0 0 250px}
  #slideText .wm .wcol.base{text-align:center;flex:0 0 300px}
  #slideText .wm .wcol.slot{text-align:left;gap:14px}
  #slideText .wm .mo{font-size:50px;line-height:1.1;font-weight:bold}
  #slideText .wm .me{font-size:32px;line-height:1.2;font-style:italic;color:#3f8fd6;margin-top:2px}
  #slideText .wm .me.other{color:#b3bcc7}
  #slideText .wm.tight .mo{font-size:38px}
  #slideText .wm.tight .me{font-size:25px}
  #slideText .wm.tight .wcol{gap:12px;padding:12px 16px}
  #slideText .copywrap{display:flex;gap:26px;justify-content:center;align-items:flex-start;margin-top:22px;
    padding-left:150px;padding-right:20px}
  #slideText .copywrap table{border-spacing:10px 8px;table-layout:auto}
  #slideText .copywrap th,#slideText .copywrap td{font-size:34px;padding:8px 14px;border-width:5px;border-radius:12px}
  #slideText .copywrap th{font-size:26px}
  #slideText .copywrap td.mor{font-weight:normal;white-space:nowrap;text-transform:uppercase}
  #slideText .copywrap td.mean{text-align:left}
  #slideText .copywrap.mid th,#slideText .copywrap.mid td{font-size:29px;padding:6px 12px;border-width:4px}
  #slideText .copywrap.mid th{font-size:23px}
  #slideText .copywrap.tight th,#slideText .copywrap.tight td{font-size:25px;padding:4px 10px;border-width:4px;border-radius:10px}
  #slideText .copywrap.tight th{font-size:20px}
  #slideText .copywrap.tight table,#slideText .copywrap.mid table{border-spacing:8px 6px}
  #slideText .clr{background:#FF5757;color:#fff;border:6px solid #000;border-radius:999px;
    padding:8px 30px;font-size:44px;cursor:pointer}
  #slideText.sentence{top:300px;text-align:left}
  #slideText.sentence.etym{top:180px;padding-left:150px;width:1470px}
  #slideText.sentence .head{text-align:left}
  #slideText.wordslide{top:250px;left:150px;width:1620px}
  #slideText .clap{position:absolute;left:40px;top:20px;font-size:250px;line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  #slideText .wordbox{margin-left:420px;width:1180px;text-align:center}
  #slideText .syll{font-size:92px;line-height:1.2;margin-top:14px;text-transform:uppercase}
  #slideText .sounds{font-size:62px;line-height:1.2;margin-top:14px;opacity:.85}
  /* ---- DSF Appendix A: step tag, learning intention, phonics frames ---- */
  #slideText .steptag{position:absolute;top:-62px;left:0;right:0;text-align:right;
    font-size:30px;line-height:1;letter-spacing:1px;text-transform:uppercase;
    color:rgba(255,255,255,.72);font-weight:normal;pointer-events:none}
  #slideText.lislide{top:300px;left:150px;width:1620px;text-align:left}
  #slideText .li{font-size:78px;line-height:1.3;text-align:left;margin-top:24px}
  #slideText .li .tm{text-transform:none}
  #slideText.frslide{top:260px;left:150px;width:1620px;text-align:center}
  #slideText .framewrap{position:relative}
  #slideText .frame{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;
    margin-top:26px}
  #slideText .bx{box-sizing:border-box;flex:1 1 0;min-width:0;max-width:132px;height:150px;
    border:7px solid #fff;border-radius:10px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:62px;line-height:1;
    text-transform:none}
  #slideText .bx .dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.45)}
  #slideText .bx.lit{background:#fff;color:#111}
  #slideText .frhint{margin-top:34px;font-size:44px;line-height:1.3;opacity:.92}
  #slideText .sayline{font-size:84px;line-height:1.25;margin-top:30px;text-align:center}
  #slideText .wordchips{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
  #slideText .wchip{background:rgba(255,255,255,.22);border:4px solid #fff;border-radius:14px;
    padding:6px 22px;font-size:44px;line-height:1.2;text-transform:none;
    font-family:Arial,Helvetica,sans-serif;font-weight:bold}
  #slideText .wchip.own{background:#fff;color:#111}
  #slideText .sayrow{display:flex;gap:80px;justify-content:center;align-items:center;
    margin-top:30px;font-size:150px;line-height:1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  /* black drum slide */
  #stage.dark #panel{background:#000!important}
  #stage.dark .pill,#stage.dark #slideBee{display:none}
  #stage.nopills .pill{display:none}
  #slideText.drum{top:0;left:0;width:1920px;height:1080px;text-align:left}
  #slideText .nw-title{position:absolute;left:400px;top:250px;width:960px;text-align:center;
    font-size:150px;line-height:1.1;text-transform:uppercase;color:#fff}
  #slideText .nw-drum{position:absolute;left:890px;top:470px;width:500px;height:auto;
    transform-origin:50% 90%}
  @keyframes drumshake{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  #slideText .nw-drum{animation:drumshake .26s ease-in-out infinite}
  #slideText.say .nw-title{left:260px;top:160px;width:1400px;font-size:122px}
  #slideText .nw-echo{position:absolute;left:700px;top:430px;width:520px;height:auto;
    transform-origin:50% 50%}
  @keyframes echopulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  #slideText .nw-echo{animation:echopulse 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){#slideText .nw-echo{animation:none}}
  @media (prefers-reduced-motion:reduce){#slideText .nw-drum{animation:none}}
  #slideText .hidden-line{visibility:hidden}
  #slideText .blank{opacity:.55}
  #slideText .sum .box.blank{opacity:.6}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(6px + env(safe-area-inset-top)) 14px 6px;color:#fff;font-weight:bold;font-size:15px;z-index:6}
  #backBtn{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.7);
    border-radius:999px;padding:4px 14px;font-size:14px;font-weight:bold;margin-left:12px}
  #exit{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.7);border-radius:999px;
    padding:4px 14px;font-size:14px;font-weight:bold}
  #tapHint{position:fixed;bottom:4px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);
    font-size:12px;font-family:Verdana,sans-serif;z-index:6}
  .navzone{position:fixed;top:70px;bottom:0;width:16%;z-index:5}
  #prevZone{left:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:#000;margin:0;overflow:hidden}
#show{display:block}
#fs{position:fixed;bottom:6px;right:10px;z-index:9;background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:bold;cursor:pointer;font-family:Verdana,sans-serif}
</style>
</head>

<script>
const deck = [{"type":"morpheme","m":"cent","d":"one hundred","mode":"all"},{"type":"morpheme","m":"-ury","d":"consisting of","mode":"all"},{"type":"morpheme","m":"-ible","d":"capable of","mode":"d"},{"type":"morpheme","m":"-ance","d":"forms abstract nouns","mode":"all"},{"type":"morpheme","m":"fract","d":"to break","mode":"m"},{"type":"morpheme","m":"cred","d":"to trust, to believe","mode":"all"},{"type":"morpheme","m":"cast","d":"to throw, project","mode":"all"},{"type":"morpheme","m":"cosm","d":"world, universe","mode":"all"},{"type":"morpheme","m":"tain","d":"to hold","mode":"m"},{"type":"morpheme","m":"ob-","d":"in front of, towards, against","mode":"all"},{"type":"morpheme","m":"astro","d":"star","mode":"d"},{"type":"morpheme","m":"metre","d":"measure","mode":"m"},{"type":"morpheme","m":"con-","d":"with, together","mode":"all"},{"type":"morpheme","m":"be","d":"around","mode":"all"},{"type":"morpheme","m":"ab(s)-","d":"away, from","mode":"all"},{"type":"morpheme","m":"-ical","d":"connected, dealing with","mode":"all"},{"type":"morpheme","m":"micro","d":"small","mode":"d"},{"type":"morpheme","m":"de-","d":"un, down, off, totally, out, away","mode":"d"},{"type":"newword","word":"credulous"},{"type":"sayword","word":"credulous"},{"type":"word","word":"credulous","syllables":"cred | u | lous","sounds":""},{"type":"definition","text":"Someone who is credulous believes what others say too easily."},{"type":"example","n":1,"text":"If you believe everything you read, you might be described as credulous."},{"type":"example","n":2,"text":"People who are credulous are more likely to lose large amounts of money to scams."},{"type":"nonexample","text":"If you believe your friend when they tell you what they did on their holidays, you are not being credulous, as it is likely that your friend is telling the truth."},{"type":"syntax","wordClass":"adjective","subject":"The credulous crowd","predicate":"believed the inventor’s claims."},{"type":"syntax","wordClass":"adjective","subject":"Used car salesmen","predicate":"enjoy selling to credulous buyers."},{"type":"etymology","paras":["Credulous is of Latin origin, from the word credulus, meaning ‘that easily believes, trustful’.","It has been in use since the 1570s."]},{"type":"wordmatrix","prefixes":[],"bases":[{"m":"cred","d":"to trust, to believe","own":true}],"slots":[[{"m":"(ul)ous","d":"full of, characterised by","own":true}],[{"m":"in","d":"not","own":false},{"m":"ly","d":"having the quality of","own":false}]],"words":[{"text":"credulous","own":true}]},{"type":"applyprompt","lines":["Example or non-example?"]},{"type":"thumbs","text":"Buying a salt lamp because someone told you it will improve the air quality in your home."},{"type":"thumbs","text":"Buying a new television after carefully researching different makes and models."},{"type":"thumbs","text":"Believing that frogs can fly because you saw it online."},{"type":"thumbs","text":"Believing that there is water on the moon after reading reports from a 2020 NASA mission."},{"type":"copytable","definition":"Someone who is credulous believes what others say too easily.","prefixes":[],"bases":[{"m":"cred","d":"to trust, to believe","own":true}],"slots":[[{"m":"(ul)ous","d":"full of, characterised by","own":true}],[{"m":"in","d":"not","own":false},{"m":"ly","d":"having the quality of","own":false}]]}];
const PALETTE = [{"n":"green","v":"#8ac926"},{"n":"yellow","v":"#ffca3a"},{"n":"red","v":"#ff595e"},{"n":"orange","v":"#ff924c"},{"n":"purple","v":"#6a4c93"},{"n":"blue","v":"#1982c4"}];
const PANEL_ORDER = PALETTE.filter(c => c.n !== "yellow");
let idx = 0, revealed = false, builtParts = [], audioCtx = null;
let doneHead = "Great work today!";
let doneText = "Our new word was credulous";
let inkMode = "draw", inkColour = "#000000", inkErase = false, lastInkAt = 0;
const show = document.getElementById("show");
const slideText = document.getElementById("slideText");
function closeShow(){ idx = 0; paint(); }
function paintPalette(i){
  const panel = PANEL_ORDER[i % PANEL_ORDER.length];
  document.getElementById("panel").style.background = panel.v;
  const pills = PALETTE.filter(c => c.n !== panel.n);
  for(let k = 0; k < 5; k++){
    const el = document.getElementById("pill" + k);
    if(el) el.style.background = pills[k].v;
  }
}

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function ol(text, size, cls){
  return '<div class="ol ' + (size || "s-xl") + ' ' + (cls || "") + '" data-text="' +
         esc(text) + '">' + esc(text) + '</div>';
}

function buildStripHTML(){
  return '<div class="build"><div class="buildbox" id="buildBox">' +
         '<span class="ph">tap tiles to build a word</span></div>' +
         '<span class="clr" id="buildClr">Clear</span></div>';
}

function refreshBuild(){
  const box = document.getElementById("buildBox");
  if(!box) return;
  box.innerHTML = builtParts.length
    ? esc(builtParts.join(""))
    : '<span class="ph">tap tiles to build a word</span>';
}

function wireBuilder(){
  slideText.querySelectorAll(".bigcell").forEach(c => {
    c.onclick = (e) => e.stopPropagation();
    c.oninput = () => {
      const s = deck[idx];
      if(!s) return;
      if(!s.vals) s.vals = ["", ""];
      s.vals[Number(c.dataset.i)] = c.innerText;
    };
  });
  const box = document.getElementById("buildBox");
  if(!box) return;
  slideText.querySelectorAll(".tile").forEach(t => {
    t.onclick = (e) => {
      e.stopPropagation();
      builtParts.push(t.dataset.t.replace(/-/g, ""));
      refreshBuild();
    };
  });
  const clr = document.getElementById("buildClr");
  if(clr) clr.onclick = (e) => { e.stopPropagation(); builtParts = []; refreshBuild(); };
  box.onclick = (e) => { e.stopPropagation(); builtParts.pop(); refreshBuild(); };
}

function wireInk(){
  const cv = slideText.querySelector(".inkpad");
  const tools = slideText.querySelector(".inktools");
  if(tools) tools.querySelectorAll("button").forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      if(b.dataset.mode){ inkMode = b.dataset.mode; }
      else if(b.dataset.pen){ inkColour = b.dataset.pen; inkErase = false; }
      else if(b.dataset.erase){ inkErase = !inkErase; }
      else if(b.dataset.clear){ const s = deck[idx]; if(s) s.ink = []; }
      paint();
    };
  });
  if(!cv) return;
  const s = deck[idx];
  if(!s.ink) s.ink = [];
  const ctx = cv.getContext("2d");

  function redraw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    s.ink.forEach(st => {
      if(st.pts.length < 2) return;
      ctx.globalCompositeOperation = st.e ? "destination-out" : "source-over";
      ctx.strokeStyle = st.c; ctx.lineWidth = st.w;
      ctx.beginPath();
      ctx.moveTo(st.pts[0][0], st.pts[0][1]);
      for(let i = 1; i < st.pts.length; i++) ctx.lineTo(st.pts[i][0], st.pts[i][1]);
      ctx.stroke();
    });
    ctx.globalCompositeOperation = "source-over";
  }
  redraw();

  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * (cv.width / r.width),
            (e.clientY - r.top)  * (cv.height / r.height)];
  };
  let cur = null;
  cv.onclick = (e) => e.stopPropagation();
  cv.onpointerdown = (e) => {
    if(inkMode !== "draw" && !cv.classList.contains("always")) return;
    e.stopPropagation(); e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    lastInkAt = Date.now();
    cur = {c: inkColour, w: inkErase ? 46 : 7, e: inkErase, pts: [pos(e)]};
    s.ink.push(cur);
  };
  cv.onpointermove = (e) => {
    if(!cur) return;
    e.stopPropagation();
    cur.pts.push(pos(e));
    redraw();
  };
  const stop = (e) => {
    try{ if(cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId); }catch(_){}
    if(cur){ e.stopPropagation(); cur = null; lastInkAt = Date.now(); }
  };
  cv.onpointerup = stop;
  cv.onpointercancel = stop;
  cv.onpointerleave = stop;
}

function wireMatrixWords(){
  const box = slideText.querySelector(".mxbox");
  if(!box) return;
  box.onclick = (e) => e.stopPropagation();
  box.oninput = () => { const s = deck[idx]; if(s) s.wordText = box.innerText; };
}

function stepTag(s){
  const M = {morpheme: "Review prior learning",
    sayword: "Phonological form",
    word: "Phonological form",
    phonframe: "Phonological form",
    orthframe: "Orthographic form",
    definition: "Semantic form",
    example: "Semantic form",
    nonexample: "Semantic form",
    syntax: "Syntactic form", syntaxblank: "Syntactic form",
    etymology: "Etymological form",
    sums: "Morphological form",
    wordmatrix: "Morphological form",
    copytable: "Morphological form",
    matrix: "Morphological form",
    tileswap: "Morphological form"};
  const t = M[s.type];
  return t ? '<div class="steptag">' + t + '</div>' : "";
}

        '<button data-mode="type" class="' + (inkMode === "type" ? "on" : "") + '">Type</button>' +

        '<button data-clear="1">Clear</button>' +
        '</div>';
      return ol("Morpheme matrix", "s-lg head") +
        '<div class="mx">' + col("Prefix", s.prefixes) + col("Root", s.bases) +
        col("Suffix", s.suffixes) + '</div>' +
        '<div class="mxtitle">Our word list:</div>' + tools +
        '<div class="mxpad">' +
          '<div class="mxbox' + (inkMode === "draw" ? " off" : "") + '" contenteditable="true" ' +
          'data-ph="Write or type the words we make\u2026">' + esc(s.wordText || "") + '</div>' +
          '<canvas class="mxink inkpad' + (inkMode === "type" ? " off" : "") + '" width="1320" height="250"></canvas>' +
        '</div>';

    case "wordpair":
      return ol("Use both words in one sentence", "s-lg head") +
        '<div class="pair"><div class="pw">' + esc(s.a) + '</div>' +
        '<div class="amp">and</div><div class="pw">' + esc(s.b) + '</div></div>';
    case "family":
      return ol("How many words can you find?", "s-lg head") +
        ol(s.m + (s.d ? "  \u2014  " + s.d : ""), "s-md") +
        (showAnswer && s.words.length
          ? '<div class="fam">' + s.words.map(w => '<span>' + esc(w) + '</span>').join("") + '</div>'
          : "");
    case "breakword":
      return ol("Break it up", "s-lg head") + ol(s.word, "s-xl") +
        '<div class="blankline">___ + ___ + ___</div>';
    case "spellword":
      return ol("Spell it", "s-lg head") +
        (showAnswer ? ol(s.word, "s-xl") : '<div class="blankline">_ _ _ _ _ _</div>');
    case "sentword":
      return ol("Use it in a sentence", "s-lg head") + ol(s.word, "s-xl");
    case "sayclap":
      return ol(s.word, "s-xl") +
        '<div class="icons">\uD83D\uDDE3\uFE0F \uD83D\uDC4F \u270B</div>';
    case "write":
      return ol("Write it", "s-lg head") + ol(s.word, "s-xl");
    case "opensums":
      return ol("Word sums \u2014 your turn", "s-lg head") +
        '<div class="blankline">______ + ______ + ______ = ____________</div>';
    case "dictation":
      return ol("Sentence dictation", "s-lg head") +
        (s.n ? '<div class="dictword">Sentence ' + s.n + '</div>' : "") +
        (!s.text ? '<div class="blankline">______ / ______ / ______</div>'
                 : showAnswer ? ol(s.text, "s-sent")
                              : '<div class="blankline">______ / ______ / ______</div>');
    case "done":
      return '<div class="donewrap">' + ol(s.head || "Nice work!", "s-xl") +
             ol(s.text, "s-md") + '</div>';
  }
  return "";
}

function slideClass(s){
  if(s.type === "newword") return "drum";
  if(s.type === "sayword") return "drum say";
  if(s.type === "etymology") return "sentence etym";
  if(s.type === "dictation" && s.text) return "sentence";
  if(s.type === "matrixbuild")
    return "mxslide" + ((s.prefixes.length > 3 || s.bases.length > 3 || s.suffixes.length > 4) ? " tight" : "");
  if(s.type === "wordmatrix")
    return "mxslide" + ((s.prefixes.length > 3 || s.bases.length > 3 ||
                         s.slots.some(sl => sl.length > 3) || s.words.length > 5) ? " tight" : "");
  if(["definition","example","nonexample","scenario","applyprompt"].includes(s.type)) return "sentence";
  if(s.type === "thumbs") return "thumbslide";
  if(s.type === "copytable") return "copyslide";
  if(s.type === "syntaxblank") return "blankslide";
  if(s.type === "syntax") return "syntaxslide";
  if(s.type === "word" || s.type === "sayword") return "wordslide";
  if(s.type === "intention") return "lislide";
  if(s.type === "phonframe" || s.type === "orthframe") return "frslide";
  return "";
}

function needsReveal(s){
  if(s.type === "morpheme") return s.mode !== "all";
  if(s.type === "syntax") return true;
  if(s.type === "dictation" && s.text) return true;
  if(s.type === "thumbs" && s.ans) return true;
  if(s.type === "spellword") return true;
  if(s.type === "family") return true;
  if(s.type === "phonframe" && s.sounds) return true;
  if(s.type === "orthframe") return true;
  return false;
}

function hintFor(s, showAnswer){
  if(s.type === "morpheme" && !showAnswer)
    return s.mode === "m"
      ? "Spell the morpheme aloud \u2014 students give the meaning"
      : "Read the meaning \u2014 students spell the morpheme";
  if(s.type === "intention") return "Read it with the class";
  if(s.type === "sayword") return "My turn, your turn \u00b7 say it, students repeat it";
  if(s.type === "word") return "Clap the syllables \u2014 units of sound, not morphemes";
  if(s.type === "phonframe")
    return showAnswer ? "Tap each box as you say its sound"
                      : "One counter per sound \u00b7 tap to check";
  if(s.type === "orthframe")
    return showAnswer ? "Check it \u00b7 one grapheme per box"
                      : "Graph each sound into its box \u00b7 tap to check";
  if(s.type === "wordmatrix")
    return "Rewrite the word into the matrix \u00b7 spell each affix letter by letter";
  if(s.type === "sums")
    return "Spell each affix letter by letter \u2014 \u2018i\u2019 \u2018b\u2019 \u2018l\u2019 \u2018e\u2019, not \u201c-ible\u201d";
  if(s.type === "newword") return "Tap for the big reveal";
  if(s.type === "syntax")
    return showAnswer ? "Your turn in the boxes underneath \u00b7 tap the background for the next one"
                      : "Tap to reveal the word function";
  if(s.type === "dictation" && !showAnswer) return "Students write it \u00b7 tap to check";
  if(s.type === "spellword" && !showAnswer) return "Say the word aloud \u00b7 students write it \u00b7 tap to check";
  if(s.type === "breakword") return "Students split it into morphemes";
  if(s.type === "family" && !showAnswer) return "List the words you know \u00b7 tap to compare";
  if(s.type === "wordpair") return "One sentence, both words";
  if(s.type === "matrixbuild") return "Draw or type in the word list \u00b7 tap the background for the next one";
  if(s.type === "thumbs" && s.ans && !showAnswer) return "Thumbs up or thumbs down? \u00b7 tap to check";
  if(s.type === "syntaxblank") return "Draw or type in the boxes \u00b7 tap the blue background for the next one";
  return "Tap for the next one";
}

function paint(){
  const hint = document.getElementById("tapHint");
  const counter = document.getElementById("counter");
  if(idx >= deck.length){
    counter.textContent = "";
    slideText.className = "";
    paintPalette(idx);
    document.getElementById("stage").classList.remove("dark", "nopills");
    slideText.innerHTML = slideHTML({type:"done", head: doneHead, text: doneText}, true);
    hint.textContent = "Tap to finish";
    revealed = true;
    return;
  }
  const s = deck[idx];
  counter.textContent = (idx + 1) + " / " + deck.length;
  revealed = !needsReveal(s);
  slideText.className = slideClass(s);
  paintPalette(idx);
  const inter = ["syntaxblank", "syntax", "matrix", "tileswap", "matrixbuild", "orthframe"].includes(s.type);
  document.getElementById("prevZone").style.display = inter ? "none" : "";
  document.getElementById("stage").classList.toggle("dark",
    s.type === "newword" || s.type === "sayword");
  document.getElementById("stage").classList.toggle("nopills",
    s.type === "copytable" || s.type === "matrixbuild");
  if(s.type === "matrix" || s.type === "tileswap") builtParts = [];
  slideText.innerHTML = slideHTML(s, revealed) + stepTag(s);
  wireBuilder();
  wireInk();
  wireMatrixWords();
  hint.textContent = hintFor(s, revealed);
  if(s.type === "newword") drumRoll(2.4);
}

function advance(){
  if(Date.now() - lastInkAt < 350) return;   // finishing a pen stroke, not a tap
  if(idx >= deck.length){ closeShow(); return; }
  const s = deck[idx];
  if(!revealed){
    revealed = true;
    slideText.innerHTML = slideHTML(s, true) + stepTag(s);
    wireBuilder();
    wireInk();
    wireMatrixWords();
    document.getElementById("tapHint").textContent = hintFor(s, true);
    if(s.type === "newword") cymbal();
    return;
  }
  if(s.type === "newword") cymbal();
  idx++;
  paint();
}

function back(){ if(idx > 0){ idx--; paint(); } }

function fitStage(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById("stage").style.transform =
    "translate(-50%, -50%) scale(" + s + ")";
}

function noiseBuffer(ctx, secs){
  const b = ctx.createBuffer(1, ctx.sampleRate * secs, ctx.sampleRate);
  const d = b.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function ac(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}

function drumRoll(secs){
  const ctx = ac(); if(!ctx) return;
  if(ctx.state === "suspended") ctx.resume();
  const t0 = ctx.currentTime, dur = secs || 2.0;
  let t = t0, gap = 0.085;
  while(t < t0 + dur){
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 0.06);
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 220; bp.Q.value = 1.1;
    const g = ctx.createGain();
    const prog = (t - t0) / dur;
    g.gain.setValueAtTime(0.05 + prog * 0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + 0.06);
    t += gap;
    gap = Math.max(0.022, gap * 0.93);
  }
}

function cymbal(){
  const ctx = ac(); if(!ctx) return;
  if(ctx.state === "suspended") ctx.resume();
  const t = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 1.2);
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 5000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
  src.connect(hp); hp.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + 1.2);
}
window.addEventListener("resize", fitStage);
show.onclick = () => advance();
document.getElementById("prevZone").onclick = (e) => { e.stopPropagation(); back(); };
document.getElementById("backBtn").onclick = (e) => { e.stopPropagation(); back(); };
document.getElementById("fs").onclick = (e) => { e.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{}); };
const NEXT_KEYS = ["ArrowRight","ArrowDown","PageDown"," ","Enter","Spacebar","Right","Down"];
const PREV_KEYS = ["ArrowLeft","ArrowUp","PageUp","Backspace","Left","Up"];
function toggleBlank(){ const st=document.getElementById("stage");
  st.style.visibility = st.style.visibility === "hidden" ? "" : "hidden"; }
document.addEventListener("keydown", (e) => {
  if(e.target && e.target.isContentEditable) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(NEXT_KEYS.includes(e.key)){ e.preventDefault(); advance(); }
  else if(PREV_KEYS.includes(e.key)){ e.preventDefault(); back(); }
  else if(e.key === "." || e.key === "b" || e.key === "B"){ e.preventDefault(); toggleBlank(); }
  else if(e.key === "Home"){ e.preventDefault(); idx = 0; paint(); }
  else if(e.key === "End"){ e.preventDefault(); idx = Math.max(0, deck.length-1); paint(); }
  else if(e.key === "Escape"){ const st=document.getElementById("stage");
    if(st.style.visibility === "hidden") st.style.visibility = ""; }
});
fitStage(); paint();
</script>
