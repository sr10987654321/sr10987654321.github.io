<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Campaign Poster Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: light editor chrome — icon rail, element panel, soft grey stage, contextual edit panel. */
:root{
  --bg:#F2F3F7; --panel:#FFFFFF; --line:#E7E9F0; --line2:#D5D8E3;
  --fg:#1C1F2B; --fg2:#5B6275; --fg3:#8B92A6;
  --accent:#6A4CFF; --accent2:#13C2B4; --accentSoft:#EFEBFF; --danger:#E5484D;
  --grad:linear-gradient(90deg,#6A4CFF,#13C2B4);
  --sh:0 1px 2px rgba(28,31,43,.06),0 8px 24px rgba(28,31,43,.08);
  --r:12px;
  --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#top{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));flex-wrap:wrap;min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff}
#nameField{border:1px solid var(--line2);border-radius:10px;padding:7px 11px;min-width:150px;max-width:220px;background:#fff}
#nameField::placeholder{color:var(--fg3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--bg);color:var(--fg2);border:1px solid var(--line)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2)}
.chip.done{background:#E6F8F4;color:#0B7A6E;border-color:#BDEBE4}.chip.done::before{background:var(--accent2)}
.spacer{flex:1}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-weight:600;color:var(--fg)}
.tb:hover{background:var(--bg)}
.tb:disabled{opacity:.4;cursor:default}
.tb.icon{width:36px;padding:0}
.tb.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 4px 14px rgba(106,76,255,.3)}
.tb.primary:hover{filter:brightness(1.06)}
.zoomgrp{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:#fff;height:36px}
.zoomgrp button{width:34px;height:100%;font-size:15px;font-weight:600;color:var(--fg2)}
.zoomgrp span{font-size:12px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--fg2)}

#main{flex:1;display:grid;grid-template-columns:78px 320px 1fr 300px;min-height:0;position:relative}
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow:auto;padding-left:max(6px,env(safe-area-inset-left,0px))}
#rail button{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--fg2);font-size:10.5px;font-weight:600;border-radius:10px;padding:9px 2px;width:100%}
#rail button svg{width:22px;height:22px}
#rail button.on{background:var(--accentSoft);color:var(--accent)}
#rail button:hover:not(.on){background:var(--bg)}

#panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel h2{margin:0;padding:16px 16px 6px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.01em}
#panelBody{flex:1;overflow:auto;padding:4px 16px 24px}
.hint{font-size:12px;color:var(--fg2);line-height:1.5;margin:4px 0 12px}
.pSec{margin-bottom:16px}
.pSec h3{margin:14px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:700}
.grid{display:grid;gap:8px}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c6{grid-template-columns:repeat(6,1fr)}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;overflow:hidden;position:relative;transition:transform .08s,box-shadow .08s}
.tile:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--line2)}
.tile:active{transform:scale(.97)}
.tile svg{width:74%;height:74%;display:block}
.tile.sticker{font-size:28px;line-height:1}
.tile.tmpl{aspect-ratio:1000/1414;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile.tmpl svg{width:100%;height:100%}
.tile.tmpl::after{content:attr(data-n);position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;padding:14px 6px 6px;text-align:left}
.tile.on{outline:2px solid var(--accent);outline-offset:-2px}
.textPreset{width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;line-height:1.1}
.textPreset:hover{box-shadow:var(--sh);border-color:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;background:var(--fg);color:#fff;font-weight:600;font-size:13px}
.btn:hover{background:#2c3041}
.btn.sec{background:#fff;color:var(--fg);border:1px solid var(--line2)}
.btn.sec:hover{background:var(--bg)}
.btn.acc{background:var(--accent)}.btn.acc:hover{background:#5a3ee6}
.btn.danger{background:var(--danger)}
.btn.full{width:100%}
.btn.sm{height:32px;padding:0 11px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.bgtile{aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
.bgtile.on{box-shadow:0 0 0 2px var(--accent)}
.bgtile svg{width:100%;height:100%;display:block}
input[type=color]{width:100%;height:36px;border:1px solid var(--line2);border-radius:10px;padding:2px;background:#fff}
#camWrap{background:#111;border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;position:relative}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camMsg{color:#cfd3dd;font-size:12.5px;padding:14px;text-align:center;line-height:1.5}
.layer{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:#fff}
.layer.on{border-color:var(--accent);background:var(--accentSoft)}
.layer .nm{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer button{font-size:13px;width:28px;height:28px;border-radius:8px;background:var(--bg);color:var(--fg2)}
.saved{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:#fff}
.saved img{width:48px;height:68px;object-fit:cover;border-radius:6px;background:#eee}
.saved .nm{flex:1;font-weight:600;font-size:12.5px}
.saved .nm small{display:block;color:var(--fg3);font-weight:500;margin-top:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle input{width:40px;height:22px;accent-color:var(--accent)}

#stageWrap{position:relative;overflow:auto;background:var(--bg);display:grid;place-items:center;touch-action:none;min-width:0}
#stageInner{padding:32px}
#stage{display:block;background:#fff;box-shadow:0 2px 6px rgba(28,31,43,.08),0 24px 60px rgba(28,31,43,.14);touch-action:none;user-select:none;-webkit-user-select:none}
#stage text{user-select:none;-webkit-user-select:none}
#stage.drawing{cursor:crosshair}
.penOpt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;width:100%;text-align:left;font-weight:600}
.penOpt.on{border-color:var(--accent);background:var(--accentSoft)}
.penOpt svg{width:60px;height:22px;flex:none}
.hnd{fill:#fff;stroke:var(--accent);stroke-width:1.5;cursor:pointer}
.hnd.rot{fill:#fff;stroke:var(--accent)}
.selbox{fill:none;stroke:var(--accent);pointer-events:none}
.ph-frame{stroke:#A9B0C2;stroke-dasharray:10 8;fill:#EEF0F5}
#floatBar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:2px;background:#fff;padding:5px;border-radius:12px;box-shadow:var(--sh);border:1px solid var(--line)}
#floatBar button{width:38px;height:38px;border-radius:9px;color:var(--fg2);display:grid;place-items:center}
#floatBar button:hover{background:var(--bg);color:var(--fg)}
#floatBar button.danger:hover{background:#FDECEC;color:var(--danger)}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:12.5px;box-shadow:var(--sh);opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;max-width:90%;text-align:center}
#toast.show{opacity:1}

#props{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 16px 40px;padding-right:max(16px,env(safe-area-inset-right,0px))}
#props h2{margin:0 0 12px;font-size:15px;font-weight:700}
.prop{margin-bottom:14px}
.prop label,.prop .lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px;font-weight:700}
.prop textarea{width:100%;min-height:80px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;resize:vertical;font-size:14px;line-height:1.35;background:#fff}
.prop select,.prop input[type=text]{width:100%;height:38px;border:1px solid var(--line2);border-radius:10px;padding:0 10px;background:#fff}
.prop input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;height:34px;font-weight:700;font-size:13px;color:var(--fg2)}
.seg button.on{background:var(--fg);color:#fff}
.seg button:not(.on):hover{background:var(--bg)}
.empty{color:var(--fg3);font-size:12.5px;line-height:1.5;text-align:center;padding:40px 10px}
.fontOpt{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:#fff;font-size:17px;line-height:1.1;display:flex;justify-content:space-between;align-items:center}
.fontOpt small{font-family:var(--ui);font-size:10px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase}
.fontOpt.on{border-color:var(--accent);background:var(--accentSoft)}
.fx{aspect-ratio:1;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line2);display:grid;place-items:end start;font-size:10px;font-weight:700;color:#fff;padding:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.fx.on{box-shadow:0 0 0 2px var(--accent)}

#modal{position:fixed;inset:0;background:rgba(28,31,43,.5);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px}
#modalBox{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#modalBox h2{margin:0 0 8px;font-size:18px;font-weight:700}
#modalBox img{width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0;box-shadow:var(--sh)}
.mobileOnly{display:none}

@media (max-width:1180px){#main{grid-template-columns:74px 280px 1fr 260px}}
@media (max-width:900px){
  #main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #rail{flex-direction:row;order:2;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-x:auto}
  #rail button{width:auto;min-width:64px;padding:6px 4px}
  #stageWrap{order:1}
  #panel{position:absolute;left:0;top:0;bottom:70px;width:min(330px,90vw);z-index:4;box-shadow:12px 0 32px rgba(0,0,0,.12);border-right:0}
  #panel.closed{display:none}
  #props{position:absolute;right:0;bottom:70px;left:0;max-height:50%;z-index:3;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
  #props.closed{display:none}
  .mobileOnly{display:inline-flex}
  .brand .t{display:none}
  #floatBar{bottom:auto;top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header id="top">
  <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 20v-5h6v5"/><path d="m8 9 2-2 3 3 2-2 1 1"/></svg></span><span class="t">Campaign Poster Studio</span></div>
  <input id="nameField" type="text" placeholder="Your name" autocomplete="off" maxlength="40">
  <div class="chips" id="chips">
    <span class="chip" id="chSlogan">Slogan</span>
    <span class="chip" id="chPhoto">Photo</span>
    <span class="chip" id="chProm">Promises 0/3</span>
  </div>
  <div class="spacer"></div>
  <button class="tb icon" id="undoBtn" title="Undo" aria-label="Undo"><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="tb icon" id="redoBtn" title="Redo" aria-label="Redo"><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <div class="zoomgrp"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLbl">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomFit" title="Fit" aria-label="Fit">⤢</button></div>
  <button class="tb" id="saveBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Save</button>
  <button class="tb primary" id="exportBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>Download</button>
</header>

<div id="main">
  <nav id="rail" aria-label="Tools">
    <button data-tool="templates"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Templates</button>
    <button data-tool="text"><svg class="ic" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <button data-tool="photo"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
    <button data-tool="graphics"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c.5 4.5 3.5 8 8.5 9-5 1-8 4.5-8.5 9-.5-4.5-3.5-8-8.5-9 5-1 8-4.5 8.5-9z"/></svg>Graphics</button>
    <button data-tool="shapes"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><rect x="11" y="11" width="9" height="9" rx="2"/></svg>Shapes</button>
    <button data-tool="draw"><svg class="ic" viewBox="0 0 24 24"><path d="m4 20 1-4L16 5l3 3L8 19z"/><path d="m14 7 3 3"/></svg>Draw</button>
    <button data-tool="stickers"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01M8.5 14c1 1.5 2.2 2 3.5 2s2.5-.5 3.5-2"/></svg>Stickers</button>
    <button data-tool="backgrounds"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 16 4-4 4 4 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1.5"/></svg>Backdrop</button>
    <button data-tool="layers"><svg class="ic" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/></svg>Layers</button>
    <button data-tool="saved"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>My posters</button>
  </nav>

  <aside id="panel" class="closed">
    <h2><span id="panelTitle">Templates</span><button class="tb icon mobileOnly" id="panelClose" aria-label="Close panel">✕</button></h2>
    <div id="panelBody"></div>
  </aside>

  <div id="stageWrap">
    <div id="stageInner"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414"></svg></div>
    <div id="floatBar" hidden>
      <button id="fbUp" title="Bring forward"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V6m0 0-5 5m5-5 5 5"/></svg></button>
      <button id="fbDown" title="Send backward"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v13m0 0 5-5m-5 5-5-5"/></svg></button>
      <button id="fbDup" title="Duplicate"><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button id="fbFlip" title="Flip"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v16M9 7 4 12l5 5M15 7l5 5-5 5"/></svg></button>
      <button id="fbLock" title="Lock / unlock"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button id="fbEdit" title="Edit" class="mobileOnly"><svg class="ic" viewBox="0 0 24 24"><path d="m4 20 4-1L19 8l-3-3L5 16z"/></svg></button>
      <button id="fbDel" title="Delete" class="danger"><svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
    <div id="toast"></div>
  </div>

  <aside id="props" class="closed"><div id="propsBody"></div></aside>
</div>

<div id="modal" hidden><div id="modalBox"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="camIn" accept="image/*" capture="user" hidden>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ basics ============ */
const W=1000,H=1414,NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const svg=$('#stage');
let uidc=1;const nid=()=>'o'+Date.now().toString(36)+(uidc++);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)if(attrs[k]!=null)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e;}
const toastEl=$('#toast');let toastT;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2400);}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

/* ============ palette & fonts ============ */

/* ============ shapes (100x100) ============ */
function starPath(points,inner,cx=50,cy=50,r=50){let d='';for(let i=0;i<points*2;i++){const rr=i%2?r*inner:r,a=-Math.PI/2+i*Math.PI/points;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(2)+' '+(cy+rr*Math.sin(a)).toFixed(2);}return d+'Z';}
function polyPath(n,cx=50,cy=50,r=50,rot=-Math.PI/2){let d='';for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2);}return d+'Z';}
function scallop(n,cx=50,cy=50,r=46,b=6){let d='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n,a2=(i+.5)*2*Math.PI/n,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a),mx=cx+(r+b)*Math.cos(a2),my=cy+(r+b)*Math.sin(a2);d+=(i?'':'M'+x.toFixed(2)+' '+y.toFixed(2));const nx=cx+r*Math.cos((i+1)*2*Math.PI/n),ny=cy+r*Math.sin((i+1)*2*Math.PI/n);d+=`Q${mx.toFixed(2)} ${my.toFixed(2)} ${nx.toFixed(2)} ${ny.toFixed(2)}`;}return d+'Z';}

/* pill and rounded rect keep true corner radii at any proportion */
function shapeD(k,w,hh){if(k==='pill'){const r=Math.min(w,hh)/2;return `M${r} 0H${w-r}A${r} ${r} 0 0 1 ${w-r} ${hh}H${r}A${r} ${r} 0 0 1 ${r} 0Z`;}if(k==='roundrect'||k==='squircle'){const r=Math.min(w,hh)*(k==='squircle'?.42:.18);return `M${r} 0H${w-r}Q${w} 0 ${w} ${r}V${hh-r}Q${w} ${hh} ${w-r} ${hh}H${r}Q0 ${hh} 0 ${hh-r}V${r}Q0 0 ${r} 0Z`;}return null;}

});
function finishStroke(e){
  const st=curStroke;curStroke=null;if(curPath){curPath.remove();curPath=null;}try{svg.releasePointerCapture(e.pointerId);}catch(err){}
  if(!st||st.pts.length<1)return;
  if(st.pts.length===1)st.pts.push([st.pts[0][0]+.5,st.pts[0][1]]);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const [x,y] of st.pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  const pad=draw.width/2;x0-=pad;y0-=pad;x1+=pad;y1+=pad;const w=Math.max(x1-x0,4),hh=Math.max(y1-y0,4);
  const o=newDrawing({pts:st.pts.map(([x,y])=>[+(x-x0).toFixed(1),+(y-y0).toFixed(1)]),x:x0,y:y0,w,h:hh,bw:w,bh:hh,color:draw.color,width:draw.width,pen:draw.pen});
  pushUndo();doc.objs.push(o);objG.appendChild(renderObj(o));scheduleSave();
}
function endDrag(e){if(curStroke)return finishStroke(e);if(!drag)return;const d=drag;drag=null;try{svg.releasePointerCapture(e.pointerId);}catch(err){}
  if(d.kind==='tapphoto'){openTool('photo');return;}if(d.pushed){scheduleSave();showProps();}}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('dblclick',()=>{const o=getSel();if(o&&o.type==='text'){const ta=$('#p-text');if(ta){ta.focus();ta.select();}}});

/* ============ commands ============ */
function del(){const o=getSel();if(!o||o.locked)return;pushUndo();doc.objs=doc.objs.filter(x=>x!==o);sel=null;render();showProps();renderLayersIfOpen();}
function dup(){const o=getSel();if(!o)return;const c=JSON.parse(JSON.stringify(o));c.id=nid();c.x+=30;c.y+=30;c.locked=false;addObj(c);}
$('#fbDel').onclick=()=>del();$('#fbDup').onclick=dup;
$('#fbUp').onclick=()=>{const o=getSel();if(o)move(o,1);};$('#fbDown').onclick=()=>{const o=getSel();if(o)move(o,-1);};
$('#fbFlip').onclick=()=>{const o=getSel();if(!o||o.locked)return;pushUndo();o.flip=!o.flip;updateObjEl(o);};
$('#fbLock').onclick=()=>{const o=getSel();if(!o)return;pushUndo();o.locked=!o.locked;renderSel();showProps();renderLayersIfOpen();toast(o.locked?'Locked.':'Unlocked.');};
$('#fbEdit').onclick=()=>$('#props').classList.toggle('closed');
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
$$('#rail button').forEach(b=>b.onclick=()=>{if(curTool===b.dataset.tool&&!$('#panel').classList.contains('closed')&&window.innerWidth<=900){$('#panel').classList.add('closed');return;}openTool(b.dataset.tool);});
$('#panelClose').onclick=()=>{$('#panel').classList.add('closed');stopCam();drawMode=false;svg.classList.remove('drawing');$$('#rail button').forEach(b=>b.classList.remove('on'));};
$('#nameField').addEventListener('input',scheduleSave);
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT'){if(e.key==='Escape')document.activeElement.blur();return;}
  const o=getSel();const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key.toLowerCase()==='d'&&o){e.preventDefault();dup();return;}
  if(!o)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del();}
  if(e.key.startsWith('Arrow')&&!o.locked){e.preventDefault();const s=e.shiftKey?20:3;if(!e.repeat)pushUndo();if(e.key==='ArrowLeft')o.x-=s;if(e.key==='ArrowRight')o.x+=s;if(e.key==='ArrowUp')o.y-=s;if(e.key==='ArrowDown')o.y+=s;updateObjEl(o);scheduleSave();}
  if(e.key==='Escape'){sel=null;renderSel();showProps();}
});

/* ============ zoom ============ */
function setZoom(z){zoom=clamp(z,.15,3);svg.setAttribute('width',W*zoom);svg.setAttribute('height',H*zoom);$('#zoomLbl').textContent=Math.round(zoom*100)+'%';renderSel();}
function fitZoom(){const w=$('#stageWrap').clientWidth-64,hh=$('#stageWrap').clientHeight-64;setZoom(Math.min(w/W,hh/H));}
let userZoomed=false;
$('#zoomIn').onclick=()=>{userZoomed=true;setZoom(zoom*1.2);};$('#zoomOut').onclick=()=>{userZoomed=true;setZoom(zoom/1.2);};$('#zoomFit').onclick=()=>{userZoomed=false;fitZoom();};
window.addEventListener('resize',()=>{if(!userZoomed)fitZoom();});

/* ============ export ============ */
function exportSvgString(){
  const c=svg.cloneNode(true);c.querySelector('#selG').remove();c.setAttribute('width',W);c.setAttribute('height',H);c.setAttribute('xmlns','http://www.w3.org/2000/svg');c.setAttribute('xmlns:xlink','http://www.w3.org/1999/xlink');
  c.querySelectorAll('.ph-frame').forEach(n=>{n.setAttribute('fill','#EEF0F5');n.setAttribute('stroke','#A9B0C2');n.setAttribute('stroke-dasharray','10 8');});
  c.querySelectorAll('[data-ph]').forEach(n=>n.remove());
  const st=document.createElementNS(NS,'style');st.textContent='text{white-space:pre}';c.insertBefore(st,c.firstChild);
  return new XMLSerializer().serializeToString(c);
}
function renderPng(scale=2,mime='image/png',q){
  return new Promise((res,rej)=>{
    const s=exportSvgString();const blob=new Blob([s],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);
    const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(W*scale);c.height=Math.round(H*scale);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);try{res(c.toDataURL(mime,q));}catch(e){rej(e);}};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('render'));};im.src=url;
  });
}
function exportPoster(){
  const name=$('#nameField').value.trim()||'poster';toast('Making your poster…');
  renderPng(2).then(png=>{
    const b=$('#modalBox');b.innerHTML='';
    const slog=doc.objs.some(o=>o.role==='slogan'&&!o.ph),photo=doc.objs.some(o=>o.type==='image'&&assets[o.asset]),prom=doc.objs.filter(o=>o.role==='promise'&&!o.ph).length;
    const missing=[!slog&&'a slogan',!photo&&'a photo',prom<3&&(3-prom)+' more promise'+(3-prom>1?'s':'')].filter(Boolean);
    b.append(h('h2',{},missing.length?'Almost there':'Your poster is ready'));
    if(missing.length)b.append(h('p',{class:'hint',style:'font-size:14px;color:#E5484D;font-weight:600'},'It still needs '+missing.join(', ')+'. You can download anyway, or go back and finish.'));
    b.append(h('img',{src:png,alt:'Your poster'}));
    b.append(h('div',{class:'row'},h('a',{class:'btn acc',href:png,download:name.replace(/[^\w\- ]/g,'')+' - election poster.png',style:'text-decoration:none'},'Download PNG'),
      h('button',{class:'btn sec',onclick:()=>{const d=JSON.stringify({doc,assets,name});const bl=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(bl);const l=h('a',{href:u,download:name.replace(/[^\w\- ]/g,'')+' - poster.json'});document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}},'Save editable file'),
      h('button',{class:'btn sec',onclick:closeModal},'Back')));
    b.append(h('p',{class:'hint'},'On an iPad, press and hold the picture and choose "Add to Photos".'));
    $('#modal').hidden=false;
  }).catch(()=>toast('Could not make the picture. Try again.'));
}
$('#exportBtn').onclick=exportPoster;$('#saveBtn').onclick=savePoster;

/* ============ boot ============ */
(function boot(){
  let restored=false;
  try{const s=JSON.parse(localStorage.getItem('cps2-current')||'null');if(s&&s.doc&&s.doc.objs&&s.doc.objs.length&&s.doc.objs.every(o=>o.type!=='shape'||o.fill)){doc=s.doc;assets=s.assets||{};$('#nameField').value=s.name||'';restored=true;}}catch(e){}
  if(!restored){const d=TEMPLATES[1].f();doc.bg=Object.assign({c2:'#F6C445',c3:'#D9D4FF',grain:0},d.bg);doc.objs=d.objs;}
  render();fitZoom();updateUndoBtns();showProps();
  openTool('templates');
  if(window.innerWidth<=900)$('#panel').classList.add('closed');
  if(restored)toast('Welcome back — your poster was saved on this device.');
})();
</script>
