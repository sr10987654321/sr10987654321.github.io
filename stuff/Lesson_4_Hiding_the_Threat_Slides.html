const units=[{"n": 4, "title": "Hiding the Threat", "slides": [["The threat is hidden", "Something is nearby. But what?", "hero"], ["Learning intention", "To create suspense by hiding the threat.", "li"], ["Look, then imagine", "What clues suggest something dangerous is nearby?", "cat"], ["Spot the mystery", "“something crawling” · “a vague shape” · “a green eye flickered”", "quote"], ["Reveal or conceal?", "A giant cat stood in the doorway. | A vague shape slipped into the doorway.", "compare"], ["Vague words", "something · a shape · a shadow · a figure · a movement", "words"], ["One clue at a time", "First: something moves. Next: a sound. Then: a single eye.", "steps"], ["Your turn: shared sentence", "Something ______ beyond the ______. A ______ flashed.", "write"], ["A fresh picture", "What could be hidden from the border collie?", "dog"], ["Independent suspense", "Write 3–5 sentences. Hide the threat. Give clues. Include a powerful movement verb.", "task"], ["Support ladder", "Something ______. A shadow ______. Only ______ could be seen.", "support"], ["Check and share", "Underline your vague word. Circle the movement verb. Did you reveal too much?", "check"]], "duration": "55 minutes", "li": "To create suspense by hiding the threat."}, {"n": 5, "title": "Conjunctions Build Suspense", "slides": [["Make sentences work harder", "Short-Burst Writing 2: Conjunctions", "hero"], ["Learning intention", "To use conjunctions to connect ideas and build suspense in a story.", "li"], ["Watch the weather", "The cat froze. Thunder crashed. How might you link them?", "cat"], ["Three families", "Coordinating · Subordinating · Correlative", "types"], ["Coordinating", "for · and · nor · but · or · yet · so", "words"], ["Subordinating", "although · because · so that · even if · whenever · before · even though · until", "words"], ["Correlative pairs", "whether/or · either/or · both/and · not only/but", "words"], ["Choose meaning", "The cat stayed still, ___ lightning flashed.", "choice"], ["Practise the handout", "Complete the missing conjunctions. Read every finished sentence aloud.", "task"], ["Try these together", ["The tiny cat hid beneath the bush, _____ the storm was getting worse.", "Lightning flashed across the sky, _____ the cat stayed completely still.", "The cat could hide behind the old fence _____ run into the dark alleyway.", "The wind howled through the garden, _____ the cat crouched lower beneath the leaves."], "list"], ["More from the handout", ["The cat was terrified, _____ it knew the Alley Cat was nearby.", "The night was _____ dark _____ stormy.", "The cat froze _____ it heard footsteps approaching.", "_____ the rain was pouring down, the cat could still hear the Alley Cat growling.", "The cat waited _____ the footsteps disappeared.", "_____ the cat heard a noise, its heart began to race."], "list"], ["Apply to suspense", "Although the rain hammered the street, Zelda heard scratching.", "quote"], ["Challenge", "Create a sentence using either/or or both/and.", "task"], ["Review", "Does your conjunction make sense? Are commas and capitals correct?", "check"]], "duration": "55 minutes", "li": "To use conjunctions to connect ideas and build suspense in a story."}, {"n": 6, "title": "Read as a Reader", "slides": [["Read as a Reader", "Today we find answers and explain clues.", "hero"], ["Learning intention", "I will underline the answers in the text and write them down in my book. I will write a sentence to answer the questions.", "li"], ["Return to Zelda", "Read the adapted story. What is happening, in order?", "cat"], ["Literal, vocabulary, inference", "Find it · Work out words · Read between the lines", "types"], ["Model: find evidence", "What was happening all night? → Underline the words that answer it.", "write"], ["Literal questions", ["What was happening all night?", "Where was Zelda crouching?", "What happened to the streetlights?", "What did Zelda hear crawling along the pavement?"], "list"], ["Vocabulary", ["What does “glistening tarmac” tell us about the road?", "What does the word “vague” tell us about the shape Zelda saw?"], "list"], ["Infer: emotions", "What does “her fur prickled” tell us about Zelda’s feelings?", "write"], ["Infer: the shadows", "Why might the author have chosen to hide the cat in the shadows?", "write"], ["Infer: danger", "What makes the reader think that the cat is dangerous?", "write"], ["Full sentence support", "The text says ______. This shows ______ because ______.", "support"], ["Your task", "Answer all nine questions in your book. Underline evidence in the text.", "task"], ["Review together", "Which part of the text supports your inference?", "check"]], "duration": "55 minutes", "li": "I will underline the answers in the text and write them down in my book. I will write a sentence to answer the questions."}, {"n": 7, "title": "Read as a Writer", "slides": [["Read as a Writer", "Become a toolkit detective.", "hero"], ["Learning intention", "I will highlight the tool kits that are in the text.", "li"], ["A different question", "Not “What happened?” but “How did the writer do it?”", "cat"], ["Four toolkits", "Physical reactions · Rhetorical questions · Movement verbs · Hide the threat", "types"], ["Toolkit 1", "“Zelda’s fur prickled as she watched.”", "quote"], ["Toolkit 2", "“Had it seen her?”", "quote"], ["Toolkit 3", "“paced through the darkness, slinking…”", "quote"], ["Toolkit 4", "“A vague shape slipped into a doorway.”", "quote"], ["Colour code", "Physical = blue · Questions = purple · Movement = green · Hidden threat = orange", "words"], ["Detective practice", "Find and label another example of each toolkit.", "task"], ["Partner challenge", "Can one sentence use two toolkits? Explain.", "choice"], ["Independent highlighting", "Highlight the four toolkits in your supplied adapted text.", "task"], ["Writer reflection", "This technique makes the reader feel ______ because ______.", "support"]], "duration": "50 minutes", "li": "I will highlight
