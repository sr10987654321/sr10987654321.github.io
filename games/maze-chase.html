<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Maze Chase — by Eric</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#08080c;overflow:hidden;
    font-family:"Trebuchet MS","Verdana",sans-serif;color:#fff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stage{position:relative;width:min(100vw, calc(100vh * 4 / 3));
         height:min(100vh, calc(100vw * 3 / 4));}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;
         image-rendering:crisp-edges;background:#08080c;touch-action:none;}
  #pad{position:absolute;inset:auto 0 0 0;height:38%;pointer-events:none;
       display:flex;justify-content:space-between;align-items:flex-end;padding:0 3% 3%;}
  /* Eric's controls: joystick only. Both buttons are listed as "not used". */
  #dpad{position:relative;width:32vmin;height:22vmin;min-width:140px;min-height:96px;pointer-events:auto;}
  .dbtn{position:absolute;width:10vmin;height:10vmin;min-width:46px;min-height:46px;
        background:#e8724a;border:3px solid rgba(10,8,6,.75);border-radius:22%;
        display:flex;align-items:center;justify-content:center;color:#2a1408;
        font-weight:bold;font-size:3.6vmin;opacity:.75;box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .dbtn:active{opacity:.98;transform:translateY(2px);}
  #dup{left:11vmin;top:0;} #ddown{left:11vmin;bottom:0;}
  #dleft{left:0;top:5.6vmin;} #dright{left:22vmin;top:5.6vmin;}
  .dead{display:flex;gap:2.4vmin;pointer-events:none;align-items:center;}
  .deadbtn{width:11vmin;height:11vmin;min-width:48px;min-height:48px;border-radius:50%;
        background:rgba(120,120,130,.18);border:3px solid rgba(160,160,170,.28);
        display:flex;align-items:center;justify-content:center;
        color:rgba(220,220,230,.45);font-size:2.1vmin;text-align:center;line-height:1.1;}
  #rotate{position:fixed;inset:0;background:#08080c;display:none;
          align-items:center;justify-content:center;text-align:center;padding:24px;
          font-size:20px;line-height:1.5;z-index:50;}
  @media (orientation:portrait) and (max-width:820px){ #rotate{display:flex;} }
  @media (hover:hover) and (pointer:fine){ #pad{display:none;} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="pad">
      <div id="dpad">
        <div class="dbtn" id="dup"    data-k="up">▲</div>
        <div class="dbtn" id="dleft"  data-k="left">◀</div>
        <div class="dbtn" id="dright" data-k="right">▶</div>
        <div class="dbtn" id="ddown"  data-k="down">▼</div>
      </div>
      <div class="dead">
        <div class="deadbtn">BUTTON&nbsp;1<br>not used</div>
        <div class="deadbtn">BUTTON&nbsp;2<br>not used</div>
      </div>
    </div>
  </div>
</div>
<div id="rotate">Turn your iPad sideways 🔦<br>Maze Chase plays in landscape.</div>

<script>
"use strict";
/* =========================================================================
   MAZE CHASE
   Game design by Eric — Pixel Quest, Hilton Primary School
   "There's a maze that you have to get through but there are slow slimes
    in the maze that will kill you if they touch you. The maze is dark and
    you've got a lantern to see where you are."
   Single file, no dependencies, offline friendly.
   ========================================================================= */

const BASE_W = 320, BASE_H = 240, SC = 3;
const HUD_H = 26;
const TILE = 12;
const GW = 25, GH = 15;                     // wall grid (odd) = 12 x 7 cells
const CW = (GW - 1) / 2, CH = (GH - 1) / 2;
const OX = Math.round((BASE_W - GW * TILE) / 2);
const OY = 32;
const LANTERN = 52;                          // how far Eric's lantern reaches

const canvas = document.getElementById('c');
canvas.width = BASE_W * SC; canvas.height = BASE_H * SC;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------------------------------------------------------- sprites */
function bake(rows, pal){
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c2 = cv.getContext('2d');
  for (let y = 0; y < h; y++){
    const row = rows[y];
    for (let x = 0; x < row.length; x++){
      const col = pal[row[x]];
      if (!col) continue;
      c2.fillStyle = col; c2.fillRect(x, y, 1, 1);
    }
  }
  return { img: cv, w, h };
}

const HERO_ROWS = [
  "..kkkkkk..",
  ".kbbbbbbk.",
  "kbbbbbbbbk",
  ".kkkkkkkk.",
  "..kssssk..",
  "..kessek..",
  "..kssssk..",
  ".kggggggk.",
  ".kggggggk.",
  ".kggggggk.",
  "..kppppk..",
  "..kk..kk..",
];
const HERO = bake(HERO_ROWS, { k:"#141018", b:"#3f7fd0", s:"#e8b088", e:"#241a10", g:"#4fae5a", p:"#4a4058" });
const HERO_ARMED = bake(HERO_ROWS, { k:"#141018", b:"#3f7fd0", s:"#e8b088", e:"#241a10", g:"#ffd24a", p:"#4a4058" });

const SLIME_ROWS = [
  "...kkkk...",
  ".kkggggkk.",
  "kggggggggk",
  "kgwggggwgk",
  "kgwggggwgk",
  "kggggggggk",
  "kggggggggk",
  ".kggggggk.",
  "..kkkkkk..",
];
const SLIMES = [
  bake(SLIME_ROWS, { k:"#123a18", g:"#4fc85a", w:"#ffffff" }),   // green
  bake(SLIME_ROWS, { k:"#4a1414", g:"#e8544a", w:"#ffffff" }),   // red
  bake(SLIME_ROWS, { k:"#2a1450", g:"#8b6ad6", w:"#ffffff" }),   // purple
];

const CHEST = bake([
  "..kkkkkkkk..",
  ".kbbbbbbbbk.",
  "kbyyyyyyyybk",
  "kbbbbbbbbbbk",
  "kbyybbbbyybk",
  "kbbbbyybbbbk",
  "kbbbbyybbbbk",
  ".kkkkkkkkkk.",
], { k:"#2a1a0e", b:"#8a5a30", y:"#ffd24a" });

const SWORD = bake([
  "...kk...",
  "..kssk..",
  "..kssk..",
  "..kssk..",
  "..kssk..",
  "..kssk..",
  ".kkkkkk.",
  "kkbbbbkk",
  "...bb...",
  "...bb...",
  "...bb...",
  "..kbbk..",
], { k:"#181420", s:"#d8dce8", b:"#c8922a" });

/* ------------------------------------------------------------------ audio */
let AC = null;
function initAudio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slideTo){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime + dur);
  g.gain.setValueAtTime(vol == null ? .12 : vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur + .02);
}
function melody(notes, type, vol){
  if (!AC) return;
  let t = 0;
  notes.forEach(n => { setTimeout(() => tone(n[0], n[1], type || 'square', vol == null ? .12 : vol), t * 1000); t += n[1] * .85; });
}
/* Eric's sound list, exactly as written */
const SFX = {
  mazeEnd:  () => melody([[1046,.09],[1318,.09],[1568,.20]], 'square', .13),   // high beat
  lifeLost: () => melody([[392,.14],[294,.22]], 'triangle', .14),              // down beat
  slimeGone:() => melody([[523,.07],[784,.12]], 'square', .12),                // upbeat
  allLost:  () => melody([[196,.22],[147,.26],[98,.5]], 'triangle', .15),      // low beat
  chest:    () => melody([[700,.07],[1046,.13]], 'square', .11),
  start:    () => melody([[440,.09],[660,.09],[880,.16]], 'square', .12),
};

/* ------------------------------------------------------------------ input */
const keys = { up:false, down:false, left:false, right:false };
const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
};
let anyEdge = false;
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k){ e.preventDefault(); keys[k] = true; anyEdge = true; initAudio(); }
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); anyEdge = true; initAudio(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = false; } });

document.querySelectorAll('.dbtn').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); initAudio(); keys[k] = true; anyEdge = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); anyEdge = true; });

/* ------------------------------------------------------------- maze build */
let grid = [], seen = [];
let exitC = { x: CW - 1, y: CH - 1 }, startC = { x: 0, y: 0 };
let chest = null, slimes = [], level = 1, score = 0, best = 0, lives = 3;
let swordT = 0, invul = 0, bannerT = 0, bannerText = '', flashT = 0;
let state = 'title', slimesBeaten = 0, mazesCleared = 0;

const player = { gx: 1, gy: 1, x: 0, y: 0, fx: 1, fy: 1, tx: 1, ty: 1, t: 1, moving: false, dir: 'right' };

function cellToGrid(cx, cy){ return { x: cx * 2 + 1, y: cy * 2 + 1 }; }
function open(x, y){ return x >= 0 && y >= 0 && x < GW && y < GH && grid[y][x] === 0; }

function genMaze(lvl){
  grid = Array.from({ length: GH }, () => new Array(GW).fill(1));
  seen = Array.from({ length: GH }, () => new Array(GW).fill(false));
  const vis = Array.from({ length: CH }, () => new Array(CW).fill(false));
  const stack = [{ x: 0, y: 0 }];
  vis[0][0] = true;
  grid[1][1] = 0;
  while (stack.length){
    const cur = stack[stack.length - 1];
    const opts = [];
    if (cur.y > 0      && !vis[cur.y - 1][cur.x]) opts.push([0, -1]);
    if (cur.y < CH - 1 && !vis[cur.y + 1][cur.x]) opts.push([0,  1]);
    if (cur.x > 0      && !vis[cur.y][cur.x - 1]) opts.push([-1, 0]);
    if (cur.x < CW - 1 && !vis[cur.y][cur.x + 1]) opts.push([ 1, 0]);
    if (!opts.length){ stack.pop(); continue; }
    const d = opts[Math.floor(Math.random() * opts.length)];
    const nx = cur.x + d[0], ny = cur.y + d[1];
    const a = cellToGrid(cur.x, cur.y), b = cellToGrid(nx, ny);
    grid[(a.y + b.y) / 2][(a.x + b.x) / 2] = 0;
    grid[b.y][b.x] = 0;
    vis[ny][nx] = true;
    stack.push({ x: nx, y: ny });
  }
  // knock a few walls out so it loops — dead ends everywhere make chasing unfair
  let knocked = 0, guard = 0;
  while (knocked < 10 && guard++ < 400){
    const x = 1 + Math.floor(Math.random() * (GW - 2));
    const y = 1 + Math.floor(Math.random() * (GH - 2));
    if (grid[y][x] !== 1) continue;
    if ((x % 2 === 1) === (y % 2 === 1)) continue;   // only wall segments between cells
    grid[y][x] = 0; knocked++;
  }
  void lvl;
}

function bfsFrom(gx, gy){
  const dist = Array.from({ length: GH }, () => new Array(GW).fill(-1));
  const q = [[gx, gy]];
  dist[gy][gx] = 0;
  while (q.length){
    const [x, y] = q.shift();
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => {
      const nx = x + d[0], ny = y + d[1];
      if (open(nx, ny) && dist[ny][nx] < 0){ dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); }
    });
  }
  return dist;
}

function startMaze(lvl){
  genMaze(lvl);
  const s = cellToGrid(startC.x, startC.y);
  const e = cellToGrid(exitC.x, exitC.y);
  grid[e.y][e.x] = 0;
  const dist = bfsFrom(s.x, s.y);

  // Eric: "each maze has 3 slimes" — a few more as the mazes get harder
  const count = Math.min(5, 3 + Math.floor((lvl - 1) / 3));
  const step = Math.max(0.17, 0.46 - (lvl - 1) * 0.03);      // "slimes get faster and faster"
  const spots = [];
  for (let y = 1; y < GH; y += 2) for (let x = 1; x < GW; x += 2)
    if (open(x, y) && dist[y][x] > 7) spots.push({ x, y });
  for (let i = spots.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [spots[i], spots[j]] = [spots[j], spots[i]];
  }
  slimes = [];
  for (let i = 0; i < count && i < spots.length; i++){
    const sp = spots[i];
    slimes.push({ gx: sp.x, gy: sp.y, hx: sp.x, hy: sp.y, fx: sp.x, fy: sp.y,
                  tx: sp.x, ty: sp.y, t: 1, moving: false, step,
                  kind: i % SLIMES.length, dead: false, wander: 0 });
  }
  // the chest with the sword, somewhere out in the middle of the maze
  const chestSpots = spots.filter(p => dist[p.y][p.x] > 5 && dist[p.y][p.x] < 26);
  const cp = chestSpots.length ? chestSpots[Math.floor(Math.random() * chestSpots.length)]
                               : { x: 1 + 2 * Math.floor(CW / 2), y: 1 + 2 * Math.floor(CH / 2) };
  chest = { gx: cp.x, gy: cp.y, taken: false };

  player.gx = s.x; player.gy = s.y;
  player.fx = s.x; player.fy = s.y; player.tx = s.x; player.ty = s.y;
  player.t = 1; player.moving = false; player.dir = 'right';
  swordT = 0; invul = 1.0;
  markSeen();
  banner('MAZE ' + lvl);
}

function resetGame(){
  score = 0; level = 1; lives = 3; slimesBeaten = 0; mazesCleared = 0;
  startMaze(1);
}
function banner(t){ bannerText = t; bannerT = 1.8; }

/* --------------------------------------------------------------- movement */
const PLAYER_STEP = 0.15;

function markSeen(){
  const r = Math.ceil(LANTERN / TILE);
  for (let y = player.gy - r; y <= player.gy + r; y++)
    for (let x = player.gx - r; x <= player.gx + r; x++){
      if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
      const dx = (x - player.gx) * TILE, dy = (y - player.gy) * TILE;
      if (dx * dx + dy * dy <= LANTERN * LANTERN) seen[y][x] = true;
    }
}

function stepEntity(ent, stepTime, dt){
  if (!ent.moving) return false;
  ent.t += dt / stepTime;
  if (ent.t >= 1){
    ent.t = 1; ent.moving = false;
    ent.gx = ent.tx; ent.gy = ent.ty;
    ent.fx = ent.tx; ent.fy = ent.ty;
    return true;
  }
  return false;
}
function entPix(ent){
  const gx = ent.fx + (ent.tx - ent.fx) * ent.t;
  const gy = ent.fy + (ent.ty - ent.fy) * ent.t;
  return { x: OX + gx * TILE, y: OY + gy * TILE };
}
function beginMove(ent, dx, dy){
  const nx = ent.gx + dx, ny = ent.gy + dy;
  if (!open(nx, ny)) return false;
  ent.fx = ent.gx; ent.fy = ent.gy;
  ent.tx = nx; ent.ty = ny; ent.t = 0; ent.moving = true;
  return true;
}

/* Eric's rule 1: chase only inside a 3-square radius, and not through a wall */
function lineOfSight(ax, ay, bx, by){
  const p1 = { x: OX + ax * TILE + TILE / 2, y: OY + ay * TILE + TILE / 2 };
  const p2 = { x: OX + bx * TILE + TILE / 2, y: OY + by * TILE + TILE / 2 };
  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const steps = Math.max(2, Math.ceil(dist / 3));
  for (let i = 1; i < steps; i++){
    const t = i / steps;
    const px = p1.x + (p2.x - p1.x) * t, py = p1.y + (p2.y - p1.y) * t;
    const gx = Math.floor((px - OX) / TILE), gy = Math.floor((py - OY) / TILE);
    if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return false;
    if (grid[gy][gx] === 1) return false;
  }
  return true;
}

function updateSlime(sl, dt){
  if (sl.dead) return;
  stepEntity(sl, sl.step, dt);
  if (sl.moving) return;
  const cellDist = Math.max(Math.abs(sl.gx - player.gx), Math.abs(sl.gy - player.gy)) / 2;
  const chasing = cellDist <= 3 && lineOfSight(sl.gx, sl.gy, player.gx, player.gy);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  if (chasing){
    sl.chasing = true;
    const dx = player.gx - sl.gx, dy = player.gy - sl.gy;
    dirs.sort((a, b) => {
      const da = Math.abs(sl.gx + a[0] - player.gx) + Math.abs(sl.gy + a[1] - player.gy);
      const db = Math.abs(sl.gx + b[0] - player.gx) + Math.abs(sl.gy + b[1] - player.gy);
      return da - db;
    });
    void dx; void dy;
    for (const d of dirs) if (beginMove(sl, d[0], d[1])) return;
  } else {
    sl.chasing = false;
    sl.wander -= dt;
    if (sl.wander > 0) return;
    sl.wander = 0.5 + Math.random() * 0.8;
    for (let i = dirs.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
    }
    for (const d of dirs) if (beginMove(sl, d[0], d[1])) return;
  }
}

/* --------------------------------------------------------------- gameplay */
function loseLife(){
  if (invul > 0) return;
  lives--; flashT = 0.4;
  SFX.lifeLost();
  if (lives <= 0){
    state = 'over'; best = Math.max(best, score);
    setTimeout(SFX.allLost, 320);
    return;
  }
  const s = cellToGrid(startC.x, startC.y);
  player.gx = s.x; player.gy = s.y; player.fx = s.x; player.fy = s.y;
  player.tx = s.x; player.ty = s.y; player.t = 1; player.moving = false;
  slimes.forEach(sl => {
    if (sl.dead) return;
    sl.gx = sl.hx; sl.gy = sl.hy; sl.fx = sl.hx; sl.fy = sl.hy;
    sl.tx = sl.hx; sl.ty = sl.hy; sl.t = 1; sl.moving = false;
  });
  invul = 2.0; swordT = 0;
  banner('LIFE LOST');
}

function updatePlay(dt){
  if (bannerT > 0) bannerT -= dt;
  if (invul > 0) invul -= dt;
  if (flashT > 0) flashT -= dt;
  if (swordT > 0){
    swordT -= dt;
    if (swordT <= 0){ swordT = 0; banner('SWORD GONE'); }
  }

  // joystick only, one tile at a time; walls stop you (Eric's rule 2)
  stepEntity(player, PLAYER_STEP, dt);
  if (!player.moving){
    let d = null;
    if (keys.up) d = [0, -1, 'up'];
    else if (keys.down) d = [0, 1, 'down'];
    else if (keys.left) d = [-1, 0, 'left'];
    else if (keys.right) d = [1, 0, 'right'];
    if (d){ player.dir = d[2]; beginMove(player, d[0], d[1]); }
  }
  markSeen();

  slimes.forEach(sl => updateSlime(sl, dt));

  const pp = entPix(player);

  // the chest with the sword
  if (chest && !chest.taken){
    const cp = { x: OX + chest.gx * TILE, y: OY + chest.gy * TILE };
    if (Math.hypot(cp.x - pp.x, cp.y - pp.y) < 10){
      chest.taken = true; swordT = 10;
      banner('SWORD! 10 SECONDS');
      SFX.chest();
    }
  }

  // slime contact
  for (const sl of slimes){
    if (sl.dead) continue;
    const sp = entPix(sl);
    if (Math.hypot(sp.x - pp.x, sp.y - pp.y) < 9){
      if (swordT > 0){
        sl.dead = true; score += 100; slimesBeaten++;
        banner('SLIME DEFEATED +100');
        SFX.slimeGone();
      } else {
        loseLife();
        return;
      }
    }
  }

  // the way out
  const e = cellToGrid(exitC.x, exitC.y);
  if (player.gx === e.x && player.gy === e.y){
    score += 1000; mazesCleared++;
    SFX.mazeEnd();
    level++;
    startMaze(level);
  }
}

/* ------------------------------------------------------------------ paint */
function tilePix(gx, gy){ return { x: OX + gx * TILE, y: OY + gy * TILE }; }

function drawMazeLayer(bright){
  for (let y = 0; y < GH; y++){
    for (let x = 0; x < GW; x++){
      if (!bright && !seen[y][x]) continue;
      const p = tilePix(x, y);
      if (grid[y][x] === 1){
        ctx.fillStyle = bright ? '#4a4238' : '#4a4238';
        ctx.fillRect(p.x, p.y, TILE, TILE);
        ctx.fillStyle = bright ? '#655a48' : '#655a48';
        ctx.fillRect(p.x, p.y, TILE, 2);
        ctx.fillStyle = bright ? '#2e2a22' : '#2e2a22';
        ctx.fillRect(p.x, p.y + TILE - 2, TILE, 2);
      } else {
        ctx.fillStyle = '#241f18';
        ctx.fillRect(p.x, p.y, TILE, TILE);
        ctx.fillStyle = '#2c261d';
        ctx.fillRect(p.x + 3, p.y + 4, 2, 2);
        ctx.fillRect(p.x + 8, p.y + 8, 2, 2);
      }
    }
  }
}
function drawExitMark(){
  const e = tilePix(cellToGrid(exitC.x, exitC.y).x, cellToGrid(exitC.x, exitC.y).y);
  const pulse = .7 + .3 * Math.sin(performance.now() / 300);
  ctx.fillStyle = 'rgba(255,150,40,' + (0.85 * pulse).toFixed(2) + ')';
  ctx.beginPath();
  ctx.moveTo(e.x + TILE / 2, e.y + 2);
  ctx.lineTo(e.x + TILE - 2, e.y + TILE - 2);
  ctx.lineTo(e.x + 2, e.y + TILE - 2);
  ctx.closePath(); ctx.fill();
}
function drawStartMark(){
  const s = tilePix(cellToGrid(startC.x, startC.y).x, cellToGrid(startC.x, startC.y).y);
  ctx.fillStyle = 'rgba(240,110,150,0.75)';
  ctx.beginPath();
  ctx.moveTo(s.x + TILE / 2, s.y + 3);
  ctx.lineTo(s.x + TILE - 3, s.y + TILE - 3);
  ctx.lineTo(s.x + 3, s.y + TILE - 3);
  ctx.closePath(); ctx.fill();
}
function drawEntities(){
  drawStartMark();
  drawExitMark();
  if (chest && !chest.taken){
    const p = tilePix(chest.gx, chest.gy);
    ctx.drawImage(CHEST.img, Math.round(p.x), Math.round(p.y + 2));
  }
  slimes.forEach(sl => {
    if (sl.dead) return;
    const p = entPix(sl);
    const bob = Math.sin(performance.now() / 220 + sl.gx) * 1;
    ctx.drawImage(SLIMES[sl.kind].img, Math.round(p.x + 1), Math.round(p.y + 2 + bob));
  });
  const pp = entPix(player);
  const flash = invul > 0 && Math.floor(invul * 12) % 2 === 0;
  if (!flash){
    ctx.drawImage((swordT > 0 ? HERO_ARMED : HERO).img, Math.round(pp.x + 1), Math.round(pp.y));
    if (swordT > 0){
      const sx = pp.x + (player.dir === 'left' ? -4 : 10);
      ctx.drawImage(SWORD.img, Math.round(sx), Math.round(pp.y));
    }
  }
}

function drawPlay(){
  ctx.fillStyle = '#08080c';
  ctx.fillRect(0, 0, BASE_W, BASE_H);

  // faint memory of where you've already been — the maze stays dark, not unfair
  ctx.globalAlpha = 0.17;
  drawMazeLayer(false);
  ctx.globalAlpha = 1;

  // light spilling from the way out, visible across the maze
  const e = tilePix(cellToGrid(exitC.x, exitC.y).x, cellToGrid(exitC.x, exitC.y).y);
  const eg = ctx.createRadialGradient(e.x + 6, e.y + 6, 1, e.x + 6, e.y + 6, 34);
  eg.addColorStop(0, 'rgba(255,150,40,0.42)');
  eg.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(e.x - 34, e.y - 34, 74, 74);

  // the lantern
  const pp = entPix(player);
  const cx = pp.x + 5, cy = pp.y + 6;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, LANTERN, 0, Math.PI * 2); ctx.clip();
  drawMazeLayer(true);
  drawEntities();
  ctx.restore();

  // soft edge on the lantern so it doesn't cut off like a cookie
  const lg = ctx.createRadialGradient(cx, cy, LANTERN * 0.62, cx, cy, LANTERN);
  lg.addColorStop(0, 'rgba(8,8,12,0)');
  lg.addColorStop(1, 'rgba(8,8,12,1)');
  ctx.fillStyle = lg;
  ctx.fillRect(cx - LANTERN, cy - LANTERN, LANTERN * 2, LANTERN * 2);

  // warm lantern tint
  const wg = ctx.createRadialGradient(cx, cy, 2, cx, cy, LANTERN * 0.8);
  wg.addColorStop(0, 'rgba(255,214,120,0.16)');
  wg.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(cx - LANTERN, cy - LANTERN, LANTERN * 2, LANTERN * 2);

  if (flashT > 0){
    ctx.fillStyle = 'rgba(200,40,40,' + (flashT * 0.7).toFixed(2) + ')';
    ctx.fillRect(0, HUD_H, BASE_W, BASE_H - HUD_H);
  }

  drawHUD();
  if (bannerT > 0){
    ctx.globalAlpha = Math.min(1, bannerT);
    centreText(bannerText, 224, 13, '#ffd24a', '#101018');
    ctx.globalAlpha = 1;
  }
}

function drawHeart(x, y, on){
  ctx.fillStyle = on ? '#e8544a' : '#33303a';
  ctx.fillRect(x, y + 1, 3, 4); ctx.fillRect(x + 5, y + 1, 3, 4);
  ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + 6, y, 2, 1);
  ctx.fillRect(x + 1, y + 5, 6, 1);
  ctx.fillRect(x + 2, y + 6, 4, 1);
  ctx.fillRect(x + 3, y + 7, 2, 1);
}
function drawHUD(){
  ctx.fillStyle = '#12121a'; ctx.fillRect(0, 0, BASE_W, HUD_H);
  ctx.fillStyle = '#2e2a3a'; ctx.fillRect(0, HUD_H - 2, BASE_W, 2);
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffd24a'; ctx.fillText('SCORE ' + String(score).padStart(6, '0'), 5, 4);
  ctx.fillStyle = '#7fd8e8'; ctx.fillText('MAZE ' + level, 5, 15);

  ctx.fillStyle = '#dfdce8'; ctx.fillText('LIVES', 100, 4);
  for (let i = 0; i < 3; i++) drawHeart(100 + i * 11, 15, i < lives);

  ctx.fillStyle = '#dfdce8'; ctx.fillText('SLIMES', 160, 4);
  const alive = slimes.filter(s => !s.dead).length;
  ctx.fillStyle = '#4fc85a'; ctx.fillText(alive + ' LEFT', 160, 15);

  if (swordT > 0){
    ctx.fillStyle = '#ffd24a'; ctx.fillText('SWORD', 232, 4);
    ctx.fillStyle = '#33303a'; ctx.fillRect(232, 16, 60, 6);
    ctx.fillStyle = '#ffd24a'; ctx.fillRect(232, 16, Math.round(60 * (swordT / 10)), 6);
  } else {
    ctx.fillStyle = '#6a667a'; ctx.fillText('FIND THE', 232, 4);
    ctx.fillText('CHEST', 232, 15);
  }
}

function centreText(text, y, size, fill, outline){
  ctx.font = 'bold ' + size + 'px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (outline){ ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.strokeText(text, BASE_W / 2, y); }
  ctx.fillStyle = fill; ctx.fillText(text, BASE_W / 2, y);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

function drawTitle(){
  ctx.fillStyle = '#08080c'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  // scratchy dark walls, like Eric's banner
  ctx.fillStyle = '#1a1712';
  for (let i = 0; i < 90; i++){
    const x = (i * 71) % BASE_W, y = (i * 53) % BASE_H;
    ctx.fillRect(x, y, 3 + (i % 5), 10 + (i % 17));
  }
  const cx = 214, cy = 152;
  const g = ctx.createRadialGradient(cx, cy, 3, cx, cy, 44);
  g.addColorStop(0, 'rgba(255,214,90,0.95)');
  g.addColorStop(0.65, 'rgba(255,190,60,0.5)');
  g.addColorStop(1, 'rgba(255,190,60,0)');
  ctx.fillStyle = g; ctx.fillRect(cx - 44, cy - 44, 88, 88);
  ctx.drawImage(HERO.img, Math.round(cx - 5), Math.round(cy - 6));
  ctx.drawImage(SLIMES[0].img, 96, 150);
  ctx.drawImage(SLIMES[2].img, 68, 168);

  centreText('MAZE', 52, 30, '#5aa8e8', '#08121e');
  centreText('CHASE', 84, 30, '#5ac86a', '#08200e');
  centreText("It's dark. You've got a lantern.", 108, 10, '#ffe0a0', '#101018');
  centreText('Game design by Eric', 124, 12, '#ffd24a', '#101018');
  centreText('Pixel Quest — Hilton Primary School', 138, 9, '#bfc4d8', '#101018');

  const pulse = .6 + .4 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = pulse;
  centreText('PUSH THE JOYSTICK TO START', 204, 12, '#5ac86a', '#101018');
  ctx.globalAlpha = 1;
  centreText('Joystick only — both buttons are not used', 222, 9, '#8a90a8', '#101018');
}

function drawOver(){
  ctx.fillStyle = '#08080c'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#16130f';
  for (let i = 0; i < 70; i++){
    const x = (i * 91) % BASE_W, y = (i * 37) % BASE_H;
    ctx.fillRect(x, y, 3 + (i % 4), 12 + (i % 15));
  }
  centreText('GAME OVER', 56, 30, '#e8544a', '#2a0c0c');
  ctx.drawImage(SLIMES[1].img, 138, 88);
  ctx.drawImage(SLIMES[2].img, 164, 92);
  centreText('The slimes got you in the dark', 118, 11, '#ffb0a0', '#101018');
  centreText('SCORE ' + score, 142, 18, '#ffd24a', '#101018');
  centreText('MAZES CLEARED ' + mazesCleared + '   •   SLIMES DEFEATED ' + slimesBeaten, 162, 10, '#7fd8e8', '#101018');
  centreText('BEST ' + best, 178, 10, '#bfc4d8', '#101018');
  const pulse = .6 + .4 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = pulse;
  centreText('PUSH THE JOYSTICK TO GO AGAIN', 210, 11, '#5ac86a', '#101018');
  ctx.globalAlpha = 1;
}

/* -------------------------------------------------------------- main loop */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;

function update(dt){
  if (state === 'play') updatePlay(dt);
  else {
    const go = anyEdge || keys.up || keys.down || keys.left || keys.right;
    anyEdge = false;
    if (go){ initAudio(); SFX.start(); resetGame(); state = 'play'; }
  }
  anyEdge = false;
}
function render(){
  ctx.save();
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'play') drawPlay();
  else if (state === 'over') drawOver();
  ctx.restore();
}
function frame(now){
  let delta = (now - last) / 1000; last = now;
  if (delta > 0.25) delta = 0.25;
  acc += delta;
  let steps = 0;
  while (acc >= STEP && steps < 5){ update(STEP); acc -= STEP; steps++; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
