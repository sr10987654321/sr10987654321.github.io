<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Catch the Cat!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#16141d;
    font-family:"Courier New",Courier,monospace;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 3px #ff5fa8,0 0 40px rgba(0,0,0,.8);}
  #ctrls{position:fixed;inset:0;pointer-events:none;}
  .btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:bold;font-family:inherit;border:3px solid rgba(255,255,255,.5);
    background:rgba(45,35,55,.45);border-radius:16px;user-select:none;-webkit-user-select:none;}
  .btn:active,.btn.on{background:rgba(255,210,63,.7);border-color:#ffd23f;color:#2a2010;}
  #bU{left:calc(3vw + 13vh);bottom:17vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bD{left:calc(3vw + 13vh);bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bL{left:3vw;bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bR{left:calc(3vw + 26vh);bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bA{right:3vw;bottom:5vh;width:17vh;height:17vh;border-radius:50%;font-size:3vh;
      background:rgba(120,200,140,.45);border-color:#8fe0a0;}
  #bB{right:calc(3vw + 19vh);bottom:5vh;width:17vh;height:17vh;border-radius:50%;font-size:2.7vh;
      background:rgba(255,95,168,.45);border-color:#ff9ac8;line-height:1.1;text-align:center;}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#16141d;color:#ffd23f;font-size:20px;text-align:center;padding:30px;z-index:9;}
  @media (orientation:portrait){#rot{display:flex}#wrap,#ctrls{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctrls">
  <div class="btn" id="bU">&#9650;</div>
  <div class="btn" id="bL">&#9664;</div>
  <div class="btn" id="bD">&#9660;</div>
  <div class="btn" id="bR">&#9654;</div>
  <div class="btn" id="bB">THROW<br>NET</div>
  <div class="btn" id="bA">JUMP</div>
</div>
<div id="rot">Turn your iPad sideways<br>to play</div>
<script>
"use strict";
/* ============================================================
   CATCH THE CAT!  - you crazy cat
   You must catch the cat before the ranger does.
   Built from a Year 4-6 student arcade game design document.
   ============================================================ */

const W = 480, H = 300, SC = 3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W*SC; cv.height = H*SC;
ctx.setTransform(SC,0,0,SC,0,0);
ctx.imageSmoothingEnabled = false;

function resize(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,250));
resize();

const HUD_H = 34;

/* ---------- palette ---------- */
const C = {
  bg1:'#241f30', bg2:'#1a1724', wall:'#2e2840',
  plat:'#ff5fa8', platDark:'#c9367f', platLite:'#ff8fc4',
  mc:'#ff9ac8', mcDark:'#d1568f', mcSkin:'#f7d9b8', mcHair:'#8a4a2a',
  ranger:'#4caf50', rangerDark:'#2f7a34', rangerSkin:'#f0c9a0',
  cat:'#f0913a', catDark:'#c96a1a', catPale:'#ffd0a0',
  coin:'#ffd23f', coinDark:'#c9a010',
  fish:'#8fd44a', fishDark:'#5f9a2a',
  net:'#e8e4d8', netDark:'#8a867a',
  portal:'#9a6ae0', portalLite:'#c9a8ff',
  gold:'#ffd23f', paper:'#fff4e8', hot:'#ff4d6a', ink:'#1a1620'
};

/* ---------- audio ---------- */
let AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(f,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f;
    const t=AC.currentTime;
    g.gain.setValueAtTime(vol===undefined?0.06:vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function slide(f1,f2,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sawtooth';
    const t=AC.currentTime;
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    g.gain.setValueAtTime(vol===undefined?0.07:vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function coinSound(){ tone(988,0.05,'square',0.045); setTimeout(()=>tone(1319,0.07,'square',0.045),45); }
function fishSound(){ [659,784,988].forEach((f,i)=>setTimeout(()=>tone(f,0.08,'square',0.05), i*50)); }
function throwSound(){ slide(300,620,0.16,'square',0.05); }
function missSound(){ slide(500,180,0.3,'square',0.06); }
function catchSound(){ [523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'square',0.07), i*85)); }
function nettedSound(){ slide(620,120,0.5,'sawtooth',0.08); }
function meowSound(){ slide(760,520,0.18,'triangle',0.05); setTimeout(()=>slide(560,700,0.16,'triangle',0.045),150); }

/* ---------- input ---------- */
const keys={l:false,r:false,u:false,d:false};
let jumpEdge=false, netEdge=false, anyPress=false;
const KEYMAP={ArrowLeft:'l',KeyA:'l', ArrowRight:'r',KeyD:'r', ArrowUp:'u',KeyW:'u', ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  initAudio(); anyPress=true;
  if(e.code==='Space'||e.code==='KeyZ'){ e.preventDefault(); jumpEdge=true; return; }
  if(e.code==='KeyX'||e.code==='Enter'||e.code==='ShiftLeft'){ e.preventDefault(); netEdge=true; return; }
  const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys[k]=true; }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys[k]=false; }});
function bindBtn(id,key){
  const el=document.getElementById(id);
  const on=e=>{
    e.preventDefault(); initAudio(); anyPress=true;
    if(key==='a') jumpEdge=true; else if(key==='b') netEdge=true; else keys[key]=true;
    el.classList.add('on');
  };
  const off=e=>{ e.preventDefault(); if(key!=='a'&&key!=='b') keys[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on); addEventListener('mouseup',off);
}
bindBtn('bU','u'); bindBtn('bD','d'); bindBtn('bL','l'); bindBtn('bR','r');
bindBtn('bA','a'); bindBtn('bB','b');
cv.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); anyPress=true; },{passive:false});
cv.addEventListener('mousedown',()=>{ initAudio(); anyPress=true; });

/* ---------- constants ---------- */
const GRAV=0.24, JUMP=-5.45, MAXFALL=6.2, SPEED=1.85;
const PW=15, PH=20, CW=16, CH=13;
const CRUMBLE_FRAMES = 180;        /* "3's before the platform disappears" */
const BASE_CHANCE = 0.25;          /* a bare net */
const FISH_BONUS  = 0.25;          /* "increases your chance by 25%" */

/* ---------- levels ---------- */
/* tiers 284 / 236 / 188 / 140 / 92 - each exactly one jump apart */
const LEVELS = [
  { name:'LEVEL 1', hint:'GRAB FISH FIRST - THEY MAKE THE NET WORK',
    rangerTime:105,
    plats:[ {x:0,y:284,w:480},
            {x:40,y:236,w:110},{x:210,y:236,w:90,crumble:1},{x:350,y:236,w:110},
            {x:110,y:188,w:90,crumble:1},{x:260,y:188,w:120},{x:400,y:188,w:70,move:40},
            {x:30,y:140,w:100},{x:190,y:140,w:100,crumble:1},{x:340,y:140,w:110},
            {x:90,y:92,w:110},{x:250,y:92,w:120} ],
    portalOn:10, catOn:5, fishOn:[1,5,9], coinsOn:[0,1,2,3,4,5,7,8,9,11] },

  { name:'LEVEL 2', hint:'THE PORTAL IS HOME. GET THERE WITH THE CAT',
    rangerTime:100,
    plats:[ {x:0,y:284,w:480},
            {x:30,y:236,w:90},{x:160,y:236,w:80,crumble:1},{x:290,y:236,w:90},{x:410,y:236,w:70},
            {x:90,y:188,w:90},{x:230,y:188,w:80,crumble:1},{x:360,y:188,w:90,move:40},
            {x:30,y:140,w:90},{x:170,y:140,w:90,crumble:1},{x:320,y:140,w:100},
            {x:110,y:92,w:100},{x:270,y:92,w:110} ],
    portalOn:12, catOn:6, fishOn:[3,8,10], coinsOn:[0,1,2,4,5,6,7,9,10,11] },

  { name:'LEVEL 3', hint:'MORE CRUMBLING PLATFORMS. KEEP MOVING',
    rangerTime:95,
    plats:[ {x:0,y:284,w:480},
            {x:20,y:236,w:80},{x:140,y:236,w:80,crumble:1},{x:270,y:236,w:80,crumble:1},{x:390,y:236,w:80},
            {x:80,y:188,w:80,move:44},{x:210,y:188,w:80},{x:340,y:188,w:90,crumble:1},
            {x:30,y:140,w:80},{x:160,y:140,w:90,crumble:1},{x:300,y:140,w:90},
            {x:100,y:92,w:100},{x:260,y:92,w:100},{x:400,y:92,w:70} ],
    portalOn:13, catOn:9, fishOn:[4,6,11], coinsOn:[0,1,2,3,5,6,7,8,10,12] },

  { name:'LEVEL 4', hint:'LAST ONE. THE RANGER IS FAST NOW',
    rangerTime:90,
    plats:[ {x:0,y:284,w:480},
            {x:20,y:236,w:80,crumble:1},{x:140,y:236,w:80},{x:260,y:236,w:80,crumble:1},{x:380,y:236,w:90},
            {x:70,y:188,w:80,crumble:1},{x:200,y:188,w:80,move:44},{x:330,y:188,w:80},
            {x:20,y:140,w:80},{x:150,y:140,w:80,crumble:1},{x:280,y:140,w:80},{x:400,y:140,w:70},
            {x:80,y:92,w:100},{x:240,y:92,w:100},{x:390,y:92,w:80} ],
    portalOn:12, catOn:10, fishOn:[4,7,13], coinsOn:[0,1,2,3,5,6,8,9,10,11,14] }
];

/* ---------- state ---------- */
let state='title', timer=0, frame=0, level=0, score=0, best=0;
let plats=[], coins=[], fishes=[], nets=[], rangerNets=[], pops=[], sparks=[];
let mc=null, cat=null, ranger=null, portal=null;
let fishHeld=0, netsLeft=3, rangerMeter=0, rangerMax=0, phase='hunt', hintT=0, shake=0;
let startPt={x:20,y:264};

function rectsHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function pop(x,y,s,col){ pops.push({x:x,y:y,s:s,c:col||C.gold,t:75}); }
function puff(x,y,col,n){
  for(let i=0;i<(n||10);i++)
    sparks.push({x:x,y:y,vx:(Math.random()*2-1)*1.8,vy:-Math.random()*2.2,t:26,c:col});
}
function catchChance(){ return Math.min(0.95, BASE_CHANCE + FISH_BONUS*fishHeld); }

function loadLevel(n){
  const L = LEVELS[n];
  plats = L.plats.map(p => ({ x:p.x, y:p.y, w:p.w, h:10,
      crumble:!!p.crumble, timer:0, gone:0,
      move:p.move||0, mx:p.x, dir:1 }));

  coins = [];
  for(const i of L.coinsOn){
    const p = plats[i];
    const n2 = p.w > 100 ? 3 : 2;
    for(let k=0;k<n2;k++)
      coins.push({ x: p.x + 14 + k*(p.w-28)/Math.max(1,n2-1) - 4, y: p.y-16, taken:false });
  }
  fishes = L.fishOn.map(i => {
    const p = plats[i];
    return { x: p.x + p.w/2 - 6, y: p.y-17, taken:false, resp:0 };
  });

  const pp = plats[L.portalOn];
  portal = { x: pp.x + pp.w/2 - 13, y: pp.y - 30, w:26, h:30 };

  const cp = plats[L.catOn];
  cat = { x:cp.x+cp.w/2, y:cp.y-CH, w:CW, h:CH, vx:0, vy:0, dir:-1,
          onGround:true, caught:false, panic:0, anim:0 };

  ranger = { x:240, y:52, w:18, h:24, dir:1, cd:120, chasing:false, anim:0 };

  startPt = { x:16, y:284-PH };
  mc = { x:startPt.x, y:startPt.y, w:PW, h:PH, vx:0, vy:0, dir:1,
         onGround:true, anim:0, grace:70, carrying:false };

  nets=[]; rangerNets=[]; pops=[]; sparks=[];
  fishHeld=0; netsLeft=3; phase='hunt';
  rangerMeter=0; rangerMax=L.rangerTime*60;
  hintT=300;
}
function startGame(){ level=0; score=0; loadLevel(0); state='play'; timer=0; }

function backToStart(reason){
  mc.x=startPt.x; mc.y=startPt.y; mc.vx=0; mc.vy=0; mc.grace=90;
  if(fishHeld>0){ pop(mc.x, mc.y-16, 'DROPPED '+fishHeld+' FISH', C.fish); fishHeld=0; }
  rangerMeter = Math.min(rangerMax, rangerMeter + 8*60);   /* the ranger gains ground */
  shake=16; nettedSound();
  if(mc.carrying){
    mc.carrying=false;
    const cp = plats[LEVELS[level].catOn];
    cat.caught=false; cat.x=cp.x+cp.w/2; cat.y=cp.y-CH; cat.vx=0; cat.vy=0;
    phase='hunt'; ranger.chasing=false; ranger.y=52;
    pop(mc.x, mc.y-28, 'THE CAT GOT AWAY!', C.hot);
  }
}

/* ---------- update ---------- */
function update(){
  frame++;
  if(shake>0) shake--;
  if(hintT>0) hintT--;

  if(state==='title'){ if(anyPress){ anyPress=false; state='howto'; timer=0; tone(700,0.09);} return; }
  if(state==='howto'){ timer++; if(anyPress&&timer>20){ anyPress=false; startGame(); tone(950,0.1);} return; }
  if(state==='lost'||state==='won'){ timer++; if(anyPress&&timer>80){ anyPress=false; state='title'; timer=0; } return; }
  if(state==='clear'){
    timer++; updateFx();
    if(timer>150){
      level++;
      if(level>=LEVELS.length){ best=Math.max(best,score); state='won'; timer=0; catchSound(); }
      else { loadLevel(level); state='play'; timer=0; }
    }
    return;
  }

  /* ---------- PLAY ---------- */
  anyPress=false;
  if(mc.grace>0) mc.grace--;

  /* the ranger is closing in on the cat the whole time */
  rangerMeter++;
  if(rangerMeter >= rangerMax){ best=Math.max(best,score); state='lost'; timer=0; slide(400,90,0.8,'sawtooth',0.09); return; }

  /* ----- moving platforms: "left to right, only one square" ----- */
  for(const p of plats){
    if(p.move){
      p.x += p.dir*0.55;
      if(p.x > p.mx + p.move){ p.x = p.mx + p.move; p.dir=-1; }
      if(p.x < p.mx){ p.x = p.mx; p.dir=1; }
    }
    if(p.gone>0){ p.gone--; if(p.gone===0){ p.timer=0; } }
    else if(p.crumble && p.timer>0){
      p.timer--;
      if(p.timer===0){ p.gone=240; puff(p.x+p.w/2,p.y,C.plat,10); tone(200,0.12,'square',0.05); }
    }
  }
  const solid = p => !(p.crumble && p.gone>0);

  /* ----- the crazy cat lady ----- */
  const m = mc;
  m.vx = 0;
  if(keys.l && !keys.r){ m.vx=-SPEED; m.dir=-1; }
  if(keys.r && !keys.l){ m.vx= SPEED; m.dir= 1; }
  m.anim = (m.vx!==0 && m.onGround) ? m.anim+0.22 : 0;
  if(jumpEdge){ jumpEdge=false; if(m.onGround){ m.vy=JUMP; m.onGround=false; tone(460,0.08,'square',0.045); } }

  m.vy = Math.min(m.vy+GRAV, MAXFALL);
  m.x += m.vx;
  m.x = Math.max(2, Math.min(W-2-m.w, m.x));
  const prevBottom = m.y + m.h;
  m.y += m.vy;
  m.onGround=false;
  if(m.y < HUD_H){ m.y = HUD_H; m.vy = 0.4; }
  if(m.vy >= 0){
    for(const p of plats){
      if(!solid(p)) continue;
      if(m.x+m.w > p.x+1 && m.x < p.x+p.w-1 && prevBottom <= p.y+2 && m.y+m.h >= p.y){
        m.y = p.y-m.h; m.vy=0; m.onGround=true;
        if(p.move) m.x += p.dir*0.55;
        if(p.crumble && p.timer===0 && p.gone===0){ p.timer=CRUMBLE_FRAMES; tone(300,0.05,'square',0.04); }
      }
    }
  }
  if(m.y > H+10) backToStart('fell');

  /* ----- pickups ----- */
  for(const c of coins){
    if(c.taken) continue;
    if(Math.abs((c.x+4)-(m.x+m.w/2))<13 && Math.abs((c.y+5)-(m.y+m.h/2))<16){
      c.taken=true; score+=5; coinSound(); pop(c.x,c.y-6,'+5',C.coin);
    }
  }
  for(const f of fishes){
    if(f.taken){
      f.resp--;
      if(f.resp<=0){ f.taken=false; puff(f.x+6,f.y+5,C.fish,6); }
      continue;
    }
    if(Math.abs((f.x+6)-(m.x+m.w/2))<15 && Math.abs((f.y+5)-(m.y+m.h/2))<17){
      f.taken=true; f.resp=780; score+=10; fishHeld++; fishSound();
      pop(f.x,f.y-6,'FISH! +10',C.fish);
    }
  }

  /* ----- throw the net (B) ----- */
  if(netEdge){
    netEdge=false;
    if(phase==='hunt' && netsLeft>0 && nets.length===0){
      netsLeft--;
      const aim = keys.u ? -1 : (keys.d ? 1 : 0);
      nets.push({ x:m.x+m.w/2, y:m.y+6, vx:m.dir*3.5,
                  vy: aim<0 ? -3.4 : (aim>0 ? 0.6 : -1.3),
                  w:14, h:12, st:'fly', t:0, chance:catchChance(), fish:fishHeld });
      fishHeld = 0;                       /* the fish go with the throw, as bait */
      throwSound();
    } else if(phase==='hunt' && netsLeft<=0){
      tone(180,0.07,'square',0.04);
    }
  }

  for(const nt of nets){
    if(nt.st==='fly'){
      nt.vy = Math.min(nt.vy+0.17, 5);
      nt.x += nt.vx; nt.y += nt.vy;
      if(nt.x<0 || nt.x>W-nt.w){ nt.vx*=-0.4; nt.x=Math.max(0,Math.min(W-nt.w,nt.x)); }
      /* did it land on the cat? */
      if(!cat.caught && rectsHit(nt, cat)){
        nt.st='done'; nt.dead=true;
        if(Math.random() < nt.chance){
          cat.caught=true; mc.carrying=true; phase='home';
          ranger.chasing=true;
          score += 500;
          catchSound(); puff(cat.x,cat.y,C.cat,18);
          pop(cat.x, cat.y-20, 'GOT THE CAT!', C.gold);
        } else {
          /* it wriggled out and took the net with it */
          missSound(); meowSound();
          cat.panic=140; cat.vy=-5.2; cat.vx=(cat.x<m.x?-1:1)*2.4; cat.onGround=false;
          pop(cat.x, cat.y-20, 'IT GOT AWAY!', C.hot);
        }
        continue;
      }
      /* landed on something - you can pick it back up */
      let landed = nt.y+nt.h >= H-4;
      for(const p of plats){
        if(!solid(p)) continue;
        if(nt.vy>0 && nt.x+nt.w>p.x && nt.x<p.x+p.w && nt.y+nt.h>=p.y && nt.y+nt.h<=p.y+14){
          nt.y = p.y-nt.h; landed=true;
        }
      }
      if(landed){ nt.st='ground'; nt.t=0; nt.vy=0; nt.vx=0; }
    } else if(nt.st==='ground'){
      nt.t++;
      if(rectsHit(nt,m) || nt.t>150){
        nt.dead=true; netsLeft++;
        pop(nt.x, nt.y-10, 'NET BACK', C.net); tone(880,0.06,'square',0.04);
      }
    }
  }
  nets = nets.filter(n=>!n.dead);

  /* ----- the cat runs through the game ----- */
  if(!cat.caught){
    const c2 = cat;
    if(c2.panic>0) c2.panic--;
    c2.anim += 0.18;
    const dx = (m.x+m.w/2) - (c2.x+c2.w/2);
    const near = Math.abs(dx) < 105 && Math.abs((m.y+m.h)-(c2.y+c2.h)) < 34;
    const spd = (near || c2.panic>0) ? 1.95 : 0.75;
    if(c2.onGround){
      if(near || c2.panic>0) c2.dir = dx>0 ? -1 : 1;
      c2.vx = c2.dir*spd;
    }
    c2.vy = Math.min(c2.vy+GRAV, MAXFALL);
    c2.x += c2.vx;
    if(c2.x<2){ c2.x=2; c2.dir=1; }
    if(c2.x>W-2-c2.w){ c2.x=W-2-c2.w; c2.dir=-1; }
    const cPrev = c2.y + c2.h;
    c2.y += c2.vy;
    let wasGround = c2.onGround;
    c2.onGround=false;
    if(c2.vy>=0){
      for(const p of plats){
        if(!solid(p)) continue;
        if(c2.x+c2.w > p.x+1 && c2.x < p.x+p.w-1 && cPrev <= p.y+2 && c2.y+c2.h >= p.y){
          c2.y = p.y-c2.h; c2.vy=0; c2.onGround=true; c2.plat=p;
        }
      }
    }
    if(c2.onGround && c2.plat){
      const p = c2.plat;
      const atEdge = (c2.x < p.x+2 && c2.dir<0) || (c2.x+c2.w > p.x+p.w-2 && c2.dir>0);
      if(atEdge){
        if(near || c2.panic>0){ c2.vy=-5.3; c2.vx=c2.dir*2.3; c2.onGround=false; if(wasGround) meowSound(); }
        else c2.dir *= -1;
      }
    }
    if(c2.y > H+20){ const cp=plats[LEVELS[level].catOn]; c2.x=cp.x+cp.w/2; c2.y=cp.y-CH; c2.vy=0; }
  } else {
    cat.x = mc.x + (mc.dir>0?-6:9); cat.y = mc.y - 10;
  }

  /* ----- the ranger ----- */
  const r = ranger;
  r.anim += 0.1;
  if(phase==='home' && r.chasing){
    /* he comes down after you the moment you have the cat */
    const tx = m.x+m.w/2, ty = m.y+m.h/2;
    const dx = tx-(r.x+r.w/2), dy = ty-(r.y+r.h/2);
    const d = Math.hypot(dx,dy)||1;
    const sp = 1.55 + level*0.12;
    r.x += dx/d*sp; r.y += dy/d*sp;
    r.dir = dx>0?1:-1;
    if(mc.grace<=0 && rectsHit(r,m)){ backToStart('caught'); }
  } else {
    const tx = m.x+m.w/2;
    r.x += Math.max(-0.9, Math.min(0.9, (tx-(r.x+r.w/2))*0.02));
    r.x = Math.max(4, Math.min(W-4-r.w, r.x));
    r.y += ((52)-r.y)*0.08;
    r.dir = (tx > r.x+r.w/2) ? 1 : -1;
    r.cd--;
    if(r.cd<=0){
      r.cd = Math.max(70, 165 - level*22);
      rangerNets.push({ x:r.x+r.w/2-7, y:r.y+r.h, vx:(tx-(r.x+r.w/2))*0.012, vy:0.6, w:14, h:13 });
      tone(260,0.08,'square',0.04);
    }
  }

  for(const rn of rangerNets){
    rn.vy = Math.min(rn.vy+0.13, 3.4);
    rn.x += rn.vx; rn.y += rn.vy;
    if(rn.y > H+14) rn.dead=true;
    if(!rn.dead && mc.grace<=0 && rectsHit(rn,m)){ rn.dead=true; backToStart('netted'); }
  }
  rangerNets = rangerNets.filter(n=>!n.dead);

  /* ----- home ----- */
  if(phase==='home' && mc.carrying && rectsHit(mc, portal)){
    const timeLeft = Math.max(0, rangerMax-rangerMeter);
    const bonus = Math.round(timeLeft/60)*10;
    score += 1000 + bonus;
    pop(portal.x+13, portal.y-10, 'HOME! +'+(1000+bonus), C.gold);
    state='clear'; timer=0; catchSound();
    return;
  }

  /* out of nets and the cat is still loose */
  if(phase==='hunt' && netsLeft<=0 && nets.length===0){
    best=Math.max(best,score); state='lost'; timer=0; slide(400,90,0.8,'sawtooth',0.09);
    return;
  }

  updateFx();
}
function updateFx(){
  for(const p of pops){ p.y-=0.35; p.t--; }
  pops = pops.filter(p=>p.t>0);
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.13; s.t--; }
  sparks = sparks.filter(s=>s.t>0);
}

/* ============================================================
   DRAWING
   ============================================================ */
function px(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w|0,h|0); }
function txt(s,x,y,size,col,align){
  ctx.fillStyle=col; ctx.font='bold '+size+'px "Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y);
}
function txtS(s,x,y,size,col,align){
  txt(s,x+1,y+1,size,'rgba(10,8,15,.6)',align); txt(s,x,y,size,col,align);
}

function drawBg(){
  const g=ctx.createLinearGradient(0,HUD_H,0,H);
  g.addColorStop(0,C.bg1); g.addColorStop(1,C.bg2);
  ctx.fillStyle=g; ctx.fillRect(0,HUD_H,W,H-HUD_H);
  ctx.globalAlpha=0.13;
  for(let y=HUD_H;y<H;y+=16)
    for(let x=((y/16)%2)*18;x<W;x+=36) px(x,y,34,14,C.wall);
  ctx.globalAlpha=1;
}

function drawPlat(p){
  if(p.crumble && p.gone>0){
    ctx.globalAlpha=0.16;
    px(p.x,p.y,p.w,p.h,C.plat);
    ctx.globalAlpha=1;
    return;
  }
  const shaking = p.crumble && p.timer>0 && p.timer<70;
  const ox = shaking ? (Math.random()*2-1)*1.5 : 0;
  px(p.x+ox,p.y,p.w,p.h,C.plat);
  px(p.x+ox,p.y,p.w,2,C.platLite);
  px(p.x+ox,p.y+p.h-2,p.w,2,C.platDark);
  if(p.crumble){
    /* the X she drew on every crumbling platform */
    ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.globalAlpha=0.75;
    for(let i=0;i<Math.max(1,Math.floor(p.w/34));i++){
      const bx=p.x+ox+8+i*34;
      ctx.beginPath();
      ctx.moveTo(bx,p.y+2); ctx.lineTo(bx+16,p.y+p.h-2);
      ctx.moveTo(bx+16,p.y+2); ctx.lineTo(bx,p.y+p.h-2);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    if(p.timer>0){
      const f=p.timer/CRUMBLE_FRAMES;
      px(p.x+ox,p.y-4,p.w*f,2, f>0.4?C.gold:C.hot);
    }
  }
  if(p.move){
    px(p.x+ox+2,p.y+3,4,4,C.platDark); px(p.x+ox+p.w-6,p.y+3,4,4,C.platDark);
  }
}

function drawCoin(c){
  const b=Math.sin(frame*0.1+c.x*0.05)*1.5;
  px(c.x,c.y+b,8,9,C.coin);
  px(c.x+1,c.y+1+b,6,7,C.coinDark);
  px(c.x+2,c.y+2+b,4,5,C.coin);
  px(c.x+3,c.y+3+b,1,3,C.coinDark);
}
function drawFish(f){
  const b=Math.sin(frame*0.09+f.x*0.04)*1.6;
  px(f.x,f.y+2+b,9,6,C.fish);
  px(f.x+1,f.y+3+b,7,4,'#b0e86a');
  px(f.x+8,f.y+b,5,10,C.fish);          /* tail */
  px(f.x+2,f.y+3+b,2,2,C.ink);          /* eye */
  px(f.x,f.y+2+b,9,1,C.fishDark);
}

function drawNetSprite(x,y,w,h,col){
  ctx.strokeStyle=col||C.net; ctx.lineWidth=1;
  px(x,y,w,1,col||C.net); px(x,y+h-1,w,1,col||C.net);
  px(x,y,1,h,col||C.net); px(x+w-1,y,1,h,col||C.net);
  ctx.globalAlpha=0.8;
  ctx.beginPath();
  for(let i=3;i<w;i+=4){ ctx.moveTo(x+i,y); ctx.lineTo(x+i,y+h); }
  for(let j=3;j<h;j+=4){ ctx.moveTo(x,y+j); ctx.lineTo(x+w,y+j); }
  ctx.stroke(); ctx.globalAlpha=1;
}

function drawMC(m){
  ctx.save(); ctx.translate((m.x+m.w/2)|0, m.y|0);
  if(m.dir<0) ctx.scale(-1,1);
  const step = m.anim ? Math.floor(m.anim)%2 : 0;
  px(-6,7,12,9,C.mc);                  /* dress */
  px(-7,10,14,6,C.mc);
  px(-6,7,12,2,'#ffc4dd');
  px(-5+step,16,4,4,C.mcDark);         /* legs */
  px(1-step,16,4,4,C.mcDark);
  px(-5,0,10,8,C.mcSkin);              /* head */
  px(-6,-2,12,4,C.mcHair);
  px(-6,0,3,6,C.mcHair); px(3,0,3,6,C.mcHair);
  px(-3,3,2,2,C.ink); px(1,3,2,2,C.ink);
  px(-1,6,3,1,'#c96a7a');
  px(6,7,3,5,C.mcSkin);                /* arm holding the net */
  px(8,2,2,7,C.netDark);               /* handle */
  drawNetSprite(6,-4,9,7,C.net);
  ctx.restore();
  if(m.grace>0 && frame%8<4){ ctx.globalAlpha=0.3; px(m.x-3,m.y-6,m.w+6,m.h+8,'#ffffff'); ctx.globalAlpha=1; }
}

function drawCat(c){
  ctx.save(); ctx.translate((c.x+c.w/2)|0, c.y|0);
  if(c.dir<0) ctx.scale(-1,1);
  const run = c.onGround ? Math.floor(c.anim)%2 : 0;
  px(-7,3,13,7,C.cat);                 /* body */
  px(-7,3,13,2,C.catPale);
  px(-9,0,5,6,C.cat);                  /* tail up */
  px(-10,-3,3,5,C.cat);
  px(3,-2,8,7,C.cat);                  /* head */
  px(3,-5,3,4,C.catDark); px(8,-5,3,4,C.catDark);   /* ears */
  px(5,0,2,2,C.ink); px(9,0,2,2,C.ink);
  px(7,2,2,1,'#d1568f');
  px(-5+run,10,3,3,C.catDark);         /* legs */
  px(2-run,10,3,3,C.catDark);
  ctx.restore();
  if(c.panic>0 && frame%8<5) txtS('!', c.x+c.w/2, c.y-12, 11, C.hot, 'center');
}

function drawRanger(r){
  ctx.save(); ctx.translate((r.x+r.w/2)|0, r.y|0);
  if(r.dir<0) ctx.scale(-1,1);
  px(-7,8,14,11,C.ranger);             /* shirt */
  px(-7,8,14,2,'#6fd06f');
  px(-7,15,14,2,C.rangerDark);
  px(-6,19,5,5,C.rangerDark); px(1,19,5,5,C.rangerDark);
  px(-5,0,10,8,C.rangerSkin);          /* head */
  px(-7,-2,14,3,C.rangerDark);         /* ranger hat */
  px(-5,-5,10,3,C.rangerDark);
  px(-3,3,2,2,C.ink); px(1,3,2,2,C.ink);
  px(7,8,3,6,C.rangerSkin);
  px(9,2,2,8,C.netDark);
  drawNetSprite(7,-4,9,7,C.net);
  ctx.restore();
}

function drawPortal(){
  const active = phase==='home';
  const w=portal.w, h=portal.h, x=portal.x, y=portal.y;
  ctx.globalAlpha = active ? 0.35+0.25*Math.sin(frame*0.13) : 0.14;
  px(x-5,y-5,w+10,h+10,C.portal);
  ctx.globalAlpha=1;
  px(x,y,w,h,active?C.portal:'#3a3050');
  px(x+3,y+3,w-6,h-6,active?'#2a1a4a':'#241f34');
  for(let i=0;i<4;i++){
    const a = frame*0.06 + i*Math.PI/2;
    const rx = x+w/2 + Math.cos(a)*7, ry = y+h/2 + Math.sin(a)*10;
    px(rx-1,ry-1,3,3, active?C.portalLite:'#4a4060');
  }
  px(x,y,w,3,active?C.portalLite:'#4a4060');
  txtS(active?'HOME':'LOCKED', x+w/2, y-11, 8, active?C.portalLite:'#6a6080', 'center');
}

function drawHUD(){
  px(0,0,W,HUD_H,'#1f1a2c');
  px(0,HUD_H-2,W,2,C.plat);
  txtS('SCORE '+String(score).padStart(5,'0'), 8, 11, 12, C.gold);

  /* fish held, and what they do to the odds */
  drawFish({x:8,y:17});
  txtS('x'+fishHeld, 24, 24, 11, C.fish);
  const ch = Math.round(catchChance()*100);
  txtS('CATCH '+ch+'%', 52, 24, 11, ch>=70 ? '#8fe0a0' : (ch>=45 ? C.gold : C.hot));

  /* nets left */
  for(let i=0;i<netsLeft;i++) drawNetSprite(150+i*16, 5, 12, 10, C.net);
  txtS('NETS', 150, 24, 9, '#a894c0');

  /* the ranger closing in */
  const f = rangerMeter/rangerMax;
  txtS('RANGER', 210, 10, 9, f>0.75 ? C.hot : '#a894c0');
  px(210,17,150,9,'#3a3050');
  px(211,18,148*Math.min(1,f),7, f>0.75 ? C.hot : (f>0.5 ? C.gold : C.ranger));
  if(f>0.8 && frame%20<12) txtS('HURRY!', 285, 22, 9, C.paper, 'center');

  txtS(LEVELS[level].name, W-8, 12, 10, '#a894c0', 'right');
  txtS(phase==='home'?'RUN HOME!':'FIND THE CAT', W-8, 25, 10, phase==='home'?C.gold:'#a894c0', 'right');
}

function drawTitle(){
  ctx.fillStyle='#241f30'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.13;
  for(let y=0;y<H;y+=16) for(let x=((y/16)%2)*18;x<W;x+=36) px(x,y,34,14,C.wall);
  ctx.globalAlpha=1;
  for(let i=0;i<5;i++) px(30+i*100, 150, 70, 9, C.plat);

  txtS('CATCH', 150, 70, 40, C.ranger, 'center');
  txtS('THE', 292, 58, 22, C.paper, 'center');
  ctx.save(); ctx.translate(340,78); ctx.scale(2.1,2.1);
  drawCat({x:-8,y:-6,w:CW,h:CH,dir:-1,onGround:true,anim:0,panic:0});
  ctx.restore();
  txtS('you crazy cat', W/2, 112, 11, C.cat, 'center');

  const t=Math.sin(frame*0.05)*10;
  drawMC({x:120+t,y:130,w:PW,h:PH,dir:1,anim:frame*0.2,grace:0});
  drawRanger({x:330-t,y:126,w:18,h:24,dir:-1,anim:0});
  drawCat({x:230+t,y:137,w:CW,h:CH,dir:-1,onGround:true,anim:frame*0.2,panic:0});

  txtS('CATCH THE CAT BEFORE THE RANGER DOES', W/2, 200, 11, C.paper, 'center');
  txtS('MORE FISH = A BETTER CHANCE WITH THE NET', W/2, 218, 10, C.fish, 'center');
  if(frame%60<38) txtS('PRESS ANY BUTTON TO START', W/2, 252, 13, C.gold, 'center');
  if(best>0) txtS('BEST '+String(best).padStart(5,'0'), 10, 284, 9, '#7a6a90');
}

function drawHowTo(){
  ctx.fillStyle='#241f30'; ctx.fillRect(0,0,W,H);
  px(12,8,W-24,H-16,'#2e2840');
  ctx.strokeStyle=C.plat; ctx.lineWidth=2; ctx.strokeRect(12,8,W-24,H-16);
  txtS('HOW TO PLAY', W/2, 26, 15, C.gold, 'center');

  drawCoin({x:32,y:44}); txtS('Coins are 5 points.', 84, 49, 10, C.paper);
  drawFish({x:30,y:62});
  txtS('Fish are 10 points AND they bank as net', 84, 66, 10, C.paper);
  txtS('boosters: each one adds 25% to your throw.', 84, 79, 10, C.fish);

  drawNetSprite(30, 94, 14, 11, C.net);
  txtS('THROW NET at the cat. A bare net is 25%.', 84, 99, 10, C.paper);
  txtS('Three fish makes it nearly certain.', 84, 112, 10, C.paper);
  txtS('Miss the cat and the net lands - pick it up.', 84, 125, 10, '#a894c0');
  txtS('Hit and fail and the cat takes it with him.', 84, 138, 10, C.hot);

  px(30,156,44,9,C.plat);
  ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(38,158); ctx.lineTo(54,163); ctx.moveTo(54,158); ctx.lineTo(38,163); ctx.stroke();
  txtS('A platform with an X falls 3 seconds after', 84, 158, 10, C.paper);
  txtS('you land on it. Then it comes back.', 84, 171, 10, C.paper);

  txtS('The ranger throws nets from up top. Get hit', 84, 192, 10, C.paper);
  txtS('and you go back to the start.', 84, 205, 10, C.hot);
  txtS('CATCH THE CAT, THEN RUN HOME TO THE PORTAL', W/2, 226, 10, C.gold, 'center');
  txtS('KEYS: ARROWS  SPACE=JUMP  X=NET  (UP/DOWN AIMS)', W/2, 246, 9, '#a894c0', 'center');
  if(frame%60<38) txtS('PRESS ANY BUTTON', W/2, 270, 12, C.gold, 'center');
}

function drawOverlay(){
  if(state==='clear'){
    px(0,116,W,72,'rgba(20,16,28,.88)');
    txtS('HOME SAFE!', W/2, 140, 22, C.gold, 'center');
    txtS('YOU BEAT THE RANGER TO IT', W/2, 164, 11, C.paper, 'center');
    txtS('SCORE '+String(score).padStart(5,'0'), W/2, 180, 11, C.coin, 'center');
  }
  if(state==='lost'){
    ctx.fillStyle='rgba(16,12,22,.94)'; ctx.fillRect(0,0,W,H);
    txtS('THE RANGER GOT THE CAT', W/2, 112, 19, C.ranger, 'center');
    txtS(netsLeft<=0 ? 'YOU RAN OUT OF NETS' : 'YOU RAN OUT OF TIME', W/2, 146, 12, C.hot, 'center');
    txtS('SCORE '+String(score).padStart(5,'0'), W/2, 178, 12, C.gold, 'center');
    if(timer>80 && frame%60<38) txtS('PRESS ANY BUTTON', W/2, 232, 11, '#a894c0', 'center');
  }
  if(state==='won'){
    ctx.fillStyle='#1f2e22'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){ const x=(i*97+frame)%W, y=(i*41+frame*2)%H; px(x,y,2,2, i%3?C.cat:C.gold); }
    txtS('YOU CRAZY CAT!', W/2, 64, 24, C.cat, 'center');
    ctx.save(); ctx.translate(W/2,130); ctx.scale(2.2,2.2);
    drawCat({x:-8,y:-6,w:CW,h:CH,dir:-1,onGround:true,anim:frame*0.2,panic:0});
    ctx.restore();
    txtS('EVERY CAT CAUGHT, EVERY TIME HOME FIRST', W/2, 186, 11, C.paper, 'center');
    txtS('FINAL SCORE '+String(score).padStart(5,'0'), W/2, 214, 14, C.gold, 'center');
    if(timer>80 && frame%60<38) txtS('PRESS ANY BUTTON', W/2, 248, 11, C.paper, 'center');
  }
  if(state==='play' && hintT>0){
    ctx.globalAlpha=Math.min(1,hintT/60);
    px(0,HUD_H+2,W,28,'rgba(20,16,28,.8)');
    txtS(LEVELS[level].name, W/2, HUD_H+11, 11, C.gold, 'center');
    txtS(LEVELS[level].hint, W/2, HUD_H+24, 10, C.paper, 'center');
    ctx.globalAlpha=1;
  }
}

function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  if(shake>0) ctx.translate((Math.random()*2-1)*shake*0.3,(Math.random()*2-1)*shake*0.3);
  ctx.fillStyle='#16141d'; ctx.fillRect(-8,-8,W+16,H+16);

  if(state==='title'){ drawTitle(); return; }
  if(state==='howto'){ drawHowTo(); return; }
  if(state==='lost'||state==='won'){ drawOverlay(); return; }

  drawBg();
  for(const p of plats) drawPlat(p);
  drawPortal();
  for(const c of coins) if(!c.taken) drawCoin(c);
  for(const f of fishes) if(!f.taken) drawFish(f);
  for(const nt of nets) drawNetSprite(nt.x, nt.y, nt.w, nt.h, nt.st==='ground'?C.netDark:C.net);
  for(const rn of rangerNets) drawNetSprite(rn.x, rn.y, rn.w, rn.h, '#b0e0b0');
  if(!cat.caught) drawCat(cat); 
  drawRanger(ranger);
  drawMC(mc);
  if(cat.caught){
    drawCat(cat);
    drawNetSprite(cat.x-3, cat.y-3, 20, 17, C.net);
  }
  for(const s of sparks){ ctx.globalAlpha=Math.min(1,s.t/13); px(s.x,s.y,2,2,s.c); ctx.globalAlpha=1; }
  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.t/26);
    txtS(p.s, p.x, p.y, 10, p.c, 'center'); ctx.globalAlpha=1;
  }
  drawHUD();
  drawOverlay();
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
const STEP=1000/60;
function loop(now){
  requestAnimationFrame(loop);
  acc += Math.min(now-last,100); last=now;
  while(acc>=STEP){ update(); acc-=STEP; }
  render();
}
requestAnimationFrame(loop);
</script>
