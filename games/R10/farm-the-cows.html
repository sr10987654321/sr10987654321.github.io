<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Farm The Cows!!!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1b2a14;
    font-family:"Courier New",Courier,monospace;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 3px #f2a0c0,0 0 40px rgba(0,0,0,.7);}
  #ctrls{position:fixed;inset:0;pointer-events:none;}
  .btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:bold;font-family:inherit;border:3px solid rgba(255,255,255,.5);
    background:rgba(50,60,40,.45);border-radius:16px;user-select:none;-webkit-user-select:none;
    text-align:center;line-height:1.05;}
  .btn:active,.btn.on{background:rgba(242,160,192,.72);border-color:#ffc4dd;color:#3a1a28;}
  #bU{left:calc(3vw + 13vh);bottom:17vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bD{left:calc(3vw + 13vh);bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bL{left:3vw;bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bR{left:calc(3vw + 26vh);bottom:5vh;width:12vh;height:11vh;font-size:4.6vh;}
  #bBL{right:calc(3vw + 20vh);bottom:5vh;width:18vh;height:18vh;border-radius:50%;font-size:2.5vh;
       background:rgba(150,210,120,.42);border-color:#b0e88a;}
  #bBR{right:3vw;bottom:5vh;width:18vh;height:18vh;border-radius:50%;font-size:2.5vh;
       background:rgba(242,160,192,.42);border-color:#ffc4dd;}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#1b2a14;color:#f2d06a;font-size:20px;text-align:center;padding:30px;z-index:9;}
  @media (orientation:portrait){#rot{display:flex}#wrap,#ctrls{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctrls">
  <div class="btn" id="bU">&#9650;</div>
  <div class="btn" id="bL">&#9664;</div>
  <div class="btn" id="bD">&#9660;</div>
  <div class="btn" id="bR">&#9654;</div>
  <div class="btn" id="bBL">L<br>COWS<br>FOLLOW</div>
  <div class="btn" id="bBR">R<br>JUMP<br>/ BUILD</div>
</div>
<div id="rot">Turn your iPad sideways<br>to play</div>
<script>
"use strict";
/* ============================================================
   FARM THE COWS!!!
   You are the farmer. Build the farm, buy the cows, milk them,
   and get all five into the barn before the wolf comes out.
   Built from a Year 4-6 student arcade game design document.
   ============================================================ */

const W = 480, H = 300, SC = 3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W*SC; cv.height = H*SC;
ctx.setTransform(SC,0,0,SC,0,0);
ctx.imageSmoothingEnabled = false;

function resize(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,250));
resize();

const HUD_H = 34, PY0 = 34, PY1 = 300;

/* ---------- palette ---------- */
const C = {
  grass:'#7fbf4a', grass2:'#6faa3f', grassLite:'#96d45f',
  path:'#c9a06a', pathDark:'#a87f4a',
  forest:'#2f6b34', forestDark:'#1e4a24', forestLite:'#3f8a44',
  barn:'#c0392b', barnDark:'#8a2418', barnRoof:'#e0564a',
  paddock:'#a8e06a', paddockFence:'#8a6a3a',
  house:'#f2a0c0', houseDark:'#c96a94', houseRoof:'#e0564a',
  milk:'#eaf4ff', milkDark:'#a8c4e0', milkBlue:'#5aa8e0',
  feed:'#f0a03a', feedDark:'#c07020',
  market:'#f2d06a', marketDark:'#c9a83a',
  kennel:'#a8763a', kennelDark:'#7a5020',
  cow:'#fdfdf8', cowSpot:'#2a2a2a', cowPink:'#f2a0c0', cowHorn:'#e0d0a0',
  farmer:'#3a6fd0', farmerSkin:'#f0c9a0', farmerHat:'#c9853a',
  wolf:'#6a6a78', wolfDark:'#44444f', wolfEye:'#ff5a3a',
  dog:'#b58a4a', dogDark:'#8a6030',
  mud:'#7a5a3a', mudDark:'#5c4028',
  gold:'#f2d06a', paper:'#fffaf0', hot:'#ff5a5a', ink:'#1b2a14', night:'#1a2050'
};

/* ---------- audio ---------- */
let AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(f,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f;
    const t=AC.currentTime;
    g.gain.setValueAtTime(vol===undefined?0.06:vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function slide(f1,f2,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    const t=AC.currentTime;
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    g.gain.setValueAtTime(vol===undefined?0.06:vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function mooSound(){ slide(220,150,0.4,'sawtooth',0.05); setTimeout(()=>slide(180,130,0.3,'sawtooth',0.04),260); }
function cashSound(){ [784,988,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.08,'square',0.05), i*55)); }
function buildSound(){ tone(300,0.08,'square',0.05); setTimeout(()=>tone(420,0.1,'square',0.05),80); setTimeout(()=>tone(600,0.12,'square',0.05),170); }
function milkSound(){ tone(880,0.06,'sine',0.05); setTimeout(()=>tone(1175,0.09,'sine',0.05),55); }
function howlSound(){ slide(300,520,0.5,'sawtooth',0.06); setTimeout(()=>slide(520,240,0.6,'sawtooth',0.05),420); }
function barkSound(){ tone(420,0.06,'square',0.05); setTimeout(()=>tone(330,0.07,'square',0.05),70); }
function loseCowSound(){ slide(400,90,0.5,'sawtooth',0.08); }
function winSound(){ [523,659,784,1046,1319,1568].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.07), i*100)); }

/* ---------- input ---------- */
const keys={u:false,d:false,l:false,r:false,follow:false};
let rEdge=false, anyPress=false;
const KEYMAP={ArrowUp:'u',KeyW:'u', ArrowDown:'d',KeyS:'d', ArrowLeft:'l',KeyA:'l', ArrowRight:'r',KeyD:'r',
              ShiftLeft:'follow', KeyQ:'follow'};
addEventListener('keydown',e=>{
  initAudio(); anyPress=true;
  if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){ e.preventDefault(); rEdge=true; return; }
  const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys[k]=true; }
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys[k]=false; }});
function bindBtn(id,key){
  const el=document.getElementById(id);
  const on=e=>{
    e.preventDefault(); initAudio(); anyPress=true;
    if(key==='rbtn') rEdge=true; else keys[key]=true;
    el.classList.add('on');
  };
  const off=e=>{ e.preventDefault(); if(key!=='rbtn') keys[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on); addEventListener('mouseup',off);
}
bindBtn('bU','u'); bindBtn('bD','d'); bindBtn('bL','l'); bindBtn('bR','r');
bindBtn('bBL','follow'); bindBtn('bBR','rbtn');
cv.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); anyPress=true; },{passive:false});
cv.addEventListener('mousedown',()=>{ initAudio(); anyPress=true; });

/* ---------- the farm, laid out from her map ---------- */
const PLOTS = {
  milk:   { name:'MILKING SPOT', cost:200, x:24,  y:52,  w:84,  h:58, bought:false, note:'$10 EVERY MILKING' },
  house:  { name:'FARM HOUSE',   cost:200, x:170, y:44,  w:78,  h:58, bought:false, note:'+$50 EVERY MORNING' },
  feed:   { name:'FEEDING SPOT', cost:100, x:196, y:134, w:88,  h:54, bought:false, note:'FED COWS WILL FOLLOW' },
  dog:    { name:'THE DOG',      cost:500, x:388, y:150, w:70,  h:54, bought:false, note:'CHASES THE WOLF OFF' },
  barn:   { name:'BARN',         cost:200, x:24,  y:204, w:104, h:80, bought:false, note:'COWS ARE SAFE INSIDE' },
  paddock:{ name:'PADDOCK',      cost:150, x:168, y:200, w:132, h:86, bought:false, note:'COWS STAY PUT INSIDE' }
};
const MARKET = { x:358, y:212, w:112, h:74, cost:50 };
const FOREST = { x:368, y:36, w:112, h:82 };
const MUD = [ {x:132,y:126,w:44,h:26}, {x:300,y:96,w:38,h:24}, {x:312,y:250,w:40,h:24}, {x:120,y:186,w:36,h:22} ];
const COWS_TO_WIN = 5;
const DAY_FRAMES = 55*60, NIGHT_FRAMES = 22*60;

/* ---------- state ---------- */
let state='title', timer=0, frame=0;
let money=1000, day=1, phase='day', phaseT=DAY_FRAMES;
let farmer=null, cows=[], wolf=null, dog=null, pops=[], sparks=[];
let hintT=0, shake=0, cowsBought=0, cowsLost=0, milkEarned=0, bestDays=0;

function rectsHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function inRect(x,y,r){ return x>r.x && x<r.x+r.w && y>r.y && y<r.y+r.h; }
function pop(x,y,s,col){ pops.push({x:x,y:y,s:s,c:col||C.gold,t:80}); }
function puff(x,y,col,n){
  for(let i=0;i<(n||10);i++)
    sparks.push({x:x,y:y,vx:(Math.random()*2-1)*1.8,vy:(Math.random()*2-1)*1.8,t:26,c:col});
}

function startGame(){
  money=1000; day=1; phase='day'; phaseT=DAY_FRAMES;
  cowsBought=0; cowsLost=0; milkEarned=0;
  for(const k in PLOTS) PLOTS[k].bought=false;
  farmer = { x:20, y:150, w:14, h:18, dir:1, anim:0, hop:0, hopT:0 };
  cows=[]; pops=[]; sparks=[];
  wolf = { x:FOREST.x+40, y:FOREST.y+40, w:22, h:14, dir:-1, active:false,
           target:null, carrying:null, scared:0, anim:0 };
  dog = { x:60, y:170, w:16, h:11, dir:1, anim:0, barkCD:0 };
  hintT=340; state='play'; timer=0;
}

function buyCow(){
  if(cowsBought >= COWS_TO_WIN + cowsLost) return false;
  if(money < MARKET.cost) return false;
  money -= MARKET.cost; cowsBought++;
  cows.push({ x:MARKET.x+20+Math.random()*60, y:MARKET.y+18+Math.random()*36,
              w:20, h:14, vx:0, vy:0, dir:-1, fed:100, following:false,
              inBarn:false, milkCD:0, wt:Math.random()*120, anim:Math.random()*6 });
  cashSound(); pop(MARKET.x+56, MARKET.y-6, 'COW BOUGHT -$50', C.gold);
  return true;
}

/* how many cows could still possibly end up in the barn */
function stillPossible(){
  const alive = cows.filter(c=>!c.gone).length;
  if(alive + Math.floor(money/MARKET.cost) >= COWS_TO_WIN) return true;
  /* a milking spot with a cow on it, or the farm house, still brings money in */
  const canEarn = (PLOTS.milk.bought && alive>0) || PLOTS.house.bought;
  return canEarn;
}

/* ---------- update ---------- */
function update(){
  frame++;
  if(shake>0) shake--;
  if(hintT>0) hintT--;

  if(state==='title'){ if(anyPress){ anyPress=false; state='howto'; timer=0; tone(700,0.09);} return; }
  if(state==='howto'){ timer++; if(anyPress&&timer>20){ anyPress=false; startGame(); tone(950,0.1);} return; }
  if(state==='won'||state==='lost'){ timer++; if(anyPress&&timer>80){ anyPress=false; state='title'; timer=0; } return; }

  /* ---------- PLAY ---------- */
  anyPress=false;
  const f = farmer;

  /* ----- day and night ----- */
  phaseT--;
  if(phaseT<=0){
    if(phase==='day'){
      phase='night'; phaseT=NIGHT_FRAMES;
      wolf.active=true; wolf.x=FOREST.x+40; wolf.y=FOREST.y+50; wolf.scared=0; wolf.carrying=null;
      howlSound(); pop(240,120,'NIGHT! THE WOLF IS OUT', C.hot);
    } else {
      phase='day'; phaseT=DAY_FRAMES; day++;
      wolf.active=false; wolf.carrying=null;
      if(PLOTS.house.bought){ money+=50; pop(PLOTS.house.x+39, PLOTS.house.y-8, 'FARM HOUSE +$50', C.gold); cashSound(); }
      pop(240,120,'DAY '+day, C.paper);
    }
  }

  /* ----- the farmer ----- */
  let mx=0,my=0;
  if(keys.l) mx-=1; if(keys.r) mx+=1;
  if(keys.u) my-=1; if(keys.d) my+=1;
  const inMud = MUD.some(m=>inRect(f.x+f.w/2, f.y+f.h, m)) && f.hop<=0;
  let sp = inMud ? 0.85 : 2.0;
  if(mx||my){
    const L=Math.hypot(mx,my);
    f.x += mx/L*sp; f.y += my/L*sp;
    if(mx) f.dir = mx>0?1:-1;
    f.anim += 0.22;
  }
  f.x = Math.max(2, Math.min(W-2-f.w, f.x));
  f.y = Math.max(PY0+2, Math.min(PY1-2-f.h, f.y));

  if(f.hop>0){ f.hopT++; f.lift = Math.sin(f.hopT/f.hop*Math.PI)*7; if(f.hopT>=f.hop){ f.hop=0; f.lift=0; } }

  /* ----- R: build what you are standing on, or jump ----- */
  let standing = null;
  for(const k in PLOTS){ if(!PLOTS[k].bought && inRect(f.x+f.w/2, f.y+f.h, PLOTS[k])) standing = k; }
  const atMarket = inRect(f.x+f.w/2, f.y+f.h, MARKET);
  if(rEdge){
    rEdge=false;
    if(standing){
      const p = PLOTS[standing];
      if(money >= p.cost){
        money -= p.cost; p.bought = true;
        buildSound(); puff(p.x+p.w/2, p.y+p.h/2, C.gold, 16);
        pop(p.x+p.w/2, p.y-8, p.name+' BUILT!', C.gold);
        if(standing==='dog') barkSound();
      } else { tone(170,0.09,'square',0.05); pop(f.x, f.y-14, 'NOT ENOUGH MONEY', C.hot); }
    } else if(atMarket){
      if(!buyCow()){ tone(170,0.09,'square',0.05); pop(f.x, f.y-14, money<50?'NOT ENOUGH MONEY':'THAT IS ENOUGH COWS', C.hot); }
    } else if(f.hop<=0){
      f.hop=22; f.hopT=0; tone(520,0.07,'square',0.045);
    }
  }

  /* ----- the cows ----- */
  const whistling = keys.follow;
  for(const c of cows){
    if(c.gone) continue;
    c.anim += 0.08;
    if(c.milkCD>0) c.milkCD--;

    if(c.inBarn){ continue; }                      /* safe and staying put */

    if(c.fed>0) c.fed -= 0.055;                    /* they get hungry */
    if(c.fed<0) c.fed=0;

    const dx=(f.x+f.w/2)-(c.x+c.w/2), dy=(f.y+f.h/2)-(c.y+c.h/2);
    const d=Math.hypot(dx,dy)||1;
    c.following = whistling && c.fed>0 && d<86 && !c.carried;

    if(c.carried){
      /* the wolf has it */
      c.x += (wolf.x-c.x)*0.3; c.y += (wolf.y+6-c.y)*0.3;
    } else if(c.following && d>24){
      const cs = MUD.some(m=>inRect(c.x+c.w/2,c.y+c.h,m)) ? 0.7 : 1.35;
      c.x += dx/d*cs; c.y += dy/d*cs;
      if(dx) c.dir = dx>0?1:-1;
    } else {
      /* wander, and stay in the paddock if you built one */
      c.wt--;
      if(c.wt<=0){
        c.wt = 90+Math.random()*150;
        const inPad = PLOTS.paddock.bought && inRect(c.x+c.w/2,c.y+c.h,PLOTS.paddock);
        if(inPad && Math.random()<0.75){ c.vx=0; c.vy=0; }
        else { const a=Math.random()*Math.PI*2; c.vx=Math.cos(a)*0.32; c.vy=Math.sin(a)*0.32; }
      }
      c.x += c.vx; c.y += c.vy;
      if(PLOTS.paddock.bought){
        const P=PLOTS.paddock;
        if(inRect(c.x+c.w/2,c.y+c.h,P) || (c.px!==undefined && inRect(c.px,c.py,P))){
          c.x = Math.max(P.x+2, Math.min(P.x+P.w-2-c.w, c.x));
          c.y = Math.max(P.y+2, Math.min(P.y+P.h-2-c.h, c.y));
        }
      }
      c.px = c.x+c.w/2; c.py = c.y+c.h;
    }
    c.x = Math.max(2, Math.min(W-2-c.w, c.x));
    c.y = Math.max(PY0+2, Math.min(PY1-2-c.h, c.y));

    /* feeding */
    if(PLOTS.feed.bought && inRect(c.x+c.w/2,c.y+c.h,PLOTS.feed) && c.fed<99){
      c.fed = Math.min(100, c.fed+1.4);
      if(frame%40===0) puff(c.x+10,c.y+4,C.feed,3);
    }
    /* milking - "$10 per milking" */
    if(PLOTS.milk.bought && inRect(c.x+c.w/2,c.y+c.h,PLOTS.milk) && c.milkCD<=0){
      c.milkCD = 900; money += 10; milkEarned += 10;
      milkSound(); pop(c.x+10, c.y-8, 'MILKED +$10', C.milkBlue);
    }
    /* into the barn */
    if(PLOTS.barn.bought && inRect(c.x+c.w/2,c.y+c.h,PLOTS.barn)){
      c.inBarn = true; c.following=false;
      const idx = cows.filter(q=>q.inBarn).length-1;
      c.x = PLOTS.barn.x + 12 + (idx%3)*30;
      c.y = PLOTS.barn.y + 30 + Math.floor(idx/3)*24;
      mooSound(); pop(c.x+10, c.y-10, 'SAFE!', C.paper);
    }
  }

  /* ----- the wolf ----- */
  if(wolf.active){
    wolf.anim += 0.1;
    if(wolf.scared>0){
      wolf.scared--;
      const dx=(FOREST.x+50)-wolf.x, dy=(FOREST.y+40)-wolf.y, d=Math.hypot(dx,dy)||1;
      wolf.x += dx/d*2.1; wolf.y += dy/d*2.1;
      wolf.dir = dx>0?1:-1;
    } else if(wolf.carrying){
      const dx=(FOREST.x+50)-wolf.x, dy=(FOREST.y+40)-wolf.y, d=Math.hypot(dx,dy)||1;
      wolf.x += dx/d*1.5; wolf.y += dy/d*1.5;
      wolf.dir = dx>0?1:-1;
      if(d<26){
        wolf.carrying.gone = true;
        cowsLost++;
        loseCowSound(); pop(wolf.x, wolf.y-14, 'THE WOLF TOOK A COW!', C.hot);
        wolf.carrying=null; shake=14;
        if(!stillPossible()){ state='lost'; timer=0; return; }
      }
    } else {
      /* hunt the nearest loose cow */
      let bestC=null, bestD=1e9;
      for(const c of cows){
        if(c.gone||c.inBarn||c.carried) continue;
        const d=Math.hypot((c.x)-wolf.x,(c.y)-wolf.y);
        if(d<bestD){ bestD=d; bestC=c; }
      }
      if(bestC){
        const dx=bestC.x-wolf.x, dy=bestC.y-wolf.y, d=Math.hypot(dx,dy)||1;
        wolf.x += dx/d*1.5; wolf.y += dy/d*1.5;
        wolf.dir = dx>0?1:-1;
        if(d<16){ bestC.carried=true; wolf.carrying=bestC; howlSound(); }
      } else {
        const dx=(FOREST.x+50)-wolf.x, dy=(FOREST.y+40)-wolf.y, d=Math.hypot(dx,dy)||1;
        if(d>20){ wolf.x += dx/d*1.2; wolf.y += dy/d*1.2; }
      }
    }
    /* the farmer can shoo it, the dog does it properly */
    if(Math.hypot((f.x+7)-wolf.x,(f.y+9)-wolf.y) < 22 && wolf.scared<=0){
      wolf.scared = 150;
      if(wolf.carrying){ wolf.carrying.carried=false; wolf.carrying=null; }
      pop(wolf.x, wolf.y-14, 'SHOO!', C.paper); tone(600,0.1,'square',0.05);
    }
  }

  /* ----- the dog ----- */
  if(PLOTS.dog.bought){
    dog.anim += 0.14;
    let tx=f.x-18, ty=f.y+10;
    if(wolf.active && wolf.scared<=0){ tx=wolf.x; ty=wolf.y; }
    const dx=tx-dog.x, dy=ty-dog.y, d=Math.hypot(dx,dy)||1;
    if(d>10){ dog.x += dx/d*2.15; dog.y += dy/d*2.15; dog.dir = dx>0?1:-1; }
    if(wolf.active && Math.hypot(dog.x-wolf.x,dog.y-wolf.y)<18 && wolf.scared<=0){
      wolf.scared=260;
      if(wolf.carrying){ wolf.carrying.carried=false; wolf.carrying=null; }
      barkSound(); pop(dog.x, dog.y-12, 'WOOF!', C.paper);
    }
    if(dog.barkCD>0) dog.barkCD--;
  }

  /* ----- win ----- */
  if(cows.filter(c=>c.inBarn).length >= COWS_TO_WIN){
    bestDays = (bestDays===0) ? day : Math.min(bestDays, day);
    state='won'; timer=0; winSound();
    return;
  }
  if(!stillPossible()){ state='lost'; timer=0; return; }

  updateFx();
}
function updateFx(){
  for(const p of pops){ p.y-=0.3; p.t--; }
  pops = pops.filter(p=>p.t>0);
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.t--; }
  sparks = sparks.filter(s=>s.t>0);
}

  ctx.fillStyle='#1b2a14'; ctx.fillRect(-8,-8,W+16,H+16);

  if(state==='title'){ drawTitle(); return; }
  if(state==='howto'){ drawHowTo(); return; }
  if(state==='won'||state==='lost'){ drawOverlay(); return; }

  drawField();
  drawForest();
  drawPlot('paddock'); drawPlot('feed'); drawPlot('milk');
  drawPlot('house'); drawPlot('dog');
  drawMarket();
  drawPlot('barn');

  const order = cows.filter(c=>!c.gone).slice().sort((a,b)=>a.y-b.y);
  for(const c of order) drawCow(c);
  drawDog(dog);
  drawWolf(wolf);
  drawFarmer(farmer);

  for(const s of sparks){ ctx.globalAlpha=Math.min(1,s.t/13); px(s.x,s.y,2,2,s.c); ctx.globalAlpha=1; }
  drawNight();
  for(const p of pops){
    ctx.globalAlpha=Math.min(1,p.t/28);
    txtS(p.s, p.x, p.y, 10, p.c, 'center'); ctx.globalAlpha=1;
  }
  drawPrompt();
  drawHUD();
  drawOverlay();
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
const STEP=1000/60;
function loop(now){
  requestAnimationFrame(loop);
  acc += Math.min(now-last,100); last=now;
  while(acc>=STEP){ update(); acc-=STEP; }
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
