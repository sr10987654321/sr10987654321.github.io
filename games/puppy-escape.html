<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Puppy Escape</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#2d1f3d;
    font-family:"Courier New",Courier,monospace;touch-action:none;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 3px #ffb3d9,0 0 40px rgba(0,0,0,.6);}
  #ctrls{position:fixed;inset:0;pointer-events:none;}
  .btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:bold;font-family:inherit;border:3px solid rgba(255,255,255,.55);
    background:rgba(90,60,120,.42);border-radius:16px;user-select:none;-webkit-user-select:none;}
  .btn:active,.btn.on{background:rgba(255,214,61,.7);border-color:#ffd63d;color:#4a2c1a;}
  /* d-pad, bottom left */
  #bU{left:calc(2.5vw + 13vh);bottom:16vh;width:12vh;height:11vh;font-size:5vh;}
  #bL{left:2.5vw;bottom:4vh;width:12vh;height:11vh;font-size:5vh;}
  #bD{left:calc(2.5vw + 13vh);bottom:4vh;width:12vh;height:11vh;font-size:5vh;}
  #bR{left:calc(2.5vw + 26vh);bottom:4vh;width:12vh;height:11vh;font-size:5vh;}
  #bJ{right:3vw;bottom:6vh;width:19vh;height:19vh;border-radius:50%;font-size:3.4vh;
      background:rgba(255,140,190,.45);border-color:#ffb3d9;}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#2d1f3d;color:#ffd63d;font-size:20px;text-align:center;padding:30px;z-index:9;}
  @media (orientation:portrait){#rot{display:flex}#wrap,#ctrls{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctrls">
  <div class="btn" id="bU">&#9650;</div>
  <div class="btn" id="bL">&#9664;</div>
  <div class="btn" id="bD">&#9660;</div>
  <div class="btn" id="bR">&#9654;</div>
  <div class="btn" id="bJ">JUMP</div>
</div>
<div id="rot">Turn your iPad sideways<br>to play</div>
<script>
"use strict";
/* ============================================================
   PUPPY ESCAPE  -  Bonie Puppy vs Karen Cat
   Get home along the rainbow track before the cat gets you.
   Built from a Year 4-6 student arcade game design document.
   ============================================================ */

const W = 480, H = 300, SC = 3;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W*SC; cv.height = H*SC;
ctx.setTransform(SC,0,0,SC,0,0);
ctx.imageSmoothingEnabled = false;

function resize(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,250));
resize();

/* ---------- grid ---------- */
const COLS = 24, ROWS = 13, CELL = 20, GX = 0, GY = 32;
function cx(c){ return GX + c*CELL + CELL/2; }
function cy(r){ return GY + r*CELL + CELL/2; }

/* ---------- palette ---------- */
const RAINBOW = ['#ff6b6b','#ff9f43','#ffd93d','#6bd968','#4dabf7','#9775fa','#ff8fd0','#5fd6c8'];
const C = {
  grass:'#7cc267', grassDark:'#63aa50', grassLite:'#93d47c',
  dog:'#c99b6a', dogDark:'#8a6440', dogPale:'#e8c9a0', tongue:'#ff8fb0', nose:'#5a3a24',
  cat:'#7a7d8c', catDark:'#4d5060', catEye:'#ffd93d',
  bone:'#fff4e0', boneDark:'#d6c4a8',
  house:'#ffd93d', houseDark:'#c9a325', roof:'#e0654a', doorc:'#8a5a3a',
  ink:'#3d2a1a', paper:'#fffaf0', hot:'#ff5a8a', sky:'#bfe8ff'
};

/* ---------- audio ---------- */
let AC = null;
function initAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f;
    const t=AC.currentTime;
    g.gain.setValueAtTime(vol===undefined?0.07:vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
/* the two noises the design names */
function happyNoise(){ [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.17,'square',0.07), i*90)); }
function sadNoise(){ [415,349,294,220].forEach((f,i)=>setTimeout(()=>beep(f,0.3,'triangle',0.08), i*150)); }
function boneNoise(){ [784,988,1175].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.06), i*55)); }

/* ---------- input ---------- */
const keys = { l:false, r:false, u:false, d:false };
let jumpEdge = false, anyPress = false, lastDir = null;
const KEYMAP = { ArrowLeft:'l',KeyA:'l', ArrowRight:'r',KeyD:'r', ArrowUp:'u',KeyW:'u', ArrowDown:'d',KeyS:'d' };
addEventListener('keydown', e => {
  initAudio(); anyPress = true;
  if(e.code==='Space'||e.code==='KeyX'||e.code==='KeyZ'||e.code==='Enter'){ e.preventDefault(); jumpEdge=true; return; }
  const k = KEYMAP[e.code];
  if(k){ e.preventDefault(); keys[k]=true; lastDir=k; }
});
addEventListener('keyup', e => { const k=KEYMAP[e.code]; if(k){ e.preventDefault(); keys[k]=false; } });

function bindBtn(id,key){
  const el = document.getElementById(id);
  const on = e => {
    e.preventDefault(); initAudio(); anyPress = true;
    if(key==='j'){ jumpEdge = true; } else { keys[key]=true; lastDir=key; }
    el.classList.add('on');
  };
  const off = e => { e.preventDefault(); if(key!=='j') keys[key]=false; el.classList.remove('on'); };
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on); addEventListener('mouseup',off);
}
bindBtn('bU','u'); bindBtn('bL','l'); bindBtn('bD','d'); bindBtn('bR','r'); bindBtn('bJ','j');
cv.addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); anyPress=true; },{passive:false});
cv.addEventListener('mousedown', ()=>{ initAudio(); anyPress=true; });

/* ---------- levels: tracks built from straight segments ---------- */
function Hseg(r,c0,c1){ return {h:true,r:r,c0:c0,c1:c1}; }
function Vseg(c,r0,r1){ return {h:false,c:c,r0:r0,r1:r1}; }

const LEVELS = [
  { /* Maggie's map, traced from the design sheet */
    name:"THE RAINBOW TRACK",
    hint:"RUN HOME BEFORE KAREN CATCHES YOU",
    segs:[ Hseg(9,12,22), Vseg(12,2,9), Hseg(2,4,12), Vseg(4,2,11), Hseg(11,1,4) ],
    start:[22,9], house:[1,11],
    cats:[ {at:'start', delay:170} ],
    catSpeed:1.05 },

  { name:"THE LONG WAY HOME",
    hint:"PRESS JUMP TO HOP RIGHT OVER A CAT",
    segs:[ Hseg(11,2,21), Vseg(2,9,11), Hseg(9,2,21), Vseg(21,7,9),
           Hseg(7,2,21), Vseg(2,5,7), Hseg(5,2,21), Vseg(21,3,5),
           Hseg(3,2,21), Vseg(2,1,3), Hseg(1,2,21) ],
    start:[21,11], house:[21,1],
    cats:[ {at:'start', delay:150}, {cell:[10,5], delay:60} ],
    catSpeed:1.1 },

  { name:"THE PARK LOOP",
    hint:"A BONE MAKES YOU FAST FOR 3 SECONDS",
    segs:[ Hseg(1,2,21), Hseg(6,2,21), Hseg(11,2,21),
           Vseg(2,1,11), Vseg(21,1,11), Vseg(11,1,11) ],
    start:[2,11], house:[21,1],
    cats:[ {at:'start', delay:150}, {cell:[11,6], delay:90} ],
    catSpeed:1.15 },

  { name:"THE GARDEN MAZE",
    hint:"MORE CATS. USE THE LOOPS TO LOSE THEM",
    segs:[ Hseg(1,2,21), Hseg(5,2,21), Hseg(8,2,21), Hseg(11,2,21),
           Vseg(2,1,11), Vseg(8,1,11), Vseg(15,1,11), Vseg(21,1,11) ],
    start:[2,11], house:[21,1],
    cats:[ {at:'start', delay:140}, {cell:[15,5], delay:80}, {cell:[8,8], delay:110} ],
    catSpeed:1.2 },

  { name:"KAREN'S LAST CHANCE",
    hint:"LAST ONE. GET HOME, BONIE!",
    segs:[ Hseg(1,2,21), Hseg(4,2,21), Hseg(7,2,21), Hseg(10,2,21),
           Vseg(2,1,10), Vseg(6,1,10), Vseg(10,1,10),
           Vseg(14,1,10), Vseg(18,1,10), Vseg(21,1,10) ],
    start:[2,10], house:[21,1],
    cats:[ {at:'start', delay:130}, {cell:[14,4], delay:70},
           {cell:[10,7], delay:100}, {cell:[18,1], delay:150} ],
    catSpeed:1.25 }
];

/* ---------- state ---------- */
let state='title', timer=0, frame=0, level=0, score=0, best=0, caughtCount=0;
let grid=[], bones=[], decor=[], puppy=null, cats=[], houseCell=[0,0], startCell=[0,0];
let boost=0, jumpCD=0, hintT=0, shake=0, sparks=[], distField=null;

function buildGrid(L){
  grid = [];
  for(let r=0;r<ROWS;r++){ grid.push(new Array(COLS).fill(0)); }
  for(const s of L.segs){
    if(s.h){ for(let c=s.c0;c<=s.c1;c++) grid[s.r][c]=1; }
    else   { for(let r=s.r0;r<=s.r1;r++) grid[r][s.c]=1; }
  }
}
function walkable(c,r){ return c>=0 && c<COLS && r>=0 && r<ROWS && grid[r][c]===1; }

/* deterministic sprinkle of bones + scenery, stable per level */
function seeded(n){ let x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }

function placeBones(L){
  bones = [];
  const cells = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]) cells.push([c,r]);
  const skip = (c,r) => (Math.abs(c-startCell[0])+Math.abs(r-startCell[1]) < 3) ||
                        (Math.abs(c-houseCell[0])+Math.abs(r-houseCell[1]) < 3);
  let i = 0;
  for(const [c,r] of cells){
    i++;
    if(i % 9 === 4 && !skip(c,r)) bones.push({c:c,r:r,taken:false});
  }
}
function placeDecor(){
  decor = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(grid[r][c]) continue;
    const s = seeded(r*COLS + c + level*57);
    if(s > 0.86) decor.push({c:c,r:r,kind: s>0.955 ? 'flower' : 'grass', v:seeded(s*99)});
  }
}

function mkMover(c,r,speed){
  return { c:c, r:r, tc:c, tr:r, x:cx(c), y:cy(r), dx:0, dy:0, speed:speed, moving:false, anim:0 };
}

function loadLevel(n, keepScore){
  const L = LEVELS[n];
  startCell = L.start.slice(); houseCell = L.house.slice();
  buildGrid(L);
  placeBones(L); placeDecor();
  puppy = mkMover(startCell[0], startCell[1], 1.45);
  puppy.grace = 70;
  cats = L.cats.map(cd => {
    const cell = cd.at === 'start' ? startCell : cd.cell;
    const m = mkMover(cell[0], cell[1], L.catSpeed);
    m.home = cell.slice(); m.delay = cd.delay; m.wait = cd.delay;
    return m;
  });
  boost = 0; jumpCD = 0; sparks = []; distField = null;
  hintT = 280;
  if(!keepScore){ /* score carries across levels */ }
}

function resetAfterCatch(){
  puppy.c = startCell[0]; puppy.r = startCell[1];
  puppy.tc = puppy.c; puppy.tr = puppy.r;
  puppy.x = cx(puppy.c); puppy.y = cy(puppy.r);
  puppy.dx = 0; puppy.dy = 0; puppy.moving = false; puppy.grace = 90;
  for(const m of cats){
    m.c = m.home[0]; m.r = m.home[1]; m.tc = m.c; m.tr = m.r;
    m.x = cx(m.c); m.y = cy(m.r); m.dx = 0; m.dy = 0; m.moving = false;
    m.wait = Math.max(90, m.delay);
  }
  boost = 0;
}

function startGame(){ level=0; score=0; caughtCount=0; loadLevel(0); state='play'; timer=0; }

function puff(x,y,col,n){
  for(let i=0;i<(n||10);i++)
    sparks.push({x:x,y:y,vx:(Math.random()*2-1)*1.6,vy:(Math.random()*2-1)*1.6,t:24,c:col});
}

/* ---------- distance field for the cats (one BFS shared by all) ---------- */
function buildDistField(){
  const d = [];
  for(let r=0;r<ROWS;r++) d.push(new Array(COLS).fill(-1));
  const q = [[puppy.c, puppy.r]];
  if(!walkable(puppy.c, puppy.r)) return d;
  d[puppy.r][puppy.c] = 0;
  let head = 0;
  while(head < q.length){
    const [c,r] = q[head++];
    const nd = d[r][c] + 1;
    const nbr = [[c+1,r],[c-1,r],[c,r+1],[c,r-1]];
    for(const [nc,nr] of nbr){
      if(walkable(nc,nr) && d[nr][nc] === -1){ d[nr][nc] = nd; q.push([nc,nr]); }
    }
  }
  return d;
}

/* ---------- movement ---------- */
function stepMover(m, speed){
  if(m.moving){
    const tx = cx(m.tc), ty = cy(m.tr);
    const dx = tx - m.x, dy = ty - m.y;
    const dist = Math.hypot(dx, dy);
    if(dist <= speed){
      m.x = tx; m.y = ty; m.c = m.tc; m.r = m.tr; m.moving = false;
    } else {
      m.x += dx/dist*speed; m.y += dy/dist*speed;
      m.anim += 0.2;
    }
  }
}
function setTarget(m, dx, dy){
  const nc = m.c + dx, nr = m.r + dy;
  if(walkable(nc,nr)){ m.dx=dx; m.dy=dy; m.tc=nc; m.tr=nr; m.moving=true; return true; }
  return false;
}

/* ---------- update ---------- */
function update(){
  frame++;
  if(shake>0) shake--;
  if(hintT>0) hintT--;

  if(state==='title'){ if(anyPress){ anyPress=false; state='howto'; timer=0; beep(700,0.09);} return; }
  if(state==='howto'){ timer++; if(anyPress&&timer>20){ anyPress=false; startGame(); beep(950,0.1);} return; }
  if(state==='over'||state==='win'){ timer++; if(anyPress&&timer>60){ anyPress=false; state='title'; timer=0; } return; }
  if(state==='clear'){
    timer++; updateSparks();
    if(timer>130){
      level++;
      if(level>=LEVELS.length){ best=Math.max(best,score); state='win'; timer=0; happyNoise(); }
      else { loadLevel(level,true); state='play'; timer=0; }
    }
    return;
  }
  if(state==='caught'){
    timer++; updateSparks();
    if(timer>80){ resetAfterCatch(); state='play'; timer=0; }
    return;
  }

  /* ---------- PLAY ---------- */
  anyPress = false;
  const p = puppy;
  if(p.grace>0) p.grace--;
  if(boost>0) boost--;
  if(jumpCD>0) jumpCD--;

  /* jump: hop two tiles the way you're facing, right over a cat */
  if(jumpEdge){
    jumpEdge = false;
    if(!p.jumping && jumpCD<=0 && (p.dx||p.dy)){
      const base = p.moving ? [p.tc,p.tr] : [p.c,p.r];
      let land = null;
      if(walkable(base[0]+p.dx*2, base[1]+p.dy*2)) land = [base[0]+p.dx*2, base[1]+p.dy*2];
      else if(walkable(base[0]+p.dx, base[1]+p.dy)) land = [base[0]+p.dx, base[1]+p.dy];
      if(land){
        p.jumping = true; p.jt = 0; p.jdur = 24;
        p.jx0 = p.x; p.jy0 = p.y; p.jx1 = cx(land[0]); p.jy1 = cy(land[1]);
        p.jland = land; p.moving = false;
        jumpCD = 90;
        beep(660,0.09,'square',0.06); setTimeout(()=>beep(990,0.09,'square',0.05),80);
      }
    }
  }

  if(p.jumping){
    p.jt++;
    const t = p.jt / p.jdur;
    p.x = p.jx0 + (p.jx1-p.jx0)*t;
    p.y = p.jy0 + (p.jy1-p.jy0)*t;
    p.hop = Math.sin(t*Math.PI) * 9;
    if(p.jt >= p.jdur){
      p.jumping = false; p.hop = 0;
      p.c = p.jland[0]; p.r = p.jland[1];
      p.tc = p.c; p.tr = p.r; p.x = cx(p.c); p.y = cy(p.r); p.moving = false;
    }
  } else {
    /* steering: queue the pressed direction, apply at the next tile centre */
    let qd = null;
    if(keys.l) qd=[-1,0]; if(keys.r) qd=[1,0]; if(keys.u) qd=[0,-1]; if(keys.d) qd=[0,1];
    if(lastDir==='l'&&keys.l) qd=[-1,0]; else if(lastDir==='r'&&keys.r) qd=[1,0];
    else if(lastDir==='u'&&keys.u) qd=[0,-1]; else if(lastDir==='d'&&keys.d) qd=[0,1];

    /* instant turn-around mid-tile */
    if(qd && p.moving && qd[0]===-p.dx && qd[1]===-p.dy){
      const oc=p.c, or_=p.r; p.c=p.tc; p.r=p.tr; p.tc=oc; p.tr=or_;
      p.dx=qd[0]; p.dy=qd[1];
    }
    const speed = boost>0 ? 2.55 : p.speed;
    if(!p.moving && qd) setTarget(p, qd[0], qd[1]);
    if(!p.moving && (p.dx||p.dy)) setTarget(p, p.dx, p.dy);
    stepMover(p, speed);
  }

  /* bones: 300 points and 3 seconds of speed, exactly as written */
  for(const b of bones){
    if(b.taken) continue;
    if(Math.abs(p.x - cx(b.c)) < 11 && Math.abs(p.y - cy(b.r)) < 11){
      b.taken = true; score += 300; boost = 180;
      puff(cx(b.c), cy(b.r), C.bone, 12); boneNoise();
    }
  }

  /* cats */
  if(!distField || frame % 8 === 0) distField = buildDistField();
  for(const m of cats){
    if(m.wait > 0){ m.wait--; continue; }
    if(!m.moving){
      const best = [];
      const opts = [[1,0],[-1,0],[0,1],[0,-1]];
      let bestD = 1e9;
      for(const [dx,dy] of opts){
        const nc=m.c+dx, nr=m.r+dy;
        if(!walkable(nc,nr)) continue;
        const back = (dx===-m.dx && dy===-m.dy);
        const d = distField[nr][nc];
        if(d < 0) continue;
        const cost = d + (back ? 40 : 0);
        if(cost < bestD){ bestD = cost; best.length = 0; best.push([dx,dy]); }
        else if(cost === bestD) best.push([dx,dy]);
      }
      if(best.length){
        const pick = best[Math.floor(Math.random()*best.length)];
        setTarget(m, pick[0], pick[1]);
      }
    }
    stepMover(m, m.speed);

    if(p.grace<=0 && !p.jumping && Math.hypot(p.x-m.x, p.y-m.y) < 13){
      caughtCount++; score = Math.max(0, score - 100);
      state='caught'; timer=0; shake=16;
      sadNoise(); puff(p.x, p.y, C.hot, 14);
      return;
    }
  }

  /* home */
  if(!p.jumping && Math.abs(p.x - cx(houseCell[0])) < 12 && Math.abs(p.y - cy(houseCell[1])) < 12){
    score += 500 + Math.max(0, 300 - caughtCount*50);
    state='clear'; timer=0; happyNoise();
    puff(cx(houseCell[0]), cy(houseCell[1]), C.house, 18);
    return;
  }

  updateSparks();
}
function updateSparks(){
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.08; s.t--; }
  sparks = sparks.filter(s=>s.t>0);
}

/* ============================================================
   DRAWING
   ============================================================ */
function px(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w|0,h|0); }
function txt(s,x,y,size,col,align){
  ctx.fillStyle=col; ctx.font='bold '+size+'px "Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y);
}
function txtS(s,x,y,size,col,align){
  txt(s,x+1,y+1,size,'rgba(60,40,20,.45)',align); txt(s,x,y,size,col,align);
}

function drawGrass(){
  px(0,GY,W,ROWS*CELL,C.grass);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if((r+c)%2===0) px(GX+c*CELL, GY+r*CELL, CELL, CELL, C.grassLite);
  }
  for(const d of decor){
    const x = cx(d.c), y = cy(d.r);
    if(d.kind==='grass'){
      px(x-4,y+1,2,5,C.grassDark); px(x,y-1,2,7,C.grassDark); px(x+4,y+2,2,4,C.grassDark);
    } else {
      const cols=['#ff8fd0','#ffd93d','#ff9f43','#9775fa'];
      const col = cols[Math.floor(d.v*4)%4];
      px(x-1,y-1,3,3,col); px(x-4,y,2,2,col); px(x+3,y,2,2,col);
      px(x-1,y-4,2,2,col); px(x-1,y+2,2,2,col); px(x,y+4,1,3,C.grassDark);
    }
  }
}

function drawTrack(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(!grid[r][c]) continue;
    const col = RAINBOW[(c*2 + r*3) % RAINBOW.length];
    const x = GX+c*CELL, y = GY+r*CELL;
    px(x, y, CELL, CELL, col);
    /* the little dash Maggie drew in every tile */
    ctx.globalAlpha = 0.55;
    if(walkable(c-1,r) || walkable(c+1,r)) px(x+6, y+9, 8, 2, '#ffffff');
    else px(x+9, y+6, 2, 8, '#ffffff');
    ctx.globalAlpha = 1;
    /* soft edge where the track meets grass */
    ctx.globalAlpha = 0.18;
    if(!walkable(c,r-1)) px(x,y,CELL,2,'#3d2a1a');
    if(!walkable(c,r+1)) px(x,y+CELL-2,CELL,2,'#3d2a1a');
    if(!walkable(c-1,r)) px(x,y,2,CELL,'#3d2a1a');
    if(!walkable(c+1,r)) px(x+CELL-2,y,2,CELL,'#3d2a1a');
    ctx.globalAlpha = 1;
  }
}

function drawBone(x,y,s){
  s = s||1;
  px(x-5*s, y-2*s, 10*s, 3*s, C.bone);
  px(x-7*s, y-4*s, 4*s, 3*s, C.bone); px(x-7*s, y+1*s, 4*s, 3*s, C.bone);
  px(x+3*s, y-4*s, 4*s, 3*s, C.bone); px(x+3*s, y+1*s, 4*s, 3*s, C.bone);
  px(x-5*s, y+1*s, 10*s, 1*s, C.boneDark);
}

function drawHouse(){
  const x = cx(houseCell[0]), y = cy(houseCell[1]);
  px(x-9, y-3, 18, 12, C.house);
  px(x-9, y+7, 18, 2, C.houseDark);
  /* roof */
  for(let i=0;i<6;i++) px(x-9+i, y-3-i, 18-i*2, 1, C.roof);
  px(x-3, y+1, 6, 8, C.doorc);
  px(x+1, y+5, 1, 1, C.house);
  if(frame % 70 < 44) txtS('HOME', x, y-14, 8, C.paper, 'center');
}

function drawPuppy(p){
  const x = p.x, y = p.y - (p.hop||0);
  const bounce = (p.moving||p.jumping) ? Math.sin(p.anim)*1 : 0;
  ctx.save(); ctx.translate(x|0, (y+bounce)|0);
  if(p.dx < 0) ctx.scale(-1,1);

  if(boost > 0){       /* speed lines while a bone is working */
    ctx.globalAlpha = 0.5;
    px(-14,-2,5,2,'#ffffff'); px(-16,3,4,2,'#ffffff');
    ctx.globalAlpha = 1;
  }
  px(-7,-1,14,11,C.dog);            /* head */
  px(-9,-3,5,9,C.dogDark);          /* ears */
  px(4,-3,5,9,C.dogDark);
  px(-4,1,3,3,'#ffffff'); px(1,1,3,3,'#ffffff');
  px(-3,2,2,2,C.ink); px(2,2,2,2,C.ink);
  px(-2,5,4,3,C.dogPale);           /* muzzle */
  px(-1,5,2,2,C.nose);
  px(-1,8,2,2,C.tongue);            /* tongue */
  px(-5,-3,4,3,C.dogDark);          /* head spot */
  if(p.grace>0 && frame%8<4){ ctx.globalAlpha=0.35; px(-9,-4,18,15,'#ffffff'); ctx.globalAlpha=1; }
  ctx.restore();

  if(p.jumping){ ctx.globalAlpha=0.2; px(p.x-6, p.y+7, 12, 3, '#000000'); ctx.globalAlpha=1; }
}

function drawCat(m){
  if(m.wait > 0){
    if(m.wait < 60 && frame%8<4) txtS('!', m.x, m.y-12, 12, C.hot, 'center');
    if(m.wait > 20) return;
  }
  const bounce = m.moving ? Math.sin(m.anim)*1 : 0;
  ctx.save(); ctx.translate(m.x|0, (m.y+bounce)|0);
  if(m.dx < 0) ctx.scale(-1,1);
  px(-6,-1,12,10,C.cat);            /* head */
  px(-6,-5,4,5,C.catDark);          /* pointy ears */
  px(2,-5,4,5,C.catDark);
  px(-4,1,3,3,C.catEye); px(1,1,3,3,C.catEye);
  px(-3,2,1,2,C.ink); px(2,2,1,2,C.ink);
  px(-1,5,2,2,'#ff8fb0');           /* nose */
  px(-9,5,3,1,C.catDark); px(6,5,3,1,C.catDark);   /* whiskers */
  px(-10,-2,4,2,C.cat);             /* tail */
  ctx.restore();
}

function drawHUD(){
  px(0,0,W,GY,'#5a3c78');
  px(0,GY-2,W,2,'#ffb3d9');
  txtS('SCORE '+String(score).padStart(5,'0'), 8, 15, 12, C.paper);
  txtS('LEVEL '+(level+1)+'/'+LEVELS.length, 165, 15, 11, '#ffd93d');

  /* bone timer - the 3 second rule, shown as it drains */
  if(boost>0){
    drawBone(268, 15, 0.8);
    px(280, 11, 60, 8, '#3d2a5a');
    px(281, 12, 58*(boost/180), 6, '#6bd968');
    txtS('FAST!', 355, 15, 11, '#6bd968');
  } else {
    txtS('JUMP', 268, 15, 11, jumpCD>0 ? '#7a6a9a' : '#ffb3d9');
    px(305, 11, 40, 8, '#3d2a5a');
    px(306, 12, 38*(1 - jumpCD/90), 6, jumpCD>0 ? '#7a6a9a' : '#ffb3d9');
  }
  txtS('CAUGHT '+caughtCount, W-8, 15, 11, '#ff8fb0', 'right');
}

function drawTitle(){
  ctx.fillStyle='#bfe8ff'; ctx.fillRect(0,0,W,H);
  px(0,150,W,H-150,C.grass);
  for(let i=0;i<W;i+=8) px(i,150,4,2,C.grassLite);
  /* clouds, like the ones on the map */
  const cl=[[60,40],[190,28],[330,48],[420,34]];
  for(const [x,y] of cl){ px(x,y,26,9,'#ffffff'); px(x+6,y-5,16,8,'#ffffff'); px(x+3,y+7,20,5,'#ffffff'); }

  /* rainbow arc */
  for(let i=0;i<RAINBOW.length;i++){
    ctx.strokeStyle=RAINBOW[i]; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(W/2, 190, 128 - i*5, Math.PI, 0); ctx.stroke();
  }

  txtS('PUPPY', W/2-58, 92, 30, '#ff6b6b', 'center');
  txtS('ESCAPE', W/2+62, 92, 30, '#4dabf7', 'center');
  drawBone(W/2, 92, 1.1);
  /* hearts from the banner */
  px(96,66,4,4,C.hot); px(102,66,4,4,C.hot); px(97,70,10,4,C.hot); px(99,74,6,3,C.hot);
  px(378,66,4,4,C.hot); px(384,66,4,4,C.hot); px(379,70,10,4,C.hot); px(381,74,6,3,C.hot);

  const t = Math.sin(frame*0.05)*10;
  drawPuppy({x:180+t, y:214, dx:1, moving:true, anim:frame*0.2, grace:0});
  drawCat({x:250+t, y:214, dx:1, moving:true, anim:frame*0.2, wait:0});
  drawBone(120+t, 214, 0.9);

  txtS('BONIE PUPPY', 180+t, 236, 9, C.ink, 'center');
  txtS('KAREN CAT', 250+t, 236, 9, C.ink, 'center');
  if(frame%60<38) txtS('PRESS ANY BUTTON TO START', W/2, 268, 13, '#fffaf0', 'center');
  if(best>0) txtS('BEST '+String(best).padStart(5,'0'), 10, 288, 10, '#3d5a2a');
}

function drawHowTo(){
  ctx.fillStyle='#5a3c78'; ctx.fillRect(0,0,W,H);
  px(14,10,W-28,H-20,'#6b4a8a');
  ctx.strokeStyle='#ffb3d9'; ctx.lineWidth=2; ctx.strokeRect(14,10,W-28,H-20);
  txtS('HOW TO PLAY',W/2,32,16,'#ffd93d','center');

  drawPuppy({x:52,y:70,dx:1,moving:false,anim:0,grace:0});
  txtS('You are Bonie. Follow the rainbow', 96, 64, 10, C.paper);
  txtS('track home before Karen gets you.', 96, 78, 10, C.paper);

  drawBone(52, 116, 1.1);
  txtS('A bone is 300 points and makes you', 96, 110, 10, C.paper);
  txtS('fast for 3 seconds.', 96, 124, 10, '#6bd968');

  txtS('JUMP', 38, 158, 12, '#ffb3d9');
  txtS('Hops you two tiles forward, right', 96, 154, 10, C.paper);
  txtS('over a cat. Then it needs a moment.', 96, 168, 10, C.paper);

  drawCat({x:52,y:202,dx:1,moving:false,anim:0,wait:0});
  txtS('Caught? Back to the start and', 96, 196, 10, C.paper);
  txtS('minus 100 points. No lives lost.', 96, 210, 10, '#ff8fb0');

  txtS('KEYBOARD: ARROW KEYS + SPACE TO JUMP', W/2, 240, 9, '#c9a8e0', 'center');
  if(frame%60<38) txtS('PRESS ANY BUTTON', W/2, 266, 13, '#ffd93d', 'center');
}

function drawOverlay(){
  if(state==='clear'){
    px(0,118,W,66,'rgba(45,31,61,.86)');
    txtS('BONIE IS HOME!',W/2,142,20,'#ffd93d','center');
    txtS('SCORE '+String(score).padStart(5,'0'),W/2,168,12,C.paper,'center');
  }
  if(state==='caught'){
    px(0,122,W,58,'rgba(45,31,61,.86)');
    txtS('KAREN GOT YOU!',W/2,142,18,C.hot,'center');
    txtS('BACK TO THE START',W/2,166,11,C.paper,'center');
  }
  if(state==='win'){
    ctx.fillStyle='#bfe8ff'; ctx.fillRect(0,0,W,H);
    px(0,180,W,H-180,C.grass);
    for(let i=0;i<RAINBOW.length;i++){
      ctx.strokeStyle=RAINBOW[i]; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(W/2,210,150-i*5,Math.PI,0); ctx.stroke();
    }
    txtS('BONIE MADE IT HOME!',W/2,70,22,'#ff6b6b','center');
    drawPuppy({x:W/2,y:150,dx:1,moving:true,anim:frame*0.22,grace:0});
    drawBone(W/2-40,150,1); drawBone(W/2+40,150,1);
    txtS('EVERY TRACK, ALL THE WAY HOME',W/2,196,11,C.ink,'center');
    txtS('FINAL SCORE '+String(score).padStart(5,'0'),W/2,224,14,'#3d2a1a','center');
    txtS('CAUGHT '+caughtCount+' TIMES',W/2,246,10,'#3d5a2a','center');
    if(timer>60&&frame%60<38) txtS('PRESS ANY BUTTON',W/2,272,12,'#3d2a1a','center');
  }
  if(state==='play' && hintT>0){
    ctx.globalAlpha = Math.min(1,hintT/60);
    px(0,GY+2,W,28,'rgba(45,31,61,.8)');
    txtS(LEVELS[level].name,W/2,GY+11,11,'#ffd93d','center');
    txtS(LEVELS[level].hint,W/2,GY+24,10,C.paper,'center');
    ctx.globalAlpha = 1;
  }
}

function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  if(shake>0) ctx.translate((Math.random()*2-1)*shake*0.3,(Math.random()*2-1)*shake*0.3);
  ctx.fillStyle='#2d1f3d'; ctx.fillRect(-8,-8,W+16,H+16);

  if(state==='title'){ drawTitle(); return; }
  if(state==='howto'){ drawHowTo(); return; }
  if(state==='win'){ drawOverlay(); return; }

  drawGrass();
  drawTrack();
  drawHouse();
  for(const b of bones) if(!b.taken){
    const bob = Math.sin(frame*0.1 + b.c)*1.5;
    drawBone(cx(b.c), cy(b.r)+bob, 1);
  }
  for(const m of cats) drawCat(m);
  if(state!=='caught' || timer%8<4) drawPuppy(puppy);

  for(const s of sparks){
    ctx.globalAlpha=Math.min(1,s.t/12); px(s.x,s.y,2,2,s.c); ctx.globalAlpha=1;
  }
  drawHUD();
  drawOverlay();
}

/* ---------- loop ---------- */
let last=performance.now(), acc=0;
const STEP=1000/60;
function loop(now){
  requestAnimationFrame(loop);
  acc += Math.min(now-last,100); last=now;
  while(acc>=STEP){ update(); acc-=STEP; }
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
