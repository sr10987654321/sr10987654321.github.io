<!--
  ===========================================================================
  THE ARCADE  —  catalogue page
  ===========================================================================

  WHERE THE GAMES LIVE
  --------------------
  Set BASE below. Right now it points at:
        https://sr10987654321.github.io/games/
  If you ever move the games, change that one line and everything follows.
  Leave BASE as '' to load games sitting in the same folder as this file.

  MISSING GAMES LOOK AFTER THEMSELVES
  -----------------------------------
  On load the page quietly checks each file. Anything that isn't uploaded yet
  goes grey and says "not uploaded yet" instead of giving a dead link. So you
  can put this page up now and the cards switch on by themselves as you add
  the files. (If a check can't run at all — offline, opened off a USB — the
  page assumes the game is fine rather than greying everything out.)

  HOW TO ADD A GAME
  -----------------
  1. Put the .html in the games folder.
  2. Copy any block in the GAMES list near the bottom, paste it, and edit:
        file    : exact filename, e.g. 'my-game.html'
        title   : the game's name
        student : designer's name ('' shows "name to add")
        genre   : one word — a new one gets its own filter button automatically
        blurb   : a sentence or two for the card
        quote   : something the designer actually wrote, in their words
        controls: short reminder of the buttons
        motif   : picture for the poster — one of the names in MOTIFS below
        bg,bg2  : the poster's two background colours
        tc      : the title colour on the poster
  3. Save. The page counts the games and builds the filter buttons itself.
  ===========================================================================
-->
<style>
  :root{
    --ink:#f2eee6; --dim:#a49c92; --line:#2b2733;
    --panel:#181521; --panel2:#211d2c; --hot:#ffd23f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#0e0c14; color:var(--ink);
    font-family:"Trebuchet MS",Verdana,sans-serif;
    padding:0 0 60px; -webkit-text-size-adjust:100%;
  }
  header{
    padding:28px 20px 20px; text-align:center;
    background:linear-gradient(180deg,#241f33,#0e0c14);
    border-bottom:2px solid var(--line);
  }
  h1{
    font-size:clamp(28px,6vw,46px); letter-spacing:.06em;
    color:var(--hot); text-shadow:3px 3px 0 #7a3a10, 6px 6px 0 rgba(0,0,0,.35);
  }
  .sub{margin-top:8px; color:var(--dim); font-size:14px;}
  .count{margin-top:6px; color:var(--dim); font-size:13px;}

  .tools{
    max-width:1180px; margin:20px auto 0; padding:0 16px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center;
  }
  #search{
    flex:1 1 220px; max-width:340px; padding:10px 14px; font-size:15px;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--line); border-radius:10px; outline:none;
  }
  #search:focus{border-color:var(--hot);}
  .chip{
    padding:8px 14px; font-size:13px; font-weight:bold; cursor:pointer;
    background:var(--panel); color:var(--dim);
    border:2px solid var(--line); border-radius:999px; user-select:none;
  }
  .chip:hover{color:var(--ink);}
  .chip.on{background:var(--hot); color:#2a1c04; border-color:var(--hot);}

  .grid{
    max-width:1180px; margin:22px auto 0; padding:0 16px;
    display:grid; gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  }
  .card{
    background:var(--panel); border:2px solid var(--line); border-radius:14px;
    overflow:hidden; display:flex; flex-direction:column;
    text-decoration:none; color:inherit;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--hot);}
  .card.off{opacity:.42; pointer-events:none;}
  .poster{display:block; width:100%; height:auto; background:#000;}
  .body{padding:13px 14px 15px; display:flex; flex-direction:column; gap:7px; flex:1;}
  .name{font-size:18px; font-weight:bold; line-height:1.15;}
  .by{font-size:12.5px; color:var(--hot);}
  .by.none{color:var(--dim); font-style:italic;}
  .blurb{font-size:13px; color:#cdc6bc; line-height:1.45;}
  .quote{
    font-size:12.5px; color:#9f98d0; font-style:italic;
    border-left:3px solid #3d3556; padding-left:9px; line-height:1.4;
  }
  .foot{
    margin-top:auto; padding-top:9px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:8px; align-items:center;
    font-size:11px; color:var(--dim);
  }
  .tag{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:3px 8px; letter-spacing:.05em; text-transform:uppercase; font-weight:bold;
  }
  .missing{color:#e07a6a; font-weight:bold; font-size:11px;}
  .draft{background:#4a2a10; border-color:#7a4a18; color:#ffc27a;}
  .empty{max-width:1180px; margin:40px auto; text-align:center; color:var(--dim); padding:0 16px;}
  footer{max-width:1180px; margin:36px auto 0; padding:0 16px; color:var(--dim);
         font-size:12px; text-align:center; line-height:1.6;}
</style>

/* ======================================================================
   POSTER DRAWING
   ====================================================================== */
function poster(g){
  const W = 300, H = 200;
  const rows = MOTIFS[g.motif] || MOTIFS.star;
  const px = 11, gw = 12 * px, gx = (W - gw) / 2, gy = 34;
  let cells = '';
  for (let y = 0; y < rows.length; y++){
    const row = rows[y];
    for (let x = 0; x < row.length; x++){
      const ch = row[x];
      if (ch === '.') continue;
      const col = ch === 'a' ? g.tc : (ch === 'c' ? '#ffffff' : 'rgba(0,0,0,.55)');
      cells += '<rect x="' + (gx + x * px) + '" y="' + (gy + y * px) + '" width="' + px +
               '" height="' + px + '" fill="' + col + '"/>';
    }
  }
  let stars = '';
  for (let i = 0; i < 26; i++){
    const sx = (i * 97) % W, sy = (i * 61) % H;
    stars += '<rect x="' + sx + '" y="' + sy + '" width="2" height="2" fill="#ffffff" opacity=".14"/>';
  }
  const t = g.title.length > 20 ? g.title.slice(0, 19) + '\u2026' : g.title;
  const fs = t.length > 15 ? 17 : t.length > 11 ? 21 : 25;
  return '<svg class="poster" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(g.title) + ' poster">' +
    '<defs><linearGradient id="bg' + slug(g.file) + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + g.bg2 + '"/><stop offset="1" stop-color="' + g.bg + '"/>' +
    '</linearGradient></defs>' +
    '<rect width="' + W + '" height="' + H + '" fill="url(#bg' + slug(g.file) + ')"/>' + stars +
    '<rect x="0" y="' + (H - 34) + '" width="' + W + '" height="34" fill="rgba(0,0,0,.42)"/>' +
    cells +
    '<text x="' + (W / 2) + '" y="' + (H - 11) + '" text-anchor="middle" font-family="Trebuchet MS,Verdana,sans-serif" ' +
    'font-size="' + fs + '" font-weight="bold" fill="' + g.tc + '" letter-spacing="1">' + esc(t.toUpperCase()) + '</text>' +
    '</svg>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function slug(s){ return s.replace(/[^a-z0-9]/gi, ''); }

const empty = document.getElementById('empty');
let filter = 'All', term = '';

const genres = ['All'].concat([...new Set(GAMES.map(g => g.genre))].sort());
document.getElementById('chips').innerHTML = genres
  .map(n => '<span class="chip' + (n === 'All' ? ' on' : '') + '" data-g="' + esc(n) + '">' + esc(n) + '</span>').join('');
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(o => o.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.g; render();
}));
document.getElementById('search').addEventListener('input', e => {
  term = e.target.value.trim().toLowerCase(); render();
});

function render(){
  const list = GAMES.filter(g => {
    if (filter !== 'All' && g.genre !== filter) return false;
    if (!term) return true;
    return (g.title + ' ' + g.student + ' ' + g.genre + ' ' + g.blurb).toLowerCase().includes(term);
  });
  empty.hidden = list.length > 0;
  grid.innerHTML = list.map(g => {
    const by = g.student
      ? '<div class="by">designed by ' + esc(g.student) + '</div>'
      : '<div class="by none">name to add</div>';
    const q = g.quote ? '<div class="quote">\u201C' + esc(g.quote) + '\u201D</div>' : '';
    const tagCls = g.genre === 'Draft' ? 'tag draft' : 'tag';
    return '<a class="card" data-file="' + esc(g.file) + '" href="' + esc(BASE + g.file) + '">' +
      poster(g) +
      '<div class="body"><div class="name">' + esc(g.title) + '</div>' + by +
      '<div class="blurb">' + esc(g.blurb) + '</div>' + q +
      '<div class="foot"><span class="' + tagCls + '">' + esc(g.genre) + '</span>' +
      '<span class="ctl">' + esc(g.controls) + '</span></div></div></a>';
  }).join('');
  document.getElementById('count').textContent =
    list.length + ' of ' + GAMES.length + ' games' + (filter === 'All' ? '' : ' \u2014 ' + filter);
  applyStatus();
}

/* --- quietly check which files are actually up there ------------------ */
const status = {};                      // file -> true (there) / false (missing)
function applyStatus(){
  document.querySelectorAll('.card').forEach(card => {
    const f = card.dataset.file;
    if (status[f] === false){
      card.classList.add('off');
      const foot = card.querySelector('.ctl');
      if (foot){ foot.textContent = 'not uploaded yet'; foot.className = 'missing'; }
    }
  });
}
async function checkAll(){
  await Promise.all(GAMES.map(async g => {
    try {
      const r = await fetch(BASE + g.file, { method: 'HEAD' });
      status[g.file] = r.status !== 404;   // anything but a clear 404 counts as there
    } catch {
      status[g.file] = true;               // can't check (offline / USB) — assume fine
    }
  }));
  applyStatus();
}

render();
checkAll();
</script>
</body>
