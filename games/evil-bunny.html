<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Evil Bunny</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#2f7ad0;overflow:hidden;
    font-family:"Trebuchet MS","Verdana",sans-serif;color:#f0f4ff;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a6ec0;}
  #stage{position:relative;width:min(100vw, calc(100vh * 4 / 3));
         height:min(100vh, calc(100vw * 3 / 4));}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;
         image-rendering:crisp-edges;background:#3f8fe0;touch-action:none;}
  #pad{position:absolute;inset:auto 0 0 0;height:36%;pointer-events:none;
       display:flex;justify-content:space-between;align-items:flex-end;padding:0 3% 3%;}
  #dpad{position:relative;width:31vmin;height:21vmin;min-width:138px;min-height:94px;pointer-events:auto;}
  .dbtn{position:absolute;width:9.5vmin;height:9.5vmin;min-width:44px;min-height:44px;
        background:#6a4ac0;border:3px solid rgba(16,12,40,.65);border-radius:24%;
        display:flex;align-items:center;justify-content:center;color:#f0ecff;
        font-weight:bold;font-size:3.4vmin;opacity:.82;box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .dbtn:active{opacity:1;transform:translateY(2px);}
  #dup{left:10.5vmin;top:0;} #ddown{left:10.5vmin;bottom:0;}
  #dleft{left:0;top:5.3vmin;} #dright{left:21vmin;top:5.3vmin;}
  .cluster{display:flex;gap:2.4vmin;pointer-events:auto;align-items:flex-end;}
  .btn{width:13vmin;height:13vmin;min-width:56px;min-height:56px;border-radius:50%;
       border:3px solid rgba(40,10,10,.6);display:flex;align-items:center;justify-content:center;
       font-weight:bold;font-size:3vmin;color:#4a1008;opacity:.86;
       box-shadow:0 3px 0 rgba(0,0,0,.3);}
  .btn:active{transform:translateY(2px);opacity:1;}
  .b1{background:#f04a3a;}
  .lbl{position:absolute;bottom:-2.4vmin;left:0;right:0;text-align:center;
       font-size:2.1vmin;color:#dfe8ff;opacity:.9;}
  .btn-wrap{position:relative;}
  #rotate{position:fixed;inset:0;background:#2a6ec0;display:none;
          align-items:center;justify-content:center;text-align:center;padding:24px;
          font-size:20px;line-height:1.5;z-index:50;}
  @media (orientation:portrait) and (max-width:820px){ #rotate{display:flex;} }
  @media (hover:hover) and (pointer:fine){ #pad{display:none;} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="pad">
      <div id="dpad">
        <div class="dbtn" id="dup"    data-k="up">▲</div>
        <div class="dbtn" id="dleft"  data-k="left">◀</div>
        <div class="dbtn" id="dright" data-k="right">▶</div>
        <div class="dbtn" id="ddown"  data-k="down">▼</div>
      </div>
      <div class="cluster">
        <div class="btn-wrap"><div class="btn b1" data-k="jump">JUMP</div><div class="lbl">BUTTON 1</div></div>
      </div>
    </div>
  </div>
</div>
<div id="rotate">Turn your iPad sideways 🦋<br>Evil Bunny plays in landscape.</div>

<script>
"use strict";
/* =========================================================================
   EVIL BUNNY
   Pixel Quest — Hilton Primary School
   "The evil bunny has stolen the great and powerful butterfly. The koala
    needs to save the butterfly."
     1. Do not get hit by the splat.
     2. Kill the bunny with the bunny hammer.
     3. Climb your way up and save the butterfly.
   Single file, no dependencies, offline friendly.
   ========================================================================= */

const BASE_W = 320, BASE_H = 240, SC = 3;
const HUD_H = 26;
const FLOORS = [212, 178, 144, 110, 76];      // 0 = bottom, 4 = the bunny's floor
const LEVELS = 3;

const canvas = document.getElementById('c');
canvas.width = BASE_W * SC; canvas.height = BASE_H * SC;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------------------------------------------------------------- sprites */
function bake(rows, pal){
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c2 = cv.getContext('2d');
  for (let y = 0; y < h; y++){
    const row = rows[y];
    for (let x = 0; x < row.length; x++){
      const col = pal[row[x]];
      if (!col) continue;
      c2.fillStyle = col; c2.fillRect(x, y, 1, 1);
    }
  }
  return { img: cv, w, h };
}

const KOALA = bake([
  "kk........kk",
  "kggk....kggk",
  "kgggkkkkgggk",
  ".kggggggggk.",
  "kggggggggggk",
  "kgwgggggwggk",
  "kggggnnggggk",
  ".kggggggggk.",
  "..kbbbbbbk..",
  ".kbbbbbbbbk.",
  ".kbbbbbbbbk.",
  "..kbbbbbbk..",
  "..kbbkkbbk..",
  "..kbbk.kbbk.",
  "..kkk...kkk.",
], { k:"#20202a", g:"#b8bcc8", w:"#ffffff", n:"#3a3a44", b:"#8e94a4" });

const KOALA_HAMMER = bake([
  "kk........kk",
  "kggk....kggk",
  "kgggkkkkgggk",
  ".kggggggggk.",
  "kggggggggggk",
  "kgwgggggwggk",
  "kggggnnggggk",
  ".kggggggggk.",
  "..kbbbbbbk..",
  ".kbbbbbbbbk.",
  ".kbbbbbbbbk.",
  "..kbbbbbbk..",
  "..kbbkkbbk..",
  "..kbbk.kbbk.",
  "..kkk...kkk.",
], { k:"#20202a", g:"#f0d84a", w:"#ffffff", n:"#3a3a44", b:"#e0b83a" });

const BUNNY = bake([
  "..kk......kk....",
  ".kdk......kdk...",
  ".kdk......kdk...",
  ".kdk......kdk...",
  ".kdkkkkkkkkdk...",
  ".kddddddddddk...",
  "kdddddddddddddk.",
  "kdrddddddddrddk.",
  "kddddddddddddddk",
  "kddwwwwwwwwddk..",
  ".kddddddddddk...",
  "..kdddddddk.....",
  ".kddddddddddk...",
  "kddddddddddddk..",
  ".kdddddddddk....",
  "..kddkkddk......",
  "..kkk..kkk......",
], { k:"#141018", d:"#5a5a66", r:"#e03020", w:"#f0f0f4" });

const BUTTERFLY = bake([
  ".kkk....kkk...",
  "kbbbk..kbbbk..",
  "kbpbkkkbbpbk..",
  "kbbbbkkbbbbk..",
  ".kbbbkkbbbk...",
  "..kbkkkkbk....",
  "...kbkkbk.....",
  "....kkkk......",
], { k:"#1a1a28", b:"#5aa8e8", p:"#a86ad0" });

const SPLAT = bake([
  "...kkkk...",
  ".kkppppkk.",
  "kppppppppk",
  "kppppppppk",
  "kppppppppk",
  "kppppppppk",
  ".kkppppkk.",
  "...kkkk...",
], { k:"#2a1a10", p:"#8a5a3a" });

const HAMMER = bake([
  "..kkkkkk..",
  ".khhhhhhk.",
  "khhhhhhhhk",
  ".khhhhhhk.",
  "..kkkkkk..",
  "....kk....",
  "....kbk...",
  "....kbk...",
  "....kbk...",
  "....kbk...",
  "...kkkk...",
], { k:"#20202a", h:"#c8ccd8", b:"#a06a30" });

/* ------------------------------------------------------------------ audio */
let AC = null;
function initAudio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (A) AC = new A(); }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type, vol, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, AC.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + d);
  g.gain.setValueAtTime(vol == null ? .1 : vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + d + .02);
}
function melody(notes, type, vol){
  if (!AC) return;
  let t = 0;
  notes.forEach(n => { setTimeout(() => tone(n[0], n[1], type || 'square', vol == null ? .1 : vol), t * 1000); t += n[1] * .85; });
}
const SFX = {
  jump:    () => tone(400, .1, 'square', .08, 720),
  hop:     () => melody([[700,.05],[1000,.08]], 'square', .1),
  throw_:  () => tone(200, .1, 'sawtooth', .08, 130),
  pickup:  () => melody([[600,.07],[900,.07],[1200,.14]], 'square', .12),
  smash:   () => { tone(160, .14, 'square', .13, 70); tone(900, .06, 'square', .08); },
  bunny:   () => melody([[520,.1],[380,.1],[260,.24]], 'sawtooth', .14),
  saved:   () => melody([[660,.11],[880,.11],[1046,.11],[1320,.3]], 'square', .13),
  hurt:    () => melody([[380,.14],[260,.2],[170,.3]], 'sawtooth', .14),
  over:    () => melody([[300,.2],[220,.24],[140,.5]], 'triangle', .14),
  start:   () => melody([[520,.09],[700,.09],[930,.16]], 'square', .12),
};

/* ------------------------------------------------------------------ input */
const keys = { up:false, down:false, left:false, right:false, jump:false };
const KEYMAP = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right',
  ' ':'jump', z:'jump', Z:'jump', Enter:'jump'
};
let jumpEdge = false, anyEdge = false;
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k){ e.preventDefault(); if (!keys[k] && k === 'jump') jumpEdge = true; keys[k] = true; anyEdge = true; initAudio(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k){ e.preventDefault(); keys[k] = false; } });

document.querySelectorAll('.dbtn, .btn').forEach(b => {
  const k = b.dataset.k;
  const on  = e => { e.preventDefault(); initAudio(); if (!keys[k] && k === 'jump') jumpEdge = true; keys[k] = true; anyEdge = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); anyEdge = true; });

/* ------------------------------------------------------------------- game */
const LADDERS = [
  { x: 254, lo: 0, hi: 1 },
  { x:  62, lo: 1, hi: 2 },
  { x: 168, lo: 1, hi: 2, broken: true },     // Emily drew a broken ladder
  { x: 248, lo: 2, hi: 3 },
  { x:  88, lo: 3, hi: 4 },
];
const BUNNY_X = 158, CAGE_X = 252, HAMMER_X = 150, HAMMER_FLOOR = 2;

let state = 'title';
let score = 0, best = 0, lives = 3, level = 1;
let splats = [], floats = [], bits = [];
let bunnyAlive = true, bunnyThrowT = 2.4, hammerT = 0, hammerBackT = 0, hammerOut = true;
let invul = 0, flashT = 0, bannerT = 0, bannerText = '', celebrateT = 0;
let jumpedOver = 0, smashed = 0;

const koala = { x: 20, floor: 0, y: 0, w: 12, h: 15, dir: 1, climbing: false, climbY: 0, jumpT: 0 };

function banner(t){ bannerText = t; bannerT = 2.0; }
function addFloat(x, y, text, col){ floats.push({ x, y, text, col: col || '#fff', t: 1.1 }); }
function burst(x, y, n, col){
  for (let i = 0; i < n; i++)
    bits.push({ x, y, vx: (Math.random() - .5) * 110, vy: -Math.random() * 90 - 10, t: .6, col });
}
function floorY(f){ return FLOORS[f]; }
function koalaY(){
  if (koala.climbing) return koala.climbY - koala.h;
  const hop = koala.jumpT > 0 ? Math.sin((1 - koala.jumpT / 0.5) * Math.PI) * 20 : 0;
  return floorY(koala.floor) - koala.h - hop;
}
function airborne(){ return koala.jumpT > 0 && Math.sin((1 - koala.jumpT / 0.5) * Math.PI) * 20 > 5; }

function startLevel(l){
  splats = []; floats = []; bits = [];
  koala.x = 18; koala.floor = 0; koala.climbing = false; koala.jumpT = 0; koala.dir = 1;
  bunnyAlive = true; bunnyThrowT = 2.2;
  hammerT = 0; hammerBackT = 0; hammerOut = true;
  invul = 1.0;
  banner('LEVEL ' + l + ' — SAVE THE BUTTERFLY');
}
function resetGame(){
  score = 0; lives = 3; level = 1; jumpedOver = 0; smashed = 0; celebrateT = 0;
  startLevel(1);
}

function loseLife(reason){
  if (invul > 0) return;
  lives--; invul = 3.0; flashT = 0.4;
  SFX.hurt();
  addFloat(koala.x - 10, koalaY() - 12, reason, '#ff8a7a');
  burst(koala.x + 6, koalaY() + 8, 10, '#b8bcc8');
  if (lives <= 0){
    state = 'over'; best = Math.max(best, score);
    setTimeout(SFX.over, 340);
    return;
  }
  koala.x = 18; koala.floor = 0; koala.climbing = false; koala.jumpT = 0;
  splats = splats.filter(s => s.floor > 1);
}

function ladderHere(){
  for (const L of LADDERS){
    if (L.broken) continue;
    if (Math.abs(L.x - (koala.x + 6)) < 8) return L;
  }
  return null;
}

/* -------------------------------------------------------------- gameplay */
function updatePlay(dt){
  if (bannerT > 0) bannerT -= dt;
  if (invul > 0) invul -= dt;
  if (flashT > 0) flashT -= dt;

  if (celebrateT > 0){
    celebrateT -= dt;
    if (celebrateT <= 0){
      if (level >= LEVELS){
        state = 'win'; best = Math.max(best, score);
        setTimeout(SFX.saved, 200);
      } else { level++; startLevel(level); }
    }
    return;
  }

  // the bunny hammer
  if (hammerT > 0){
    hammerT -= dt;
    if (hammerT <= 0){ hammerBackT = 7; addFloat(koala.x - 12, koalaY() - 12, 'HAMMER GONE', '#c8ccd8'); }
  } else if (!hammerOut){
    hammerBackT -= dt;
    if (hammerBackT <= 0){ hammerOut = true; banner('THE HAMMER IS BACK'); }
  }

  // climbing up and down the ladders
  if (koala.climbing){
    const L = koala.ladder;
    if (keys.up) koala.climbY -= 58 * dt;
    if (keys.down) koala.climbY += 58 * dt;
    koala.x = L.x - 6;
    if (koala.climbY <= floorY(L.hi)){
      koala.climbY = floorY(L.hi); koala.climbing = false; koala.floor = L.hi;
    } else if (koala.climbY >= floorY(L.lo)){
      koala.climbY = floorY(L.lo); koala.climbing = false; koala.floor = L.lo;
    }
  } else {
    if (koala.jumpT > 0) koala.jumpT -= dt;
    let dx = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (dx) koala.dir = dx;
    koala.x += dx * 78 * dt;
    koala.x = Math.max(4, Math.min(BASE_W - koala.w - 4, koala.x));

    const L = ladderHere();
    if (L && koala.jumpT <= 0){
      if (keys.up && koala.floor === L.lo){
        koala.climbing = true; koala.ladder = L; koala.climbY = floorY(L.lo);
      } else if (keys.down && koala.floor === L.hi){
        koala.climbing = true; koala.ladder = L; koala.climbY = floorY(L.hi);
      }
    }
    // Button 1 jumps
    if (jumpEdge && koala.jumpT <= 0){ koala.jumpT = 0.5; SFX.jump(); }
  }
  jumpEdge = false;

  // the evil bunny throws splats down the girders
  if (bunnyAlive){
    bunnyThrowT -= dt;
    if (bunnyThrowT <= 0){
      bunnyThrowT = Math.max(1.3, 3.0 - level * 0.35) + Math.random() * 0.9;
      splats.push({ x: BUNNY_X + 4, floor: 4, dir: 1, wob: 0,
                    speed: 42 + level * 8, onLadder: null });
      SFX.throw_();
    }
  }

  // splats roll along, then drop to the girder below
  for (let i = splats.length - 1; i >= 0; i--){
    const s = splats[i];
    s.wob += dt * 8;
    if (s.onLadder){
      s.ladderY += 60 * dt;
      if (s.ladderY >= floorY(s.onLadder.lo)){
        s.floor = s.onLadder.lo; s.onLadder = null;
        s.dir = Math.random() < .5 ? -1 : 1;
      }
    } else {
      s.x += s.dir * s.speed * dt;
      // sometimes it takes a ladder down
      for (const L of LADDERS){
        if (L.broken || L.hi !== s.floor) continue;
        if (Math.abs(L.x - s.x) < 3 && Math.random() < 0.2){
          s.onLadder = L; s.ladderY = floorY(L.hi);
        }
      }
      if (s.x < 8 || s.x > BASE_W - 16){
        s.x = Math.max(8, Math.min(BASE_W - 16, s.x));
        s.floor--; s.dir *= -1;
        if (s.floor < 0){ splats.splice(i, 1); continue; }
      }
    }

    const sy = (s.onLadder ? s.ladderY : floorY(s.floor)) - 9;
    const ky = koalaY();
    const near = Math.abs(s.x + 5 - (koala.x + 6)) < 11 && Math.abs(sy + 4 - (ky + 8)) < 14;
    if (near){
      if (hammerT > 0){
        smashed++; score += 200;
        addFloat(s.x - 6, sy - 10, 'SMASH +200', '#ffe066');
        burst(s.x + 5, sy + 4, 10, '#8a5a3a');
        SFX.smash();
        splats.splice(i, 1); continue;
      } else if (!airborne()){
        loseLife('SPLAT!');
        if (state !== 'play') return;
      }
    }
    // "do not get hit from the splat" — jumping one is worth points
    if (!s.scored && airborne() && Math.abs(s.x + 5 - (koala.x + 6)) < 12 &&
        s.floor === koala.floor && !s.onLadder){
      s.scored = true; jumpedOver++; score += 100;
      addFloat(koala.x - 8, ky - 12, '+100', '#8ee07a');
      SFX.hop();
    }
  }

  // pick up the bunny hammer
  if (hammerOut && koala.floor === HAMMER_FLOOR && !koala.climbing &&
      Math.abs(HAMMER_X - (koala.x + 6)) < 12){
    hammerOut = false; hammerT = 13;
    score += 100;
    addFloat(koala.x - 12, koalaY() - 14, 'BUNNY HAMMER!', '#ffe066');
    SFX.pickup();
  }

  // the bunny blocks the way to the cage
  if (bunnyAlive && koala.floor === 4 && !koala.climbing &&
      Math.abs(BUNNY_X + 7 - (koala.x + 6)) < 14){
    if (hammerT > 0){
      bunnyAlive = false; score += 1000;
      addFloat(BUNNY_X - 8, floorY(4) - 34, 'BUNNY DOWN! +1000', '#ffe066');
      burst(BUNNY_X + 8, floorY(4) - 12, 20, '#5a5a66');
      SFX.bunny();
      banner('THE EVIL BUNNY IS BEATEN!');
    } else {
      loseLife('THE BUNNY!');
      if (state !== 'play') return;
    }
  }

  // save the butterfly
  if (!bunnyAlive && koala.floor === 4 && !koala.climbing &&
      Math.abs(CAGE_X + 6 - (koala.x + 6)) < 14){
    score += 2000;
    celebrateT = 2.6;
    banner('BUTTERFLY SAVED!  +2000');
    SFX.saved();
    return;
  }

  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.t -= dt; f.y -= 16 * dt;
    if (f.t <= 0) floats.splice(i, 1);
  }
  for (let i = bits.length - 1; i >= 0; i--){
    const b = bits[i]; b.t -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 220 * dt;
    if (b.t <= 0) bits.splice(i, 1);
  }
}

/* ------------------------------------------------------------------ paint */
function drawGirders(){
  FLOORS.forEach((y, i) => {
    ctx.fillStyle = '#2a2a34'; ctx.fillRect(0, y, BASE_W, 7);
    ctx.fillStyle = '#4a4a58'; ctx.fillRect(0, y, BASE_W, 2);
    // the dotted girder texture from Emily's plan
    ctx.fillStyle = '#6a6a7a';
    for (let x = 4; x < BASE_W; x += 11) ctx.fillRect(x, y + 3, 3, 2);
    void i;
  });
}
function drawLadders(){
  LADDERS.forEach(L => {
    const top = floorY(L.hi), bot = floorY(L.lo);
    const h = L.broken ? (bot - top) * 0.45 : (bot - top);
    const yStart = bot - h;
    ctx.fillStyle = L.broken ? '#8a6a4a' : '#c8b06a';
    ctx.fillRect(L.x - 7, yStart, 3, h + 7);
    ctx.fillRect(L.x + 4, yStart, 3, h + 7);
    for (let y = yStart + 4; y < bot + 6; y += 8) ctx.fillRect(L.x - 7, y, 14, 2);
    if (L.broken){
      ctx.fillStyle = '#e05a4a';
      ctx.font = 'bold 7px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BROKEN', L.x, yStart - 9);
      ctx.textAlign = 'left';
    }
  });
}
function drawPlay(){
  // sky, with the heart and star from the cabinet art
  ctx.fillStyle = '#3f8fe0'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#5aa4ea';
  for (let i = 0; i < 30; i++) ctx.fillRect((i * 83) % BASE_W, HUD_H + (i * 61) % (BASE_H - HUD_H), 2, 2);
  ctx.fillStyle = '#e0405a';
  ctx.fillRect(28, 40, 4, 5); ctx.fillRect(34, 40, 4, 5);
  ctx.fillRect(27, 45, 12, 3); ctx.fillRect(29, 48, 8, 2); ctx.fillRect(31, 50, 4, 2);
  ctx.fillStyle = '#f0d84a';
  ctx.fillRect(288, 46, 2, 10); ctx.fillRect(284, 50, 10, 2);

  drawLadders();
  drawGirders();

  // the cage with the great and powerful butterfly
  const cy = floorY(4) - 26;
  ctx.fillStyle = 'rgba(20,20,32,0.28)'; ctx.fillRect(CAGE_X - 3, cy - 3, 28, 28);
  ctx.drawImage(BUTTERFLY.img, CAGE_X, cy + 6);
  ctx.fillStyle = '#c8ccd8';
  for (let i = 0; i < 5; i++) ctx.fillRect(CAGE_X - 2 + i * 6, cy, 2, 26);
  ctx.fillRect(CAGE_X - 2, cy - 2, 28, 3);
  ctx.fillRect(CAGE_X - 2, cy + 24, 28, 3);

  if (bunnyAlive) ctx.drawImage(BUNNY.img, BUNNY_X, floorY(4) - 17);

  if (hammerOut) ctx.drawImage(HAMMER.img, HAMMER_X - 5, floorY(HAMMER_FLOOR) - 13);

  splats.forEach(s => {
    const sy = (s.onLadder ? s.ladderY : floorY(s.floor)) - 9;
    ctx.drawImage(SPLAT.img, Math.round(s.x), Math.round(sy + Math.sin(s.wob) * 0.8));
  });

  const hide = invul > 0 && Math.floor(invul * 12) % 2 === 0;
  if (!hide){
    const spr = hammerT > 0 ? KOALA_HAMMER : KOALA;
    ctx.save();
    const kx = Math.round(koala.x), ky = Math.round(koalaY());
    if (koala.dir < 0){ ctx.translate(kx + spr.w, ky); ctx.scale(-1, 1); ctx.drawImage(spr.img, 0, 0); }
    else ctx.drawImage(spr.img, kx, ky);
    ctx.restore();
    if (hammerT > 0){
      const hx = kx + (koala.dir > 0 ? 10 : -6);
      ctx.drawImage(HAMMER.img, hx, ky - 2);
    }
  }

  bits.forEach(b => { ctx.fillStyle = b.col; ctx.fillRect(Math.round(b.x), Math.round(b.y), 2, 2); });

  ctx.font = 'bold 9px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.t);
    ctx.fillStyle = '#141020'; ctx.fillText(f.text, Math.round(f.x) + 1, Math.round(f.y) + 1);
    ctx.fillStyle = f.col; ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
    ctx.globalAlpha = 1;
  });

  if (flashT > 0){
    ctx.fillStyle = 'rgba(220,60,50,' + (flashT * 0.6).toFixed(2) + ')';
    ctx.fillRect(0, HUD_H, BASE_W, BASE_H - HUD_H);
  }

  drawHUD();
  if (bannerT > 0 || celebrateT > 0){
    ctx.globalAlpha = Math.min(1, Math.max(bannerT, celebrateT));
    centreText(bannerText, 60, 14, '#ffe066', '#141020');
    ctx.globalAlpha = 1;
  }
}

function drawHeart(x, y, on){
  ctx.fillStyle = on ? '#e0405a' : '#3a3a4a';
  ctx.fillRect(x, y + 1, 3, 4); ctx.fillRect(x + 5, y + 1, 3, 4);
  ctx.fillRect(x + 1, y, 2, 1); ctx.fillRect(x + 6, y, 2, 1);
  ctx.fillRect(x + 1, y + 5, 6, 1);
  ctx.fillRect(x + 2, y + 6, 4, 1);
  ctx.fillRect(x + 3, y + 7, 2, 1);
}
function drawHUD(){
  ctx.fillStyle = '#141a2e'; ctx.fillRect(0, 0, BASE_W, HUD_H);
  ctx.fillStyle = '#6a4ac0'; ctx.fillRect(0, HUD_H - 2, BASE_W, 2);
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffe066'; ctx.fillText('SCORE ' + score, 5, 3);
  ctx.fillStyle = '#8ee07a'; ctx.fillText('JUMPED ' + jumpedOver, 5, 15);

  ctx.fillStyle = '#dfe8ff'; ctx.fillText('LIVES', 120, 3);
  for (let i = 0; i < 3; i++) drawHeart(120 + i * 12, 15, i < lives);

  ctx.fillStyle = '#dfe8ff'; ctx.fillText('LEVEL ' + level + '/' + LEVELS, 176, 3);
  if (hammerT > 0){
    ctx.fillStyle = '#ffe066'; ctx.fillText('HAMMER', 176, 15);
    ctx.fillStyle = '#3a3a4a'; ctx.fillRect(230, 16, 40, 6);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(230, 16, Math.round(40 * (hammerT / 13)), 6);
  } else {
    ctx.fillStyle = hammerOut ? '#c8ccd8' : '#6a6a7a';
    ctx.fillText(hammerOut ? 'HAMMER ON FLOOR 3' : 'HAMMER BACK SOON', 176, 15);
  }
}

function centreText(text, y, size, fill, outline){
  ctx.font = 'bold ' + size + 'px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (outline){ ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.strokeText(text, BASE_W / 2, y); }
  ctx.fillStyle = fill; ctx.fillText(text, BASE_W / 2, y);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

function skyBackdrop(){
  ctx.fillStyle = '#3f8fe0'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#5aa4ea';
  for (let i = 0; i < 60; i++) ctx.fillRect((i * 71) % BASE_W, (i * 53) % BASE_H, 2, 2);
  ctx.fillStyle = '#2a2a34'; ctx.fillRect(0, 206, BASE_W, 7);
  ctx.fillStyle = '#6a6a7a';
  for (let x = 4; x < BASE_W; x += 11) ctx.fillRect(x, 209, 3, 2);
}

function drawTitle(){
  skyBackdrop();
  centreText('EVIL BUNNY', 52, 32, '#8b6ad6', '#f0ecff');
  centreText('The evil bunny has stolen the great', 84, 10, '#f0f4ff', '#141020');
  centreText('and powerful butterfly. The koala', 97, 10, '#f0f4ff', '#141020');
  centreText('needs to save the butterfly.', 110, 10, '#ffe066', '#141020');

  ctx.drawImage(KOALA.img, 60, 176);
  ctx.drawImage(HAMMER.img, 78, 178);
  ctx.drawImage(BUNNY.img, 236, 172);
  const cy = 150;
  ctx.drawImage(BUTTERFLY.img, 152, cy + 6);
  ctx.fillStyle = '#c8ccd8';
  for (let i = 0; i < 5; i++) ctx.fillRect(150 + i * 6, cy, 2, 26);
  ctx.fillRect(150, cy - 2, 28, 3); ctx.fillRect(150, cy + 24, 28, 3);

  centreText('Pixel Quest — Hilton Primary School', 132, 9, '#cfe0ff', '#141020');
  const pulse = .6 + .4 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = pulse;
  centreText('PRESS BUTTON 1 (or tap) TO START', 226, 11, '#8ee07a', '#141020');
  ctx.globalAlpha = 1;
}

function drawOver(){
  skyBackdrop();
  ctx.fillStyle = 'rgba(14,12,32,0.62)'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  centreText('THE BUNNY WINS', 56, 26, '#e0405a', '#141020');
  ctx.drawImage(BUNNY.img, 152, 88);
  centreText('SCORE ' + score, 130, 20, '#ffe066', '#141020');
  centreText('SPLATS JUMPED ' + jumpedOver + '   •   SMASHED ' + smashed, 152, 10, '#8ee07a', '#141020');
  centreText('REACHED LEVEL ' + level + '   •   BEST ' + best, 168, 10, '#cfe0ff', '#141020');
  const pulse = .6 + .4 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = pulse;
  centreText('PRESS BUTTON 1 (or tap) TO TRY AGAIN', 204, 11, '#8ee07a', '#141020');
  ctx.globalAlpha = 1;
}

function drawWin(){
  skyBackdrop();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(0, 0, BASE_W, BASE_H);
  centreText('BUTTERFLY SAVED!', 54, 24, '#6a4ac0', '#f0ecff');
  ctx.drawImage(KOALA.img, 132, 96);
  ctx.drawImage(BUTTERFLY.img, 158, 100);
  centreText('The great and powerful butterfly is free.', 84, 10, '#141020');
  centreText('FINAL SCORE ' + score, 140, 20, '#c05a10', '#fff6d0');
  centreText('SPLATS JUMPED ' + jumpedOver + '   •   SMASHED ' + smashed, 162, 10, '#141020');
  const pulse = .6 + .4 * Math.sin(performance.now() / 260);
  ctx.globalAlpha = pulse;
  centreText('PRESS BUTTON 1 (or tap) TO PLAY AGAIN', 204, 11, '#1a4a10', '#f0ffe0');
  ctx.globalAlpha = 1;
}

/* -------------------------------------------------------------- main loop */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;

function update(dt){
  if (state === 'play') updatePlay(dt);
  else {
    const go = jumpEdge || anyEdge;
    jumpEdge = false; anyEdge = false;
    if (go){ initAudio(); SFX.start(); resetGame(); state = 'play'; }
  }
  anyEdge = false;
}
function render(){
  ctx.save();
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'play') drawPlay();
  else if (state === 'over') drawOver();
  else if (state === 'win') drawWin();
  ctx.restore();
}
function frame(now){
  let delta = (now - last) / 1000; last = now;
  if (delta > 0.25) delta = 0.25;
  acc += delta;
  let steps = 0;
  while (acc >= STEP && steps < 5){ update(STEP); acc -= STEP; steps++; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
