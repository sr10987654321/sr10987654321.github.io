<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eef3ff;background:#090e18}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #283348;padding:18px 4%;background:#101725;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:2px;font-size:22px}.logo span{color:#edbf69}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#e7ba66;border:0;border-radius:9px;color:#111827;padding:11px 15px;font-weight:750;cursor:pointer}button.secondary{background:#273449;color:#e7efff}button:disabled{opacity:.45;cursor:wait}main{max-width:1240px;margin:30px auto;padding:0 18px}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.6px;margin:0 0 8px}h2{font-size:21px}p,small{color:#aab7cc}.sub{color:#e5bf78;text-transform:uppercase;font-size:11px;letter-spacing:2px}.panel{background:#141e2e;border:1px solid #2b3950;border-radius:17px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.metric{font-size:35px;color:#efc579;font-weight:900}.muted{color:#9eaec4}input,textarea,select{background:#0b1320;color:#f4f6ff;border:1px solid #40506a;border-radius:8px;padding:12px;width:100%;font:inherit;margin:6px 0 12px}textarea{min-height:100px}label{font-size:13px;color:#bcc9da}.q{border-left:3px solid #e6b966;padding:14px;background:#1c293b;margin:12px 0;border-radius:8px}.pill{display:inline-block;border-radius:30px;background:#33435b;color:#f1cb8b;padding:4px 9px;font-size:11px}.bar{height:11px;background:#2c3b50;border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar>div{height:100%;background:linear-gradient(90deg,#db9e51,#f5dba0)}.hidden{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #2b3950;text-align:left}th{color:#e9c680}#msg{position:fixed;bottom:20px;right:20px;background:#2c3c51;padding:14px;border-radius:10px;max-width:400px;z-index:10}.paper{display:none}@media(max-width:650px){.split{grid-template-columns:1fr}header{align-items:flex-start;gap:10px;flex-direction:column}}@media print{header,main,#msg{display:none!important}.paper{display:block!important;background:white;color:black;font:13pt Georgia,serif;padding:12mm}.paper h1{font-size:22pt}.paper .pq{margin:20px 0;page-break-inside:avoid}.lines{height:75px;border-bottom:1px solid #aaa;background:repeating-linear-gradient(white,white 24px,#ccc 25px)}.pagebreak{page-break-before:always}}
</style></head><body><header><div class="logo">READ<span>//</span>DECK <small> / SHEETS</small></div><nav><button class="secondary" onclick="show('student')">STUDENT</button><button class="secondary" onclick="show('teacher')">TEACHER</button></nav></header><main>
<section id="student"><div class="sub">STUDENT PORTAL</div><h1>Ready to read?</h1><div class="panel" id="login"><label>Choose your name</label><select id="studentId"></select><label>Your PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="4–8 digit PIN"><button onclick="enterStudent()">Open my assessments →</button></div><div id="studentTasks"></div></section>
<section id="teacher" class="hidden"><div class="sub">TEACHER CONTROL ROOM</div><h1>Reading intelligence.</h1><div class="panel" id="teacherLogin"><label>Teacher password</label><input id="teacherPass" type="password" placeholder="Teacher password (12+ characters)"><div class="row"><button onclick="openTeacher()">Sign in</button><button class="secondary" onclick="firstSetup()">First-time setup</button></div><small>For a pilot only. Use school-approved hosting and identity controls for real student data.</small></div><div id="adminUI" class="hidden"><nav><button class="secondary" onclick="tab('dashboard')">DATA DECK</button><button class="secondary" onclick="tab('studio')">STORY STUDIO</button><button class="secondary" onclick="tab('roster')">STUDENTS</button><button class="secondary" onclick="tab('import')">PAPER / CSV</button><button class="secondary" onclick="refresh()">↻ REFRESH</button></nav><div id="dashboard"></div><div id="studio" class="hidden"></div><div id="roster" class="hidden"></div><div id="import" class="hidden"></div></div></section></main><div id="printArea" class="paper"></div><div id="msg" class="hidden"></div>
<script>
const $=x=>document.getElementById(x);let pass='',data=null,selectedStudent='',studentPin='',assessment=null,questions=[];const skills=['Retrieval','Inference','Vocabulary','Text structure','Author craft','Evaluating'];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function toast(t){$('msg').textContent=t;$('msg').classList.remove('hidden');setTimeout(()=>$('msg').classList.add('hidden'),5000)}function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||e)))[fn](...args))}function show(n){['student','teacher'].forEach(x=>$(x).classList.toggle('hidden',x!==n))}function tab(n){['dashboard','studio','roster','import'].forEach(x=>$(x).classList.toggle('hidden',x!==n))}async function start(){try{let x=await call('catalogue');$('studentId').innerHTML='<option value="">Select student</option>'+x.students.map(s=>`<option value="${esc(s.studentId)}">${esc(s.name)}</option>`).join('')}catch(e){toast(e.message)}}async function firstSetup(){try{await call('initTeacher',$('teacherPass').value);toast('Password created. Sign in now.')}catch(e){toast(e.message)}}async function openTeacher(){pass=$('teacherPass').value;await refresh();$('teacherLogin').classList.add('hidden');$('adminUI').classList.remove('hidden')}async function refresh(){try{data=await call('admin','overview',pass,{});renderDashboard();renderStudio();renderRoster();renderImport()}catch(e){toast(e.message)}}async function enterStudent(){try{selectedStudent=$('studentId').value;studentPin=$('pin').value;const x=await call('studentData',selectedStudent,studentPin);$('login').classList.add('hidden');$('studentTasks').innerHTML=`<div class="panel"><h2>Choose an assessment</h2>${x.assessments.length?x.assessments.map((a,i)=>`<button class="secondary" onclick="launch(${i})">${esc(a.title)} · Year ${esc(a.year)}</button> `).join(''):'All published assessments completed.'}</div>`;window.available=x.assessments}catch(e){toast(e.message)}}function launch(i){assessment=window.available[i];$('studentTasks').innerHTML=`<div class="sub">${esc(assessment.title)}</div><div class="panel"><h2>Reading passage</h2><div style="white-space:pre-wrap;line-height:1.75">${esc(assessment.story)}</div></div><form id="answers">${assessment.questions.map(q=>`<div class="panel"><div class="pill">QUESTION ${q.number}</div><h2>${esc(q.prompt)}</h2>${q.type==='mcq'?q.options.map(o=>`<label style="display:block;padding:8px"><input style="width:auto" type="radio" name="${q.questionId}" value="${esc(o)}"> ${esc(o)}</label>`).join(''):`<textarea name="${q.questionId}" placeholder="Write your answer"></textarea>`}</div>`).join('')}<button type="submit">Submit my answers</button></form>`;$('answers').onsubmit=async e=>{e.preventDefault();const answers={};assessment.questions.forEach(q=>{let els=document.getElementsByName(q.questionId);answers[q.questionId]=q.type==='mcq'?[...els].find(x=>x.checked)?.value||'':els[0].value});try{await call('submit',selectedStudent,studentPin,assessment.assessmentId,answers);$('studentTasks').innerHTML='<div class="panel"><h1>Submitted ✓</h1><p>Your teacher can see your results.</p><button onclick="location.reload()">Finish</button></div>'}catch(err){toast(err.message)}}}
function renderDashboard(){let rs=data.responses.filter(r=>r.status==='marked'),total=rs.reduce((s,r)=>s+Number(r.maxPoints),0),earned=rs.reduce((s,r)=>s+Number(r.points),0),pct=total?Math.round(100*earned/total):0;let grouped=skills.map(skill=>{let ids=new Set(data.questions.filter(q=>q.skill===skill).map(q=>q.questionId)),items=rs.filter(r=>ids.has(r.questionId)),max=items.reduce((s,r)=>s+Number(r.maxPoints),0);return {skill,pct:max?Math.round(items.reduce((s,r)=>s+Number(r.points),0)/max*100):null,count:items.length}});$('dashboard').innerHTML=`<div class="grid"><div class="panel"><div class="sub">CLASS ACCURACY</div><div class="metric">${pct}%</div></div><div class="panel"><div class="sub">STUDENTS</div><div class="metric">${data.students.length}</div></div><div class="panel"><div class="sub">SUBMISSIONS</div><div class="metric">${data.submissions.length}</div></div><div class="panel"><div class="sub">AWAITING REVIEW</div><div class="metric">${data.responses.filter(r=>r.status==='review').length}</div></div></div><div class="split"><div class="panel"><h2>SKILL INTELLIGENCE</h2>${grouped.map(x=>`<div>${esc(x.skill)} <span class="muted">${x.pct===null?'No data':x.pct+'%'} · ${x.count} responses</span><div class="bar"><div style="width:${x.pct||0}%"></div></div></div>`).join('')}</div><div class="panel"><h2>STUDENT SIGNALS</h2><label>Choose student</label><select id="profileStudent" onchange="renderProfile(this.value)"><option value="">Choose…</option>${data.students.map(s=>`<option value="${s.studentId}">${esc(s.name)}</option>`).join('')}</select><div id="profile"></div></div></div><div class="panel"><h2>WRITTEN ANSWERS TO REVIEW</h2>${data.responses.filter(r=>r.status==='review').map(r=>{let q=data.questions.find(q=>q.questionId===r.questionId),s=data.students.find(s=>s.studentId===r.studentId);return `<div class="q"><b>${esc(s?.name)} · ${esc(q?.skill)}</b><p>${esc(q?.prompt)}</p><p>Answer: ${esc(r.answer)}</p><label>Score / ${r.maxPoints}</label><input type="number" id="score_${r.responseId}" min="0" max="${r.maxPoints}" step="0.5" value="0"><input id="feedback_${r.responseId}" placeholder="Optional feedback"><button onclick="mark('${r.responseId}')">Save mark</button></div>`}).join('')||'<p>No responses awaiting marking.</p>'}</div>`}
function renderProfile(sid){let rs=data.responses.filter(r=>r.studentId===sid&&r.status==='marked');let html=skills.map(skill=>{let ids=new Set(data.questions.filter(q=>q.skill===skill).map(q=>q.questionId)),rr=rs.filter(r=>ids.has(r.questionId)),max=rr.reduce((s,r)=>s+Number(r.maxPoints),0),p=max?Math.round(rr.reduce((s,r)=>s+Number(r.points),0)/max*100):null;return `<div>${esc(skill)} · ${p===null?'—':p+'%'}<div class="bar"><div style="width:${p||0}%"></div></div></div>`}).join('');$('profile').innerHTML=html}async function mark(id){try{await call('admin','mark',pass,{responseId:id,points:Number($('score_'+id).value),feedback:$('feedback_'+id).value});await refresh()}catch(e){toast(e.message)}}
function renderRoster(){$('roster').innerHTML=`<div class="panel"><h2>Add student</h2><label>Name</label><input id="newName"><label>Private student PIN (4–8 digits)</label><input id="newPin" inputmode="numeric"><button onclick="addStudent()">Add student</button></div><div class="panel"><h2>Roster</h2><table><tr><th>Name</th><th>Student ID</th></tr>${data.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.studentId)}</td></tr>`).join('')}</table></div>`}async function addStudent(){try{await call('admin','student',pass,{name:$('newName').value,pin:$('newPin').value});await refresh();await start();toast('Student added')}catch(e){toast(e.message)}}
function renderStudio(){$('studio').innerHTML=`<div class="panel"><h2>Create an assessment</h2><label>Title</label><input id="aTitle" placeholder="The Great Waterslide Scandal"><label>Year level</label><select id="aYear">${[3,4,5,6].map(x=>`<option ${x===4?'selected':''}>${x}</option>`).join('')}</select><label>Paste story</label><textarea id="aStory" style="min-height:180px"></textarea><h2>Questions</h2><div id="qEditor"></div><button class="secondary" onclick="addQuestion()">+ Add question</button> <button onclick="saveAssessment()">Save assessment</button></div><div class="panel"><h2>Assessments</h2>${data.assessments.map(a=>`<div class="q"><b>${esc(a.title)}</b> <span class="pill">${a.published?'PUBLISHED':'DRAFT'}</span><p>${esc(a.assessmentId)} · Year ${a.year}</p><button class="secondary" onclick="printAssessment('${a.assessmentId}')">Print paper version</button> <button onclick="publish('${a.assessmentId}',${String(a.published)!=='true'})">${String(a.published)==='true'?'Unpublish':'Publish'}</button></div>`).join('')}</div>`;questions=[];addQuestion()}
function addQuestion(){let i=questions.length;questions.push(i);$('qEditor').insertAdjacentHTML('beforeend',`<div class="q" id="qe${i}"><b>Question ${i+1}</b><label>Prompt</label><textarea id="qp${i}" style="min-height:65px"></textarea><div class="split"><div><label>Type</label><select id="qt${i}"><option value="mcq">Multiple choice</option><option value="written">Written</option></select></div><div><label>Skill</label><select id="qs${i}">${skills.map(s=>`<option>${s}</option>`).join('')}</select></div></div><label>Options for multiple choice (one per line)</label><textarea id="qo${i}" placeholder="Option A&#10;Option B&#10;Option C" style="min-height:80px"></textarea><label>Correct option (exact text), or written answer guide</label><input id="qa${i}"><div class="split"><div><label>Difficulty 1–5</label><input type="number" min="1" max="5" value="3" id="qd${i}"></div><div><label>Max points</label><input type="number" min="1" max="10" value="1" id="qm${i}"></div></div></div>`)}async function saveAssessment(){try{let q=questions.map(i=>({prompt:$('qp'+i).value,type:$('qt'+i).value,skill:$('qs'+i).value,options:$('qo'+i).value.split('\n').map(s=>s.trim()).filter(Boolean),answer:$('qa'+i).value,difficulty:$('qd'+i).value,maxPoints:$('qm'+i).value}));await call('admin','assessment',pass,{title:$('aTitle').value,year:$('aYear').value,story:$('aStory').value,questions:q});await refresh();toast('Assessment saved as draft')}catch(e){toast(e.message)}}async function publish(a,published){try{await call('admin','publish',pass,{assessmentId:a,published});await refresh()}catch(e){toast(e.message)}}
function printAssessment(aid){let a=data.assessments.find(x=>x.assessmentId===aid),q=data.questions.filter(x=>x.assessmentId===aid).sort((x,y)=>x.number-y.number);$('printArea').innerHTML=`<h1>${esc(a.title)}</h1><p>Student: __________________________ Date: ______________</p><p>Assessment ID: ${esc(aid)}</p><div style="white-space:pre-wrap;line-height:1.6">${esc(a.story)}</div><div class="pagebreak"></div><h1>${esc(a.title)} — Questions</h1><p>Student ID: __________________________</p>${q.map(x=>`<div class="pq"><b>${x.number}. ${esc(x.prompt)}</b>${x.type==='mcq'?JSON.parse(x.optionsJson||'[]').map((o,i)=>`<p>◯ ${String.fromCharCode(65+i)}. ${esc(o)}</p>`).join(''):'<div class="lines"></div>'}</div>`).join('')}`;window.print()}
function renderImport(){$('import').innerHTML=`<div class="panel"><h2>Paper scan → CSV import</h2><p>Scan the completed papers, have an approved AI tool transcribe and propose marks, then review its CSV before importing. Required columns: <b>studentId,assessmentId,questionId,answer,points</b>.</p><p>Use the exact IDs shown in the roster and question map below. Do not upload identifiable student work to an unapproved external AI service.</p><input type="file" id="csvFile" accept=".csv,text/csv"><button onclick="previewCsv()">Preview CSV</button><div id="csvPreview"></div></div><div class="panel"><h2>Question ID map</h2><table><tr><th>Assessment</th><th>Question ID</th><th>Skill</th><th>Max points</th></tr>${data.questions.map(q=>`<tr><td>${esc(q.assessmentId)}</td><td>${esc(q.questionId)}</td><td>${esc(q.skill)}</td><td>${esc(q.maxPoints)}</td></tr>`).join('')}</table><button class="secondary" onclick="downloadTemplate()">Download CSV template</button></div>`}function downloadTemplate(){download('readdeck-import-template.csv','studentId,assessmentId,questionId,answer,points\n')}function download(name,txt){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}let csvText='';async function previewCsv(){let f=$('csvFile').files[0];if(!f)return toast('Choose a CSV');csvText=await f.text();let lines=csvText.trim().split(/\r?\n/);$('csvPreview').innerHTML=`<p>${lines.length-1} data rows detected. Check the file carefully before importing.</p><pre style="white-space:pre-wrap;overflow:auto">${esc(lines.slice(0,7).join('\n'))}</pre><button onclick="commitCsv()">Confirm import to Google Sheets</button>`}async function commitCsv(){if(!confirm('Import reviewed results? This writes to the Google Sheet.'))return;try{let r=await call('admin','import',pass,{csv:csvText});toast(r.count+' responses imported');await refresh()}catch(e){toast(e.message)}}start();setInterval(()=>{if(pass&&data&&!$('teacher').classList.contains('hidden')&&!$('dashboard').classList.contains('hidden'))refresh()},15000);
</script></body></html>
