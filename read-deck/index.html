<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>

:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eef3ff;background:#090e18}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #283348;padding:18px 4%;background:#101725;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:2px;font-size:22px}.logo span{color:#edbf69}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#e7ba66;border:0;border-radius:9px;color:#111827;padding:11px 15px;font-weight:750;cursor:pointer}button.secondary{background:#273449;color:#e7efff}button:disabled{opacity:.45;cursor:wait}main{max-width:1240px;margin:30px auto;padding:0 18px}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.6px;margin:0 0 8px}h2{font-size:21px}p,small{color:#aab7cc}.sub{color:#e5bf78;text-transform:uppercase;font-size:11px;letter-spacing:2px}.panel{background:#141e2e;border:1px solid #2b3950;border-radius:17px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.metric{font-size:35px;color:#efc579;font-weight:900}.muted{color:#9eaec4}input,textarea,select{background:#0b1320;color:#f4f6ff;border:1px solid #40506a;border-radius:8px;padding:12px;width:100%;font:inherit;margin:6px 0 12px}textarea{min-height:100px}label{font-size:13px;color:#bcc9da}.q{border-left:3px solid #e6b966;padding:14px;background:#1c293b;margin:12px 0;border-radius:8px}.pill{display:inline-block;border-radius:30px;background:#33435b;color:#f1cb8b;padding:4px 9px;font-size:11px}.bar{height:11px;background:#2c3b50;border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar>div{height:100%;background:linear-gradient(90deg,#db9e51,#f5dba0)}.hidden{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid #2b3950;text-align:left}th{color:#e9c680}#msg{position:fixed;bottom:20px;right:20px;background:#2c3c51;padding:14px;border-radius:10px;max-width:400px;z-index:10}.paper{display:none}@media(max-width:650px){.split{grid-template-columns:1fr}header{align-items:flex-start;gap:10px;flex-direction:column}}@media print{header,main,#msg{display:none!important}.paper{display:block!important;background:white;color:black;font:13pt Georgia,serif;padding:12mm}.paper h1{font-size:22pt}.paper .pq{margin:20px 0;page-break-inside:avoid}.lines{height:75px;border-bottom:1px solid #aaa;background:repeating-linear-gradient(white,white 24px,#ccc 25px)}.pagebreak{page-break-before:always}}



.skill-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:middle}.skill-meter{height:10px;background:#29364a;border-radius:20px;overflow:hidden;margin:8px 0}.skill-meter span{display:block;height:100%;border-radius:20px}.int-card{border:1px solid #30405a;background:#172338;border-radius:13px;padding:16px;margin:12px 0}.int-card button{margin:6px 5px 0 0}.tiny{font-size:12px;color:#aab7cc}.int-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.int-row strong{color:#f2d08a}.int-answer{padding:12px;border-radius:8px;background:#0d1727;white-space:pre-wrap;margin:8px 0}.int-warning{border-left:3px solid #dfaa59;padding:10px;background:#2a2630}.int-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}

</style></head><body><header><div class="logo">READ<span>//</span>DECK <small> / SHEETS</small></div><nav><button class="secondary" onclick="show('student')">STUDENT</button><button class="secondary" onclick="show('teacher')">TEACHER</button></nav></header><main>

<section id="student"><div class="sub">STUDENT PORTAL</div><h1>Ready to read?</h1><div class="panel" id="login"><label>Choose your name</label><select id="studentId"></select><label>Your letter code</label><input id="pin" type="password" autocapitalize="characters" placeholder="e.g. OLIS"><button onclick="enterStudent()">Open my assessments →</button></div><div id="studentTasks"></div></section>

<section id="teacher" class="hidden"><div class="sub">TEACHER CONTROL ROOM</div><h1>Reading intelligence.</h1><div class="panel" id="teacherLogin"><label>Teacher email</label><input id="teacherEmail" type="email" autocomplete="username" placeholder="you@school.edu.au" required><label>Teacher password</label><input id="teacherPass" type="password" placeholder="Teacher password (12+ characters)"><div class="row"><button onclick="openTeacher()">Sign in</button></div><small>For a pilot only. Use school-approved hosting and identity controls for real student data.</small></div><div id="adminUI" class="hidden"><nav><button class="secondary" onclick="tab('dashboard')">DATA DECK</button><button class="secondary" onclick="tab('intelligence');renderIntelligence()">TEACHING INTELLIGENCE</button><button class="secondary" onclick="tab('studio')">STORY STUDIO</button><button class="secondary" onclick="tab('roster')">STUDENTS</button><button class="secondary" onclick="tab('import')">PAPER / CSV</button><button class="secondary" onclick="refresh()">↻ REFRESH</button></nav><div id="dashboard"></div><div id="intelligence" class="hidden"></div><div id="studio" class="hidden"></div><div id="roster" class="hidden"></div><div id="import" class="hidden"></div></div></section></main><div id="printArea" class="paper"></div><div id="msg" class="hidden"></div>

<script>

const $=x=>document.getElementById(x);let pass='',teacherEmail='',data=null,selectedStudent='',studentPin='',assessment=null,questions=[];const skills=['Retrieval','Inference','Vocabulary','Text structure','Author craft','Evaluating'];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function toast(t){$('msg').textContent=t;$('msg').classList.remove('hidden');setTimeout(()=>$('msg').classList.add('hidden'),5000)}function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||e)))[fn](...args))}function show(n){['student','teacher'].forEach(x=>$(x).classList.toggle('hidden',x!==n))}function tab(n){['dashboard','intelligence','studio','roster','import'].forEach(x=>$(x).classList.toggle('hidden',x!==n))}async function start(){try{let x=await call('catalogue');$('studentId').innerHTML='<option value="">Select student</option>'+x.students.map(s=>`<option value="${esc(s.studentId)}">${esc(s.name)}</option>`).join('')}catch(e){toast(e.message)}}async function openTeacher(){teacherEmail=$('teacherEmail').value.trim().toLowerCase();pass=$('teacherPass').value;if(!teacherEmail||!pass)return toast('Enter your teacher email and password');try{await refresh();if(!data)return;$('teacherLogin').classList.add('hidden');$('adminUI').classList.remove('hidden')}catch(e){toast(e.message)}}async function refresh(){try{data=await call('admin','overview',pass,{},teacherEmail);renderDashboard();renderStudio();renderRoster();renderImport();addQuickActions();if(!$('intelligence').classList.contains('hidden'))renderIntelligence()}catch(e){toast(e.message)}}async function enterStudent(){try{selectedStudent=$('studentId').value;studentPin=$('pin').value;const x=await call('studentData',selectedStudent,studentPin);$('login').classList.add('hidden');$('studentTasks').innerHTML=`<div class="panel"><h2>Choose an assessment</h2>${x.assessments.length?x.assessments.map((a,i)=>`<button class="secondary" onclick="launch(${i})">${esc(a.title)} · Year ${esc(a.year)}</button> `).join(''):'All published assessments completed.'}</div>`;window.available=x.assessments}catch(e){toast(e.message)}}function launch(i){assessment=window.available[i];$('studentTasks').innerHTML=`<div class="sub">${esc(assessment.title)}</div><div class="panel"><h2>Reading passage</h2><div style="white-space:pre-wrap;line-height:1.75">${esc(assessment.story)}</div></div><form id="answers">${assessment.questions.map(q=>`<div class="panel"><div class="pill">QUESTION ${q.number}</div><h2>${esc(q.prompt)}</h2>${q.type==='mcq'?q.options.map(o=>`<label style="display:block;padding:8px"><input style="width:auto" type="radio" name="${q.questionId}" value="${esc(o)}"> ${esc(o)}</label>`).join(''):`<textarea name="${q.questionId}" placeholder="Write your answer"></textarea>`}</div>`).join('')}<button type="submit">Submit my answers</button></form>`;$('answers').onsubmit=async e=>{e.preventDefault();const answers={};assessment.questions.forEach(q=>{let els=document.getElementsByName(q.questionId);answers[q.questionId]=q.type==='mcq'?[...els].find(x=>x.checked)?.value||'':els[0].value});try{await call('submit',selectedStudent,studentPin,assessment.assessmentId,answers);$('studentTasks').innerHTML='<div class="panel"><h1>Submitted ✓</h1><p>Your teacher can see your results.</p><button onclick="location.reload()">Finish</button></div>'}catch(err){toast(err.message)}}}

function renderDashboard(){let rs=data.responses.filter(r=>r.status==='marked'&&r.variant!=='supported'),total=rs.reduce((s,r)=>s+Number(r.maxPoints),0),earned=rs.reduce((s,r)=>s+Number(r.points),0),pct=total?Math.round(100*earned/total):0;let grouped=skills.map(skill=>{let ids=new Set(data.questions.filter(q=>q.skill===skill).map(q=>q.questionId)),items=rs.filter(r=>ids.has(r.questionId)),max=items.reduce((s,r)=>s+Number(r.maxPoints),0);return {skill,pct:max?Math.round(items.reduce((s,r)=>s+Number(r.points),0)/max*100):null,count:items.length}});$('dashboard').innerHTML=`<div class="grid"><div class="panel"><div class="sub">STANDARD ACCURACY</div><div class="metric">${pct}%</div></div><div class="panel"><div class="sub">STUDENTS</div><div class="metric">${data.students.length}</div></div><div class="panel"><div class="sub">SUBMISSIONS</div><div class="metric">${data.submissions.length}</div></div><div class="panel"><div class="sub">AWAITING REVIEW</div><div class="metric">${data.responses.filter(r=>r.status==='review').length}</div></div></div><div class="split"><div class="panel"><h2>STANDARD SKILL INTELLIGENCE</h2>${grouped.map(x=>`<div>${esc(x.skill)} <span class="muted">${x.pct===null?'No data':x.pct+'%'} · ${x.count} responses</span><div class="bar"><div style="width:${x.pct||0}%;background:${skillColor(x.skill)}"></div></div></div>`).join('')}</div><div class="panel"><h2>STUDENT SIGNALS</h2><label>Choose student</label><select id="profileStudent" onchange="renderProfile(this.value)"><option value="">Choose…</option>${data.students.map(s=>`<option value="${s.studentId}">${esc(s.name)}</option>`).join('')}</select><div id="profile"></div></div></div><div class="panel"><h2>WRITTEN ANSWERS TO REVIEW</h2>${data.responses.filter(r=>r.status==='review').map(r=>{let q=data.questions.find(q=>q.questionId===r.questionId),s=data.students.find(s=>s.studentId===r.studentId);return `<div class="q"><b>${esc(s?.name)} · ${esc(q?.skill)}</b><p>${esc(q?.prompt)}</p><p>Answer: ${esc(r.answer)}</p><label>Score / ${r.maxPoints}</label><input type="number" id="score_${r.responseId}" min="0" max="${r.maxPoints}" step="0.5" value="0"><input id="feedback_${r.responseId}" placeholder="Optional feedback"><button onclick="mark('${r.responseId}')">Save mark</button></div>`}).join('')||'<p>No responses awaiting marking.</p>'}</div>`}

function addQuickActions(){

 const dashboard=$('dashboard');

 if(dashboard){dashboard.insertAdjacentHTML('afterbegin',`<div class="panel" style="border-color:#a88748;background:linear-gradient(110deg,#202d3f,#131d2d)"><div class="sub">GET STARTED</div><h2>Explore READ//DECK</h2><p>Load fictional results to preview the Data Deck, or import a complete assessment prepared in ChatGPT.</p><div class="row"><button onclick="addDemo()">✦ Populate demo data</button><button class="secondary" onclick="clearDemo()">Clear demo data</button><button class="secondary" onclick="tab('studio');document.getElementById('jsonPaste')?.focus()">↓ Import an assessment</button></div><small>Demo data is added to the current spreadsheet. Use a test copy.</small></div>`);}

 const studio=$('studio');

 if(studio){studio.insertAdjacentHTML('afterbegin',`<div class="panel" style="border-color:#a88748"><div class="sub">CHATGPT → READ//DECK</div><h2>Import an assessment</h2><p>Paste the complete READ//DECK JSON assessment from ChatGPT below, or use the JSON file upload further down this page. Imported assessments are saved as unpublished drafts. To include a Supported version, use a "supported" object with "story" and "questions" alongside the standard "story" and "questions".</p><textarea id="jsonPaste" style="min-height:170px" placeholder='{ "title": "...", "year": 4, "story": "...", "questions": [...] }'></textarea><button onclick="importPastedAssessment()">Import pasted JSON →</button></div>`);}

}

async function importPastedAssessment(){

 const raw=$('jsonPaste')?.value.trim();

 if(!raw)return toast('Paste an assessment JSON first');

 try{const result=await call('admin','assessmentImport',pass,{json:raw},teacherEmail);await refresh();tab('studio');toast('Imported '+result.count+' questions as a draft. Review before publishing.');}

 catch(e){toast(e.message)}

}

function renderProfile(sid){let rs=data.responses.filter(r=>r.studentId===sid&&r.status==='marked');let html=skills.map(skill=>{let ids=new Set(data.questions.filter(q=>q.skill===skill).map(q=>q.questionId)),rr=rs.filter(r=>ids.has(r.questionId)),max=rr.reduce((s,r)=>s+Number(r.maxPoints),0),p=max?Math.round(rr.reduce((s,r)=>s+Number(r.points),0)/max*100):null;return `<div>${esc(skill)} · ${p===null?'—':p+'%'}<div class="bar"><div style="width:${p||0}%;background:${skillColor(skill)}"></div></div></div>`}).join('');$('profile').innerHTML=html}async function mark(id){try{await call('admin','mark',pass,{responseId:id,points:Number($('score_'+id).value),feedback:$('feedback_'+id).value},teacherEmail);await refresh()}catch(e){toast(e.message)}}

function renderRoster(){const active=data.students.filter(s=>String(s.active)!=='false').length;const rows=data.students.map(s=>{const sid=esc(s.studentId),v=s.readingVersion==='supported'?'supported':'standard';return `<tr><td>${esc(s.name)} ${String(s.active)==='false'?'<span class="pill">ARCHIVED</span>':''}</td><td>${sid}</td><td><select aria-label="Default reading version" onchange="setReadingVersion('${sid}',this.value)"><option value="standard" ${v==='standard'?'selected':''}>Standard</option><option value="supported" ${v==='supported'?'selected':''}>Supported</option></select></td><td><button class="secondary" onclick="editStudent('${sid}')">Edit</button> <button class="secondary" onclick="archiveStudent('${sid}',${String(s.active)==='false'})">${String(s.active)==='false'?'Restore':'Archive'}</button> <button class="secondary" onclick="deleteStudent('${sid}')">Delete</button></td></tr>`}).join('');$('roster').innerHTML=`<div class="panel"><h2>Add student</h2><label>Name</label><input id="newName" oninput="suggestPin()"><label>Student letter code (automatically suggested)</label><input id="newPin" autocapitalize="characters" placeholder="e.g. OLIS"><button onclick="addStudent()">Add student</button></div><div class="panel"><h2>Reading versions</h2><p>Set each student's usual version here. Students do not see this setting. You can also override it for one assessment below.</p><p>${active} active students · ${data.students.filter(s=>s.readingVersion==='supported'&&String(s.active)!=='false').length} assigned Supported</p><div style="overflow:auto"><table><tr><th>Name</th><th>ID</th><th>Default reading</th><th>Manage</th></tr>${rows}</table></div></div><div class="panel"><h2>Assessment-specific overrides</h2><p>Choose a student and assessment. "Use default" follows the setting above.</p><label>Student</label><select id="overrideStudent" onchange="updateOverrideDisplay()"><option value="">Choose student</option>${data.students.filter(s=>String(s.active)!=='false').map(s=>`<option value="${esc(s.studentId)}">${esc(s.name)}</option>`).join('')}</select><label>Assessment</label><select id="overrideAssessment" onchange="updateOverrideDisplay()"><option value="">Choose assessment</option>${data.assessments.map(a=>`<option value="${esc(a.assessmentId)}">${esc(a.title)}</option>`).join('')}</select><label>Version for this assessment</label><select id="overrideVersion"><option value="default">Use student's default</option><option value="standard">Standard</option><option value="supported">Supported</option></select><button onclick="saveOverride()">Save assessment override</button></div><div class="panel"><h2>Fictional demonstration data</h2><button class="secondary" onclick="addDemo()">Populate demo data</button> <button class="secondary" onclick="clearDemo()">Clear demo data</button></div>`}
async function setReadingVersion(studentId,variant){try{await call('admin','studentVersion',pass,{studentId,variant},teacherEmail);await refresh();toast('Reading version updated')}catch(e){toast(e.message);await refresh()}}
async function editStudent(studentId){const s=data.students.find(s=>s.studentId===studentId);if(!s)return;const name=prompt('Student name:',s.name);if(name===null)return;const pin=prompt('New four-letter code (leave blank to keep existing code):','');if(pin===null)return;try{await call('admin','studentEdit',pass,{studentId,name,pin},teacherEmail);await refresh();await start();toast('Student updated')}catch(e){toast(e.message)}}
async function archiveStudent(studentId,restore){const s=data.students.find(s=>s.studentId===studentId);if(!s||!confirm((restore?'Restore ':'Archive ')+s.name+'?'))return;try{await call('admin','studentArchive',pass,{studentId,active:restore},teacherEmail);await refresh();await start();toast(restore?'Student restored':'Student archived')}catch(e){toast(e.message)}}
async function deleteStudent(studentId){const s=data.students.find(s=>s.studentId===studentId);if(!s)return;const responses=data.responses.filter(r=>r.studentId===studentId).length,submissions=data.submissions.filter(r=>r.studentId===studentId).length;const confirmation=prompt(`PERMANENT DELETE: ${s.name}\nThis deletes ${submissions} submissions and ${responses} responses.\nType the student's full name exactly to confirm:`);if(confirmation!==s.name)return toast('Deletion cancelled');try{await call('admin','studentDelete',pass,{studentId,confirmation},teacherEmail);await refresh();await start();toast('Student permanently deleted')}catch(e){toast(e.message)}}
function updateOverrideDisplay(){const sid=$('overrideStudent').value,aid=$('overrideAssessment').value;const found=(data.overrides||[]).find(x=>x.studentId===sid&&x.assessmentId===aid);$('overrideVersion').value=found?.variant||'default'}
async function saveOverride(){const studentId=$('overrideStudent').value,assessmentId=$('overrideAssessment').value,variant=$('overrideVersion').value;if(!studentId||!assessmentId)return toast('Choose student and assessment');try{await call('admin','versionOverride',pass,{studentId,assessmentId,variant},teacherEmail);await refresh();toast('Assessment version saved')}catch(e){toast(e.message)}}
function suggestPin(){const w=($('newName')?.value||'').trim().toUpperCase().match(/[A-Z]+/g)||[];if(w.length>1)$('newPin').value=w[0].slice(0,3).padEnd(3,'X')+w[w.length-1][0]}async function addStudent(){try{await call('admin','student',pass,{name:$('newName').value,pin:$('newPin').value},teacherEmail);await refresh();await start();toast('Student added')}catch(e){toast(e.message)}}


async function clearDemo(){
  try{
    const info=await call('admin','demoPreview',pass,{},teacherEmail);
    const summary=`Demo records to remove:\n${info.students} students\n${info.assessments} assessments\n${info.questions} questions\n${info.responses} responses\n${info.submissions} submissions`;
    if(info.blocked){alert(summary+'\n\nDeletion blocked: non-demo students have work linked to demo assessments.');return;}
    if(!info.students&&!info.assessments&&!info.questions&&!info.responses&&!info.submissions){toast('No demo data to clear');return;}
    const confirmation=prompt(summary+'\n\nType CLEAR DEMO to permanently delete these records:');
    if(confirmation!=='CLEAR DEMO'){if(confirmation!==null)toast('Deletion cancelled — confirmation did not match');return;}
    const result=await call('admin','demoClear',pass,{confirmation:'CLEAR DEMO'},teacherEmail);
    toast('Cleared '+result.students+' demo students and '+result.responses+' responses');
    await refresh();await start();
  }catch(e){toast('Could not clear demo data: '+e.message)}
}

async function addDemo(){if(!confirm('Add fictional students and results to this Google Sheet? Use a test copy.'))return;try{const x=await call('admin','demo',pass,{},teacherEmail);toast('Created '+x.students+' demo students and '+x.responses+' responses');await refresh();await start()}catch(e){toast(e.message)}}function renderStudio(){$('studio').innerHTML=`<div class="panel"><h2>Create an assessment</h2><label>Title</label><input id="aTitle" placeholder="The Great Waterslide Scandal"><label>Year level</label><select id="aYear">${[3,4,5,6].map(x=>`<option ${x===4?'selected':''}>${x}</option>`).join('')}</select><label>Paste story</label><textarea id="aStory" style="min-height:180px"></textarea><h2>Questions</h2><p class="muted">Or import an entire AI-generated assessment using the JSON importer below.</p><div id="qEditor"></div><button class="secondary" onclick="addQuestion()">+ Add question</button> <button onclick="saveAssessment()">Save assessment</button></div><div class="panel"><h2>Import a complete assessment from ChatGPT</h2><p>Upload a READ//DECK JSON file containing the standard story/questions and optionally supported: {story, questions}. It will be saved as a draft for your review.</p><input id="assessmentJsonFile" type="file" accept=".json,application/json"><button onclick="importAssessmentFile()">Import assessment JSON</button><p class="muted">Use the included assessment-template.json as a guide.</p></div><div class="panel"><h2>Assessments</h2>${data.assessments.map(a=>`<div class="q"><b>${esc(a.title)}</b> <span class="pill">${a.published?'PUBLISHED':'DRAFT'}</span><p>${esc(a.assessmentId)} · Year ${a.year} · ${a.supportedStory?'Standard + Supported':'Standard only'}</p><button class="secondary" onclick="printAssessment('${a.assessmentId}','standard')">Print Standard</button> ${a.supportedStory?`<button class="secondary" onclick="printAssessment('${a.assessmentId}','supported')">Print Supported</button>`:''} <button onclick="publish('${a.assessmentId}',${String(a.published)!=='true'})">${String(a.published)==='true'?'Unpublish':'Publish'}</button></div>`).join('')}</div>`;questions=[];addQuestion()}

async function importAssessmentFile(){let f=$('assessmentJsonFile').files[0];if(!f)return toast('Choose a JSON file');try{let result=await call('admin','assessmentImport',pass,{json:await f.text()},teacherEmail);toast('Imported '+result.count+' questions as a draft');await refresh()}catch(e){toast(e.message)}}function addQuestion(){let i=questions.length;questions.push(i);$('qEditor').insertAdjacentHTML('beforeend',`<div class="q" id="qe${i}"><b>Question ${i+1}</b><label>Prompt</label><textarea id="qp${i}" style="min-height:65px"></textarea><div class="split"><div><label>Type</label><select id="qt${i}"><option value="mcq">Multiple choice</option><option value="written">Written</option></select></div><div><label>Skill</label><select id="qs${i}">${skills.map(s=>`<option>${s}</option>`).join('')}</select></div></div><label>Options for multiple choice (one per line)</label><textarea id="qo${i}" placeholder="Option A&#10;Option B&#10;Option C" style="min-height:80px"></textarea><label>Correct option (exact text), or written answer guide</label><input id="qa${i}"><div class="split"><div><label>Difficulty 1–5</label><input type="number" min="1" max="5" value="3" id="qd${i}"></div><div><label>Max points</label><input type="number" min="1" max="10" value="1" id="qm${i}"></div></div></div>`)}async function saveAssessment(){try{let q=questions.map(i=>({prompt:$('qp'+i).value,type:$('qt'+i).value,skill:$('qs'+i).value,options:$('qo'+i).value.split('\n').map(s=>s.trim()).filter(Boolean),answer:$('qa'+i).value,difficulty:$('qd'+i).value,maxPoints:$('qm'+i).value}));await call('admin','assessment',pass,{title:$('aTitle').value,year:$('aYear').value,story:$('aStory').value,questions:q},teacherEmail);await refresh();toast('Assessment saved as draft')}catch(e){toast(e.message)}}async function publish(a,published){try{await call('admin','publish',pass,{assessmentId:a,published},teacherEmail);await refresh()}catch(e){toast(e.message)}}

function printAssessment(aid,variant="standard"){let a=data.assessments.find(x=>x.assessmentId===aid),q=data.questions.filter(x=>x.assessmentId===aid&&(variant==='supported'?x.variant==='supported':!x.variant||x.variant==='standard')).sort((x,y)=>x.number-y.number);$('printArea').innerHTML=`<h1>${esc(a.title)}</h1><p>Student: __________________________ Date: ______________</p><p>Assessment ID: ${esc(aid)}</p><div style="white-space:pre-wrap;line-height:1.6">${esc(variant==='supported'&&a.supportedStory?a.supportedStory:a.story)}</div><div class="pagebreak"></div><h1>${esc(a.title)} — Questions</h1><p>Student ID: __________________________</p>${q.map(x=>`<div class="pq"><b>${x.number}. ${esc(x.prompt)}</b>${x.type==='mcq'?JSON.parse(x.optionsJson||'[]').map((o,i)=>`<p>◯ ${String.fromCharCode(65+i)}. ${esc(o)}</p>`).join(''):'<div class="lines"></div>'}</div>`).join('')}`;window.print()}

function renderImport(){$('import').innerHTML=`<div class="panel"><h2>Paper scan → CSV import</h2><p>Scan the completed papers, have an approved AI tool transcribe and propose marks, then review its CSV before importing. Required columns: <b>studentId,assessmentId,questionId,answer,points</b>.</p><p>Use the exact IDs shown in the roster and question map below. Do not upload identifiable student work to an unapproved external AI service.</p><input type="file" id="csvFile" accept=".csv,text/csv"><button onclick="previewCsv()">Preview CSV</button><div id="csvPreview"></div></div><div class="panel"><h2>Question ID map</h2><table><tr><th>Assessment</th><th>Question ID</th><th>Skill</th><th>Max points</th></tr>${data.questions.map(q=>`<tr><td>${esc(q.assessmentId)}</td><td>${esc(q.questionId)}</td><td>${esc(q.skill)}</td><td>${esc(q.maxPoints)}</td></tr>`).join('')}</table><button class="secondary" onclick="downloadTemplate()">Download CSV template</button></div>`}function downloadTemplate(){download('readdeck-import-template.csv','studentId,assessmentId,questionId,answer,points\n')}function download(name,txt){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}let csvText='';async function previewCsv(){let f=$('csvFile').files[0];if(!f)return toast('Choose a CSV');csvText=await f.text();let lines=csvText.trim().split(/\r?\n/);$('csvPreview').innerHTML=`<p>${lines.length-1} data rows detected. Check the file carefully before importing.</p><pre style="white-space:pre-wrap;overflow:auto">${esc(lines.slice(0,7).join('\n'))}</pre><button onclick="commitCsv()">Confirm import to Google Sheets</button>`}async function commitCsv(){if(!confirm('Import reviewed results? This writes to the Google Sheet.'))return;try{let r=await call('admin','import',pass,{csv:csvText},teacherEmail);toast(r.count+' responses imported');await refresh()}catch(e){toast(e.message)}}

const SKILL_COLORS={'Retrieval':'#4DAF8A','Inference':'#E1A65A','Vocabulary':'#70A8DF','Text structure':'#A78BFA','Author craft':'#E18BAF','Evaluating':'#E3C96A'};

let intelAssessment='all',intelStudent='',intelQuestion='',intelGroupSkill='',intelVersion='standard';

function skillColor(skill){return SKILL_COLORS[skill]||'#cbd5e1'}

function scoreStats(rr){const marked=rr.filter(r=>r.status==='marked'&&r.points!==''&&r.points!==null);const earned=marked.reduce((a,r)=>a+Number(r.points),0),possible=marked.reduce((a,r)=>a+Number(r.maxPoints),0);return {n:marked.length,earned,possible,pct:possible?Math.round(earned/possible*100):null,students:new Set(marked.map(r=>r.studentId)).size}}

function pctLabel(x){return x===null?'Awaiting marks':x+'%'}

function intelSelectVersion(v){intelVersion=v;intelQuestion='';renderIntelligence()}
function intelSelectAssessment(v){intelAssessment=v;intelQuestion='';renderIntelligence()}

function intelSelectStudent(v){intelStudent=v;renderIntelligence()}

function intelSelectQuestion(v){intelQuestion=v;renderIntelligence()}

function intelSelectGroup(v){intelGroupSkill=v;renderIntelligence()}

function renderIntelligence(){

 if(!data)return;

 const aList=data.assessments||[],qList=data.questions||[],rList=data.responses||[],students=data.students||[];

 const qs=qList.filter(q=>(intelAssessment==='all'||q.assessmentId===intelAssessment)&&(intelVersion==='supported'?q.variant==='supported':!q.variant||q.variant==='standard'));

 const qIds=new Set(qs.map(q=>q.questionId));

 const responses=rList.filter(r=>qIds.has(r.questionId));

 const questionStats=qs.map(q=>({q,stats:scoreStats(responses.filter(r=>r.questionId===q.questionId))})).filter(x=>x.stats.n).sort((a,b)=>(a.stats.pct??101)-(b.stats.pct??101));

 const skillStats=skills.map(skill=>{const ids=new Set(qs.filter(q=>q.skill===skill).map(q=>q.questionId));return {skill,stats:scoreStats(responses.filter(r=>ids.has(r.questionId))),questions:new Set(qs.filter(q=>q.skill===skill&&responses.some(r=>r.questionId===q.questionId&&r.status==='marked')).map(q=>q.questionId)).size}});

 const priorities=skillStats.filter(x=>x.stats.n>=6&&x.questions>=2&&x.stats.pct<65).sort((a,b)=>a.stats.pct-b.stats.pct);

 const groups=skills.map(skill=>{const ids=new Set(qs.filter(q=>q.skill===skill).map(q=>q.questionId));const members=students.map(s=>{const st=scoreStats(responses.filter(r=>r.studentId===s.studentId&&ids.has(r.questionId)));return {s,st}}).filter(x=>x.st.n>=2&&x.st.pct<60);return {skill,members}}).filter(x=>x.members.length);

 const options=aList.map(a=>`<option value="${esc(a.assessmentId)}" ${intelAssessment===a.assessmentId?'selected':''}>${esc(a.title)}</option>`).join('');

 const studentOpts=students.map(s=>`<option value="${esc(s.studentId)}" ${intelStudent===s.studentId?'selected':''}>${esc(s.name)}</option>`).join('');

 const el=$('intelligence');

 el.innerHTML=`<div class="panel"><div class="sub">CLASSROOM COMMAND CENTRE</div><h1>Teaching Intelligence</h1><p>Identify tricky questions, recurring skill gaps and targeted teaching groups. Results use marked answers only.</p><label>Reading version (results are not combined)</label><select onchange="intelSelectVersion(this.value)"><option value="standard" ${intelVersion==='standard'?'selected':''}>Standard</option><option value="supported" ${intelVersion==='supported'?'selected':''}>Supported</option></select><label>Assessment filter</label><select onchange="intelSelectAssessment(this.value)"><option value="all">All assessments</option>${options}</select><div class="int-grid"><div class="int-card"><div class="sub">MARKED RESPONSES</div><div class="metric">${scoreStats(responses).n}</div></div><div class="int-card"><div class="sub">STANDARD ACCURACY</div><div class="metric">${pctLabel(scoreStats(responses).pct)}</div></div><div class="int-card"><div class="sub">SKILLS TO INVESTIGATE</div><div class="metric">${priorities.length}</div><div class="tiny">Below 65%, ≥2 questions, ≥6 responses</div></div></div></div>

 <div class="panel"><h2>Skill performance</h2><p>Each skill has a consistent colour across the Data Deck and assessment reviews.</p>${skillStats.map(x=>`<div style="margin:17px 0"><div class="int-row"><span><i class="skill-dot" style="background:${skillColor(x.skill)}"></i><b>${esc(x.skill)}</b></span><span>${pctLabel(x.stats.pct)} <span class="tiny">· ${x.questions} questions · ${x.stats.students} students</span></span></div><div class="skill-meter"><span style="width:${x.stats.pct||0}%;background:${skillColor(x.skill)}"></span></div></div>`).join('')}<div class="tiny">A single question is not enough to establish a persistent weakness. Review question wording and sample sizes.</div></div>

 <div class="panel"><h2>Whole-class teaching priorities</h2>${priorities.length?priorities.map(x=>`<div class="int-card"><div class="int-row"><b><i class="skill-dot" style="background:${skillColor(x.skill)}"></i>${esc(x.skill)}</b><strong>${x.stats.pct}%</strong></div><p>${x.stats.students} students · ${x.questions} questions · ${x.stats.n} marked answers</p><div class="tiny">Teaching focus: ${esc(teachingFocus(x.skill))}</div></div>`).join(''):'<p>No skills currently meet the evidence threshold for a whole-class priority.</p>'}</div>

 <div class="panel"><h2>Questions causing difficulty</h2><p>Ranked by the percentage of available marks earned. Select a question to inspect answers and identify patterns.</p>${questionStats.length?questionStats.map(x=>`<div class="int-card"><div class="int-row"><b><i class="skill-dot" style="background:${skillColor(x.q.skill)}"></i>Q${esc(x.q.number)} · ${esc(x.q.skill)}</b><strong>${x.stats.pct}%</strong></div><p>${esc(x.q.prompt)}</p><div class="tiny">${x.stats.students} students · ${x.stats.n} marked answers · difficulty ${esc(x.q.difficulty)}/5</div><button class="secondary" onclick="intelSelectQuestion('${esc(x.q.questionId)}')">${intelQuestion===x.q.questionId?'Hide answer breakdown':'Inspect answers'}</button>${intelQuestion===x.q.questionId?questionBreakdown(x.q,responses,students):''}</div>`).join(''):'<p>No marked questions yet.</p>'}</div>

 <div class="panel"><h2>Suggested small groups</h2><p>Students with at least two marked answers in the skill and below 60% accuracy. These are suggestions, not permanent ability groups.</p>${groups.length?groups.map(g=>`<div class="int-card"><div class="int-row"><b><i class="skill-dot" style="background:${skillColor(g.skill)}"></i>${esc(g.skill)}</b><strong>${g.members.length} students</strong></div><div class="tiny">${esc(teachingFocus(g.skill))}</div><button class="secondary" onclick="intelSelectGroup('${esc(g.skill)}')">${intelGroupSkill===g.skill?'Hide group':'Show students'}</button>${intelGroupSkill===g.skill?`<p>${g.members.map(m=>esc(m.s.name)+' ('+m.st.pct+'%, '+m.st.n+' answers)').join(' · ')}</p><button onclick="copyGroup('${esc(g.skill)}')">Copy group plan</button>`:''}</div>`).join(''):'<p>No suggested groups meet the current threshold.</p>'}</div>

 <div class="panel"><h2>Individual assessment review</h2><label>Select student</label><select onchange="intelSelectStudent(this.value)"><option value="">Choose a student</option>${studentOpts}</select>${intelStudent?studentReview(intelStudent,aList,qList,rList):'<p>Select a student to see their assessments, original answers, expected answers and marks.</p>'}</div>`;

}

function teachingFocus(skill){return ({'Retrieval':'Locate and quote explicitly stated information','Inference':'Combine clues and explain implied meaning using evidence','Vocabulary':'Use context clues to work out unfamiliar words','Text structure':'Identify how sequencing and organisation shape meaning','Author craft':'Explain the effect of an author’s language choices','Evaluating':'Justify interpretations with relevant textual evidence'})[skill]||'Review examples and model strategies'}

function questionBreakdown(q,responses,students){

 const rr=responses.filter(r=>r.questionId===q.questionId);

 const marked=rr.filter(r=>r.status==='marked');

 const pending=rr.filter(r=>r.status!=='marked').length;

 const options=q.type==='mcq'?JSON.parse(q.optionsJson||'[]'):[];

 return `<div class="int-answer"><b>Answer key:</b> ${esc(q.answer)}<p class="tiny">${pending} answer(s) awaiting teacher marking</p>${options.length?options.map(o=>`<div class="int-row"><span>${esc(o)}</span><b>${rr.filter(r=>r.answer===o).length} selected</b></div>`).join(''):''}<h3>Student responses</h3>${rr.map(r=>{const s=students.find(s=>s.studentId===r.studentId);return `<div style="border-top:1px solid #344156;padding:9px 0"><b>${esc(s?.name||r.studentId)}</b> · ${r.status==='marked'?esc(r.points)+'/'+esc(r.maxPoints):'Awaiting review'}<div>${esc(r.answer||'(blank)')}</div>${r.feedback?`<div class="tiny">Feedback: ${esc(r.feedback)}</div>`:''}</div>`}).join('')||'No responses'}</div>`

}

function studentReview(sid,assessments,questions,responses){

 const rr=responses.filter(r=>r.studentId===sid&&(intelVersion==='supported'?r.variant==='supported':r.variant!=='supported')),grouped=assessments.map(a=>({a,rs:rr.filter(r=>r.assessmentId===a.assessmentId)})).filter(x=>x.rs.length);

 return grouped.length?grouped.map(({a,rs})=>{const st=scoreStats(rs);return `<div class="int-card"><h3>${esc(a.title)}</h3><div class="tiny">${pctLabel(st.pct)} · ${st.earned}/${st.possible} marked points · ${rs.filter(r=>r.status!=='marked').length} awaiting review</div>${questions.filter(q=>q.assessmentId===a.assessmentId&&(intelVersion==='supported'?q.variant==='supported':q.variant!=='supported')).map(q=>{const r=rs.find(r=>r.questionId===q.questionId);if(!r)return '';return `<div style="border-top:1px solid #344156;margin-top:14px;padding-top:12px"><b><i class="skill-dot" style="background:${skillColor(q.skill)}"></i>Q${esc(q.number)} · ${esc(q.skill)}</b> <span class="tiny">${r.status==='marked'?esc(r.points)+'/'+esc(r.maxPoints):'Awaiting marking'}</span><p>${esc(q.prompt)}</p><div class="int-answer"><div class="sub">STUDENT ANSWER</div>${esc(r.answer||'(No answer)')}</div><div class="tiny"><b>Expected:</b> ${esc(q.answer)}</div>${r.feedback?`<p class="tiny">Feedback: ${esc(r.feedback)}</p>`:''}${r.status!=='marked'?`<button class="secondary" onclick="tab('dashboard')">Mark in Data Deck</button>`:''}</div>`}).join('')}</div>`}).join(''):'<p>No assessments submitted yet.</p>'

}

function copyGroup(skill){const ids=new Set(data.questions.filter(q=>q.skill===skill&&(intelAssessment==='all'||q.assessmentId===intelAssessment)).map(q=>q.questionId));const names=data.students.map(s=>{const st=scoreStats(data.responses.filter(r=>r.studentId===s.studentId&&ids.has(r.questionId)));return {name:s.name,st}}).filter(x=>x.st.n>=2&&x.st.pct<60).map(x=>x.name);const text='READ//DECK teaching group\nSkill: '+skill+'\nFocus: '+teachingFocus(skill)+'\nStudents: '+names.join(', ')+'\nReassess with a fresh text after instruction.';navigator.clipboard.writeText(text).then(()=>toast('Group plan copied')).catch(()=>toast('Clipboard unavailable'))}



start();setInterval(()=>{if(pass&&data&&!$('teacher').classList.contains('hidden')&&!$('dashboard').classList.contains('hidden'))refresh()},15000);

</script></body></html>
